<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay LeetCode</title>
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --ink: #1d1f24;
  --muted: #6b7078;
  --line: #e3e1da;
  --accent: #b4541a;
  --accent-soft: #f6e7dc;
  --code-bg: #faf9f6;
  --easy: #1a8a5a;
  --medium: #b57a00;
  --hard: #c2362f;
  --kw: #a3287a;
  --type: #1c6fa3;
  --str: #2f7d32;
  --num: #a05a00;
  --com: #8a8f98;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b;
    --panel: #1c1f25;
    --ink: #e7e8ea;
    --muted: #979ca6;
    --line: #2c3038;
    --accent: #f0935a;
    --accent-soft: #33261d;
    --code-bg: #171a1f;
    --easy: #4ccb92;
    --medium: #e6b23e;
    --hard: #f0716a;
    --kw: #e28ac6;
    --type: #73bdea;
    --str: #8fce8f;
    --num: #e0a560;
    --com: #747a85;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; }

/* Cột trái */
.side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 20px 16px 12px; border-bottom: 1px solid var(--line); }
.brand { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
.stats { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tabs { display: flex; gap: 4px; margin: 10px 0 10px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.tab {
  flex: 1; font: inherit; font-size: 13px; padding: 5px 8px; border: 0; border-radius: 7px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.search {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

.list { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
.day { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 14px 8px 6px; }
.item {
  display: flex; align-items: baseline; gap: 8px; padding: 7px 8px; border-radius: 8px;
  color: inherit; text-decoration: none; font-size: 14px; line-height: 1.35;
}
.item:hover { background: var(--bg); }
.item.active { background: var(--accent-soft); }
.item .num { color: var(--muted); font-size: 12px; min-width: 28px; font-variant-numeric: tabular-nums; }
.item .name { flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.Easy { --d: var(--easy); } .Medium { --d: var(--medium); } .Hard { --d: var(--hard); }
.dot { background: var(--d); }
.empty { color: var(--muted); font-size: 14px; padding: 16px 8px; }

/* Nội dung */
.main { overflow-y: auto; min-height: 0; }
.doc { max-width: 780px; margin: 0 auto; padding: 40px 32px 96px; }
.eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--d); border: 1px solid var(--d); }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.ok { font-size: 12px; font-weight: 600; color: var(--easy); }
.link { font-size: 13px; color: var(--accent); text-decoration: none; margin-left: auto; }
.link:hover { text-decoration: underline; }

.cx { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 8px; }
.cx div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.cx span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cx b { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin: 36px 0 10px; }
.doc p { margin: 0 0 12px; }
.doc ul, .doc ol { margin: 0 0 12px; padding-left: 22px; }
.doc li { margin-bottom: 6px; }
.doc li > ul { margin-top: 6px; }
.doc :not(pre) > code { background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }

.codebox { position: relative; margin-top: 4px; }
pre {
  margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; line-height: 1.6; tab-size: 4;
}
.copy {
  position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
  background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
}
.copy:hover { color: var(--ink); }
.kw { color: var(--kw); } .ty { color: var(--type); } .st { color: var(--str); } .nu { color: var(--num); } .co { color: var(--com); font-style: italic; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
.nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
.nav a:hover { text-decoration: underline; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 38vh; }
  .main { overflow: visible; }
  .doc { padding: 28px 16px 72px; }
  h1 { font-size: 24px; }
  .link { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <p class="brand">Sổ tay LeetCode</p>
      <div class="tabs" id="tabs" role="tablist"></div>
      <p class="stats" id="stats"></p>
      <input class="search" id="q" type="search" placeholder="Tìm theo tên, số, chủ đề…" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <nav class="list" id="list"></nav>
  </aside>
  <main class="main" id="main"><article class="doc" id="doc"></article></main>
</div>

<script>window.LC_DATA = [{"id": 1, "category": "algorithms", "title": "Two Sum", "slug": "two-sum", "difficulty": "Easy", "topics": ["Array", "Hash Table"], "date": "2026-10-09", "time": "O(n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng số nguyên `nums` và số `target`. Trả về chỉ số của hai phần tử có tổng bằng `target`. Đề đảm bảo có đúng một đáp án và không được dùng một phần tử hai lần."}, {"title": "Cơ sở lý thuyết", "text": "- **Bảng băm (Hash Table)**: cấu trúc ánh xạ khóa → giá trị, tra cứu và chèn trung bình `O(1)`. Trong Swift đó là `Dictionary`.\n- **Bài toán \"phần bù\" (complement)**: thay vì hỏi \"cặp nào có tổng bằng target?\", ta hỏi \"với số `x` đang xét, số `target - x` đã từng xuất hiện chưa?\". Câu hỏi thứ hai trả lời được bằng một lần tra bảng băm.\n- Đánh đổi kinh điển **thời gian ↔ bộ nhớ**: dùng thêm `O(n)` bộ nhớ để giảm thời gian từ `O(n²)` xuống `O(n)`."}, {"title": "Hướng xử lý", "text": "1. Cách ngây thơ: hai vòng lặp lồng nhau thử mọi cặp `(i, j)` → `O(n²)`.\n2. Nhận xét: với mỗi `nums[i]`, phần tử còn lại bắt buộc phải bằng `target - nums[i]`. Việc \"tìm một giá trị cụ thể\" chính là thế mạnh của bảng băm.\n3. Duyệt một lượt từ trái sang phải, vừa duyệt vừa ghi nhớ các số đã qua. Vì chỉ tra những số **đứng trước**, ta không bao giờ dùng trùng một phần tử."}, {"title": "Ý tưởng triển khai", "text": "- Dùng `seen: [Int: Int]` lưu `giá trị → chỉ số`.\n- Với mỗi `(i, num)`: nếu `seen[target - num]` tồn tại thì trả về `[j, i]`; ngược lại ghi `seen[num] = i`.\n- **Tra trước, ghi sau**: thứ tự này xử lý đúng trường hợp hai số bằng nhau như `[3, 3]`, `target = 6`.\n- `return []` ở cuối chỉ để trình biên dịch vui lòng — đề đảm bảo luôn có đáp án."}, {"title": "Ghi nhớ", "text": "Thấy đề hỏi \"tìm cặp thỏa điều kiện tổng/hiệu\" trên mảng **chưa sắp xếp** → nghĩ ngay tới bảng băm. Nếu mảng đã sắp xếp → hai con trỏ, không cần bộ nhớ phụ."}], "code": "class Solution {\n    func twoSum(_ nums: [Int], _ target: Int) -> [Int] {\n        var seen = [Int: Int]()\n        for (i, x) in nums.enumerated() {\n            if let j = seen[target - x] {\n                return [j, i]\n            }\n            seen[x] = i\n        }\n        return []\n    }\n}\n"}, {"id": 2, "category": "algorithms", "title": "Add Two Numbers", "slug": "add-two-numbers", "difficulty": "Medium", "topics": ["Linked List", "Math", "Recursion"], "date": "2026-10-09", "time": "O(max(m, n))", "space": "O(1) phụ (không tính danh sách kết quả)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Hai số nguyên không âm được lưu dưới dạng danh sách liên kết, mỗi nút một chữ số, **theo thứ tự ngược** (hàng đơn vị đứng đầu). Trả về tổng của chúng cũng dưới dạng danh sách liên kết ngược."}, {"title": "Cơ sở lý thuyết", "text": "- **Danh sách liên kết đơn**: chỉ đi được một chiều qua `next`, không truy cập ngẫu nhiên.\n- **Phép cộng tay theo cột**: cộng từ hàng đơn vị lên, mỗi cột cho ra `chữ số = tổng % 10` và `nhớ = tổng / 10`. Số nhớ luôn chỉ là 0 hoặc 1 vì tối đa `9 + 9 + 1 = 19`.\n- **Nút giả (dummy head)**: tạo một nút đứng trước đầu danh sách kết quả để khỏi phải xử lý riêng trường hợp \"nút đầu tiên\"."}, {"title": "Hướng xử lý", "text": "1. Vì chữ số được lưu ngược, đầu danh sách chính là hàng đơn vị — đúng thứ tự mà phép cộng tay cần. Không phải đảo danh sách.\n2. Đi song song trên hai danh sách; danh sách nào hết trước thì coi chữ số của nó là `0`.\n3. Đừng quên số nhớ cuối cùng: `5 + 5 = 10` phải sinh thêm một nút `1`."}, {"title": "Ý tưởng triển khai", "text": "- Gộp cả ba điều kiện dừng vào một vòng lặp: `while a != nil || b != nil || carry > 0`. Nhờ vậy không cần viết đoạn \"xử lý phần còn lại\" hay \"thêm nút nhớ\" riêng.\n- `a?.val ?? 0` — optional chaining kết hợp nil-coalescing giúp coi nút thiếu là 0 một cách gọn gàng.\n- `tail` luôn trỏ tới nút cuối của kết quả; mỗi vòng gắn nút mới vào `tail.next` rồi dịch `tail`.\n- Trả về `dummy.next`."}, {"title": "Ghi nhớ", "text": "Mẫu **dummy head + con trỏ tail** dùng lại được cho hầu hết bài \"xây danh sách liên kết mới\" (merge, partition, remove...). Không chuyển sang `Int` rồi cộng: số có thể dài tới 100 chữ số, tràn mọi kiểu số nguyên."}], "code": "class Solution {\n    func addTwoNumbers(_ l1: ListNode?, _ l2: ListNode?) -> ListNode? {\n        let dummy = ListNode(0)\n        var tail = dummy\n        var a = l1, b = l2\n        var carry = 0\n\n        while a != nil || b != nil || carry > 0 {\n            let sum = (a?.val ?? 0) + (b?.val ?? 0) + carry\n            carry = sum / 10\n\n            tail.next = ListNode(sum % 10)\n            tail = tail.next!\n\n            a = a?.next\n            b = b?.next\n        }\n        return dummy.next\n    }\n}\n"}, {"id": 3, "category": "algorithms", "title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "difficulty": "Medium", "topics": ["Hash Table", "String", "Sliding Window"], "date": "2026-10-09", "time": "O(n)", "space": "O(n) (mảng ký tự; bảng băm tối đa bằng kích thước bảng chữ cái)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s`, tìm độ dài của chuỗi con (liên tiếp) dài nhất không chứa ký tự lặp lại."}, {"title": "Cơ sở lý thuyết", "text": "- **Cửa sổ trượt (Sliding Window)**: duy trì một đoạn liên tiếp `[start, i]` luôn thỏa một bất biến (ở đây: không có ký tự trùng). Biên phải chỉ tiến, biên trái cũng chỉ tiến → mỗi phần tử được xét `O(1)` lần, tổng `O(n)`.\n- **Tính đơn điệu**: nếu `[start, i]` có ký tự trùng thì mọi cửa sổ rộng hơn chứa nó cũng trùng. Vì thế không bao giờ cần lùi `start`.\n- **Bảng băm ký tự → vị trí**: cho phép biết ngay ký tự vừa gặp đã xuất hiện ở đâu, không phải dò lại cửa sổ."}, {"title": "Hướng xử lý", "text": "1. Vét cạn mọi chuỗi con là `O(n²)` đến `O(n³)`.\n2. Mở rộng cửa sổ sang phải từng ký tự. Khi ký tự mới `c` đã có trong cửa sổ, phải thu biên trái vượt qua lần xuất hiện trước đó của `c`.\n3. Thay vì thu từng bước (dùng `Set`), ta nhớ **vị trí gần nhất** của mỗi ký tự và nhảy `start` thẳng tới `last[c] + 1`."}, {"title": "Ý tưởng triển khai", "text": "- `Array(s)` để có chỉ số nguyên; `last: [Character: Int]` lưu chỉ số gần nhất của mỗi ký tự.\n- Điều kiện `j >= start` là mấu chốt: lần xuất hiện cũ chỉ gây xung đột khi nó còn **nằm trong cửa sổ**. Thiếu điều kiện này sẽ sai với `\"abba\"` (`start` bị kéo lùi về sau khi gặp `a` thứ hai).\n- Cập nhật `best = max(best, i - start + 1)` sau mỗi bước.\n- Muốn nhanh hơn thì đổi `Dictionary` thành mảng 128 ô duyệt trên `s.utf8`, nhưng bản này đã đủ qua và dễ đọc hơn."}, {"title": "Ghi nhớ", "text": "Cụm \"chuỗi con / mảng con **liên tiếp** dài nhất (ngắn nhất) thỏa điều kiện\" gần như luôn là cửa sổ trượt. Trong Swift, hãy chuyển sang `utf8` hoặc `Array(s)` trước khi cần chỉ số — `String.Index` không phải số nguyên."}], "code": "class Solution {\n    func lengthOfLongestSubstring(_ s: String) -> Int {\n        let a = Array(s)\n        var last = [Character: Int]()\n        var start = 0, best = 0\n\n        for i in 0..<a.count {\n            if let j = last[a[i]], j >= start {\n                start = j + 1\n            }\n            last[a[i]] = i\n            best = max(best, i - start + 1)\n        }\n        return best\n    }\n}\n"}, {"id": 4, "category": "algorithms", "title": "Median of Two Sorted Arrays", "slug": "median-of-two-sorted-arrays", "difficulty": "Hard", "topics": ["Array", "Binary Search", "Divide and Conquer"], "date": "2026-10-09", "time": "O(log(min(m, n)))", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho hai mảng đã sắp xếp `nums1` (độ dài `m`) và `nums2` (độ dài `n`). Tìm trung vị của hai mảng gộp lại, với độ phức tạp `O(log(m + n))`."}, {"title": "Cơ sở lý thuyết", "text": "- **Trung vị** chia tập dữ liệu thành hai nửa bằng nhau sao cho mọi phần tử nửa trái `≤` mọi phần tử nửa phải. Trung vị là `max(nửa trái)` (tổng lẻ) hoặc trung bình của `max(nửa trái)` và `min(nửa phải)` (tổng chẵn).\n- **Tìm kiếm nhị phân trên đáp án**: không tìm một giá trị trong mảng mà tìm một **vị trí cắt** thỏa điều kiện đơn điệu.\n- **Phân hoạch (partition)**: cắt `a` tại `i` và `b` tại `j`. Nếu cố định kích thước nửa trái là `half = (m + n + 1) / 2` thì `j = half - i` — chỉ còn **một** ẩn số `i`."}, {"title": "Hướng xử lý", "text": "1. Gộp hai mảng rồi lấy phần tử giữa là `O(m + n)` — đúng nhưng không đạt yêu cầu log.\n2. Yêu cầu `log` gợi ý tìm nhị phân. Ta tìm `i` sao cho phép cắt hợp lệ:\n   - `a[i-1] ≤ b[j]` (trái của `a` không vượt phải của `b`)\n   - `b[j-1] ≤ a[i]` (trái của `b` không vượt phải của `a`)\n3. Tính đơn điệu: nếu `a[i-1] > b[j]` thì ta lấy **quá nhiều** từ `a` → giảm `i`. Ngược lại, nếu `b[j-1] > a[i]` thì lấy quá ít → tăng `i`.\n4. Tìm nhị phân trên mảng **ngắn hơn** để đạt `O(log(min(m, n)))` và đảm bảo `j` không bao giờ âm."}, {"title": "Ý tưởng triển khai", "text": "- Hoán đổi để `a` là mảng ngắn hơn; `lo = 0`, `hi = m` (có `m + 1` vị trí cắt, kể cả lấy 0 hoặc lấy hết).\n- **Lính canh**: khi cắt ở mép, coi phần tử \"ngoài biên\" là `Int.min` (bên trái) hoặc `Int.max` (bên phải). Nhờ đó không phải viết nhánh riêng cho mảng rỗng hay cắt ở đầu/cuối.\n- `half = (m + n + 1) / 2` — cộng 1 để khi tổng lẻ, nửa trái nhiều hơn 1 phần tử, và trung vị chính là `max(aL, bL)`.\n- Khi tổng chẵn: `(max(aL, bL) + min(aR, bR)) / 2`.\n- Cách \"lười\" vẫn qua được LeetCode: `(nums1 + nums2).sorted()` rồi lấy phần tử giữa — `O((m+n) log(m+n))`, đáng biết để viết nhanh khi phỏng vấn trước khi tối ưu."}, {"title": "Ghi nhớ", "text": "Mấu chốt là đổi câu hỏi từ \"tìm phần tử thứ k\" thành \"tìm vị trí cắt hợp lệ\". Luôn nhị phân trên mảng ngắn hơn và dùng lính canh `±∞` cho biên — hai mẹo này loại bỏ gần hết lỗi lệch-một."}], "code": "class Solution {\n    func findMedianSortedArrays(_ nums1: [Int], _ nums2: [Int]) -> Double {\n        // a là mảng ngắn hơn\n        var a = nums1, b = nums2\n        if a.count > b.count { swap(&a, &b) }\n        let m = a.count, n = b.count\n        let half = (m + n + 1) / 2\n\n        var lo = 0, hi = m\n        while lo <= hi {\n            let i = (lo + hi) / 2\n            let j = half - i\n\n            let aL = i > 0 ? a[i - 1] : Int.min\n            let aR = i < m ? a[i] : Int.max\n            let bL = j > 0 ? b[j - 1] : Int.min\n            let bR = j < n ? b[j] : Int.max\n\n            if aL > bR {\n                hi = i - 1\n            } else if bL > aR {\n                lo = i + 1\n            } else {\n                if (m + n) % 2 == 1 { return Double(max(aL, bL)) }\n                return Double(max(aL, bL) + min(aR, bR)) / 2\n            }\n        }\n        return 0\n    }\n}\n"}, {"id": 5, "category": "algorithms", "title": "Longest Palindromic Substring", "slug": "longest-palindromic-substring", "difficulty": "Medium", "topics": ["Two Pointers", "String", "Dynamic Programming"], "date": "2026-10-09", "time": "O(n²)", "space": "O(n) (mảng ký tự của chuỗi)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s`, trả về chuỗi con đối xứng (palindrome) dài nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Palindrome** đọc xuôi ngược như nhau, tức đối xứng qua một **tâm**. Tâm có thể là một ký tự (độ dài lẻ, `aba`) hoặc khe giữa hai ký tự (độ dài chẵn, `abba`). Chuỗi dài `n` có `2n - 1` tâm.\n- **Tính chất lồng nhau**: nếu `s[l...r]` là palindrome thì `s[l+1...r-1]` cũng vậy. Ngược lại, palindrome mở rộng được khi và chỉ khi hai ký tự ở hai đầu bằng nhau.\n- Có ba cách phổ biến: quy hoạch động `O(n²)` thời gian + `O(n²)` bộ nhớ; **mở rộng từ tâm** `O(n²)` thời gian + `O(1)` bộ nhớ phụ; thuật toán **Manacher** `O(n)`."}, {"title": "Hướng xử lý", "text": "1. Vét cạn: thử mọi cặp `(l, r)` và kiểm tra đối xứng → `O(n³)`.\n2. Dùng tính chất lồng nhau: thay vì kiểm tra từ ngoài vào, ta đi **từ tâm ra**. Mỗi tâm mở rộng tối đa `O(n)` bước và dừng ngay khi gặp cặp ký tự khác nhau.\n3. Duyệt cả `2n - 1` tâm, giữ lại palindrome dài nhất.\n\nVới `n ≤ 1000`, `O(n²)` là quá đủ; Manacher chỉ cần khi `n` lên tới hàng trăm nghìn."}, {"title": "Ý tưởng triển khai", "text": "- Hàm lồng `expand(i, j)`: lùi `l`, tiến `r` khi còn khớp. Khi dừng, `l` và `r` đã vượt quá biên một bước nên palindrome là `a[l+1...r-1]`, độ dài `r - l - 1`.\n- Hàm lồng cập nhật thẳng `start`, `len` của hàm ngoài — khỏi phải trả về rồi tính ngược vị trí bắt đầu từ tâm.\n- Gọi `expand(i, i)` cho tâm lẻ và `expand(i, i + 1)` cho tâm chẵn.\n- Cắt chuỗi **một lần** ở cuối, tránh tạo `String` trong vòng lặp.\n- Làm việc trên `Array(s)` để có chỉ số nguyên `O(1)`."}, {"title": "Ghi nhớ", "text": "Bài palindrome → nghĩ \"tâm đối xứng\" trước. Nhớ xử lý **cả hai loại tâm**; quên tâm chẵn là lỗi thường gặp nhất (sai với `\"cbbd\"`)."}], "code": "class Solution {\n    func longestPalindrome(_ s: String) -> String {\n        let a = Array(s)\n        let n = a.count\n        var start = 0, len = 0\n\n        func expand(_ i: Int, _ j: Int) {\n            var l = i, r = j\n            while l >= 0 && r < n && a[l] == a[r] {\n                l -= 1\n                r += 1\n            }\n            // palindrome là a[l+1...r-1]\n            if r - l - 1 > len {\n                len = r - l - 1\n                start = l + 1\n            }\n        }\n\n        for i in 0..<n {\n            expand(i, i)\n            expand(i, i + 1)\n        }\n        return String(a[start..<start + len])\n    }\n}\n"}, {"id": 6, "category": "algorithms", "title": "Zigzag Conversion", "slug": "zigzag-conversion", "difficulty": "Medium", "topics": ["String", "Simulation"], "date": "2026-10-09", "time": "O(n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Viết chuỗi `s` theo hình zigzag trên `numRows` dòng (đi xuống rồi chéo lên, lặp lại), sau đó đọc từng dòng từ trái sang phải và nối lại."}, {"title": "Cơ sở lý thuyết", "text": "- **Mô phỏng (Simulation)**: làm đúng theo quy trình đề mô tả, không cần công thức thông minh.\n- Điều duy nhất quan trọng là **mỗi ký tự rơi vào dòng nào**; vị trí cột không ảnh hưởng vì ta chỉ đọc theo dòng, và trong cùng một dòng các ký tự xuất hiện đúng theo thứ tự gốc.\n- Chỉ số dòng dao động kiểu \"quả bóng nảy\": `0, 1, …, numRows-1, numRows-2, …, 1, 0, 1, …` với chu kỳ `2 * (numRows - 1)`."}, {"title": "Hướng xử lý", "text": "1. Không cần dựng ma trận 2 chiều — chỉ cần `numRows` chuỗi, mỗi chuỗi gom các ký tự của một dòng.\n2. Duyệt `s`, giữ dòng hiện tại `r` và hướng đi `step` (`+1` xuống, `-1` lên). Chạm dòng đầu hoặc dòng cuối thì đổi hướng.\n3. Nối các dòng lại là xong.\n\nCách khác: tính trực tiếp chỉ số bằng chu kỳ `2 * (numRows - 1)` để không cần bộ nhớ theo dòng, nhưng khó đọc hơn mà độ phức tạp không đổi."}, {"title": "Ý tưởng triển khai", "text": "- `rows = [String](repeating: \"\", count: numRows)`.\n- Đặt hướng **trước** khi bước: ở dòng `0` thì `step = 1`, ở dòng cuối thì `step = -1`, rồi `r += step`.\n- **Trường hợp biên `numRows == 1`**: dòng đầu cũng là dòng cuối, `step` sẽ thành `-1` và `r` chạy ra `-1` → crash. Phải trả về `s` ngay từ đầu.\n- Khi `numRows >= s.count` không cần xử lý riêng: mỗi ký tự một dòng, nối lại vẫn ra `s`."}, {"title": "Ghi nhớ", "text": "Gặp bài \"sắp xếp theo hình dạng rồi đọc lại\", hãy hỏi: thông tin nào thật sự cần giữ? Ở đây chỉ là chỉ số dòng. Luôn thử trường hợp suy biến (`numRows = 1`) trước khi nộp."}], "code": "class Solution {\n    func convert(_ s: String, _ numRows: Int) -> String {\n        if numRows == 1 { return s }\n\n        var rows = [String](repeating: \"\", count: numRows)\n        var r = 0, step = 1\n\n        for c in s {\n            rows[r].append(c)\n            if r == 0 { step = 1 }\n            if r == numRows - 1 { step = -1 }\n            r += step\n        }\n        return rows.joined()\n    }\n}\n"}, {"id": 7, "category": "algorithms", "title": "Reverse Integer", "slug": "reverse-integer", "difficulty": "Medium", "topics": ["Math"], "date": "2026-10-09", "time": "O(log |x|) (số chữ số, tối đa 10)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho số nguyên 32 bit có dấu `x`, trả về `x` với các chữ số đảo ngược. Nếu kết quả vượt khỏi khoảng `[-2³¹, 2³¹ - 1]` thì trả về `0`."}, {"title": "Cơ sở lý thuyết", "text": "- **Tách chữ số bằng chia lấy dư**: `x % 10` lấy chữ số cuối, `x / 10` bỏ chữ số cuối. Ghép ngược lại bằng `res = res * 10 + chữ số`.\n- **Phép chia số âm trong Swift** (giống C, Java) làm tròn **về 0**: `-123 % 10 == -3`, `-123 / 10 == -12`. Nhờ vậy cùng một vòng lặp chạy đúng cho cả số âm, không cần tách dấu.\n- **Tràn số (overflow)**: khoảng 32 bit là `[-2147483648, 2147483647]`. Đảo `1534236469` ra `9646324351` — vượt giới hạn."}, {"title": "Hướng xử lý", "text": "1. Lặp: lấy chữ số cuối của `x`, đẩy vào cuối `res`, cho tới khi `x == 0`.\n2. Xử lý tràn — có hai cách:\n   - **Cách đơn giản (dùng ở đây)**: `Int` của Swift trên LeetCode là 64 bit, đảo một số 32 bit không bao giờ tràn 64 bit. Cứ đảo xong rồi so với `Int32.min/max`.\n   - **Cách \"đúng tinh thần đề\"** (đề nói môi trường không lưu được số 64 bit): kiểm tra **trước** khi nhân, `res > Int32.max / 10` hoặc `res == Int32.max / 10 && chữ số > 7` thì trả `0` (tương tự cho phía âm với `-8`)."}, {"title": "Ý tưởng triển khai", "text": "- `var x = x` để che tham số (tham số hàm trong Swift là hằng).\n- Điều kiện lặp là `x != 0` chứ không phải `x > 0`, để số âm cũng chạy.\n- Số 0 ở cuối tự biến mất: `120 → 021 → 21` vì `res * 10 + 0` khi `res = 0` vẫn là `0`.\n- Trong Swift, tràn số nguyên sẽ **crash** chứ không cuộn vòng như C — nên nếu dùng `Int32` thật thì bắt buộc phải kiểm tra trước khi nhân."}, {"title": "Ghi nhớ", "text": "Bài thao tác chữ số: `% 10` và `/ 10`. Luôn tự hỏi \"có tràn không?\" và nhớ rằng Swift bẫy lỗi tràn lúc chạy."}], "code": "class Solution {\n    func reverse(_ x: Int) -> Int {\n        var x = x, res = 0\n        while x != 0 {\n            res = res * 10 + x % 10\n            x /= 10\n        }\n        // Int của Swift là 64 bit nên cứ đảo xong rồi mới kiểm tra tràn\n        if res > Int(Int32.max) || res < Int(Int32.min) { return 0 }\n        return res\n    }\n}\n"}, {"id": 8, "category": "algorithms", "title": "String to Integer (atoi)", "slug": "string-to-integer-atoi", "difficulty": "Medium", "topics": ["String"], "date": "2026-10-09", "time": "O(n)", "space": "O(n) (mảng ký tự; có thể O(1) nếu duyệt trực tiếp)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cài đặt `myAtoi(s)`: bỏ khoảng trắng đầu, đọc dấu `+`/`-` (nếu có), đọc các chữ số liên tiếp cho tới khi gặp ký tự khác, rồi kẹp kết quả vào khoảng số nguyên 32 bit."}, {"title": "Cơ sở lý thuyết", "text": "- **Phân tích cú pháp tuần tự (parsing)**: đọc chuỗi một lượt từ trái sang phải qua các **pha** cố định. Về bản chất đây là một **máy trạng thái hữu hạn**: `khoảng trắng → dấu → chữ số → dừng`, và không bao giờ quay lại pha trước.\n- **Tích lũy chữ số**: `res = res * 10 + d` (sơ đồ Horner).\n- **Kẹp giá trị (clamp)**: `min(max(x, lo), hi)`."}, {"title": "Hướng xử lý", "text": "Bài không khó về thuật toán, khó ở chỗ **làm đúng từng quy tắc theo đúng thứ tự**:\n1. Bỏ qua mọi dấu cách ở đầu.\n2. Đọc **tối đa một** dấu. `\"+-12\"` → `0` vì sau `+` là `-`, không phải chữ số.\n3. Đọc chữ số đến khi gặp ký tự không phải số hoặc hết chuỗi. Không có chữ số nào → `0`.\n4. Kẹp vào `[-2³¹, 2³¹ - 1]`.\n\nCạm bẫy: chuỗi có thể dài 200 ký tự toàn chữ số → tràn cả `Int` 64 bit nếu cứ cộng dồn."}, {"title": "Ý tưởng triển khai", "text": "- Một con trỏ `i` chạy qua ba vòng/khối nối tiếp nhau, mỗi khối là một pha.\n- **Chống tràn kiểu lười**: ngay khi `res > Int32.max` thì `break`. Lúc đó `res` nhiều nhất cỡ `2.1 × 10¹⁰`, còn rất xa giới hạn 64 bit; phần kẹp ở cuối sẽ đưa nó về đúng biên.\n- `Character.wholeNumberValue` trả `Int?` — vừa kiểm tra \"là chữ số\" vừa lấy giá trị. Kèm `isASCII` để không nhận nhầm chữ số Unicode khác (ví dụ `\"٣\"`).\n- Nhân dấu **sau cùng**, rồi kẹp: xử lý đúng cả `-2147483648`."}, {"title": "Ghi nhớ", "text": "Với bài parsing, viết ra danh sách các pha rồi code từng pha một, kiểm tra `i < a.count` ở mọi chỗ truy cập. Thử các ca: rỗng, toàn dấu cách, chỉ có dấu, hai dấu liền nhau, tràn dương, tràn âm."}], "code": "class Solution {\n    func myAtoi(_ s: String) -> Int {\n        let a = Array(s)\n        var i = 0, sign = 1, res = 0\n\n        while i < a.count && a[i] == \" \" { i += 1 }\n\n        if i < a.count && (a[i] == \"+\" || a[i] == \"-\") {\n            if a[i] == \"-\" { sign = -1 }\n            i += 1\n        }\n\n        while i < a.count, let d = a[i].wholeNumberValue, a[i].isASCII {\n            res = res * 10 + d\n            // vượt 32 bit là dừng luôn, khỏi sợ tràn 64 bit\n            if res > Int(Int32.max) { break }\n            i += 1\n        }\n\n        res *= sign\n        return min(max(res, Int(Int32.min)), Int(Int32.max))\n    }\n}\n"}, {"id": 9, "category": "algorithms", "title": "Palindrome Number", "slug": "palindrome-number", "difficulty": "Easy", "topics": ["Math"], "date": "2026-10-09", "time": "O(log x) (số chữ số)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho số nguyên `x`, trả về `true` nếu `x` đọc xuôi ngược như nhau. Câu hỏi thêm: làm mà không chuyển sang chuỗi."}, {"title": "Cơ sở lý thuyết", "text": "- Một số là **palindrome** khi dãy chữ số thập phân của nó đối xứng.\n- **Đảo số bằng số học**: lặp `rev = rev * 10 + n % 10; n /= 10` — cùng kỹ thuật với bài 7 (Reverse Integer).\n- Số âm không bao giờ là palindrome vì dấu `-` chỉ nằm ở một đầu (`-121` đọc ngược là `121-`)."}, {"title": "Hướng xử lý", "text": "1. Cách nhanh nhất để viết: `String(x) == String(String(x).reversed())`. Đúng, nhưng tốn bộ nhớ cho chuỗi.\n2. Cách số học: đảo toàn bộ `x` rồi so với chính nó.\n3. Tối ưu thêm (không bắt buộc): chỉ đảo **nửa sau** — dừng khi `rev >= n`, rồi so `n == rev` (số chữ số chẵn) hoặc `n == rev / 10` (lẻ). Cách này tránh hẳn nguy cơ tràn, nhưng phải loại riêng các số tận cùng bằng `0`."}, {"title": "Ý tưởng triển khai", "text": "- Loại số âm ngay đầu hàm.\n- Đảo cả số cho đơn giản. Với `Int` 64 bit của Swift, đảo một số 32 bit không thể tràn nên không cần kiểm tra gì thêm.\n- Giữ nguyên `x` để so sánh, làm việc trên bản sao `n`.\n- `x = 0` → vòng lặp không chạy, `rev = 0 == x` → `true`. Các số tận cùng bằng 0 như `10` → `rev = 1 ≠ 10` → `false`, tự đúng."}, {"title": "Ghi nhớ", "text": "Bài dễ nhưng là dịp ôn mẫu \"tách và ghép chữ số\". Nếu ngôn ngữ dùng số 32 bit thật thì dùng biến thể \"đảo nửa sau\" để khỏi lo tràn."}], "code": "class Solution {\n    func isPalindrome(_ x: Int) -> Bool {\n        if x < 0 { return false }\n\n        var n = x, rev = 0\n        while n > 0 {\n            rev = rev * 10 + n % 10\n            n /= 10\n        }\n        return rev == x\n    }\n}\n"}, {"id": 10, "category": "algorithms", "title": "Regular Expression Matching", "slug": "regular-expression-matching", "difficulty": "Hard", "topics": ["String", "Dynamic Programming", "Recursion"], "date": "2026-10-09", "time": "O(m · n)", "space": "O(m · n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s` và mẫu `p`, cài đặt so khớp biểu thức chính quy hỗ trợ `.` (khớp một ký tự bất kỳ) và `*` (khớp **0 hoặc nhiều** lần ký tự đứng ngay trước). Phải khớp **toàn bộ** `s`."}, {"title": "Cơ sở lý thuyết", "text": "- **Quy hoạch động (DP)** áp dụng khi bài toán có *cấu trúc con tối ưu* và *bài toán con gối nhau*. Ở đây: \"`s[i...]` có khớp `p[j...]` không\" chỉ phụ thuộc vào các hậu tố ngắn hơn, và cùng một cặp `(i, j)` bị hỏi lại rất nhiều lần nếu đệ quy ngây thơ.\n- `*` không đứng một mình: nó luôn đi kèm ký tự ngay trước, tạo thành một **đơn vị** `x*` nghĩa là \"không, một hoặc nhiều `x`\".\n- Đệ quy quay lui thuần có thể mất thời gian **hàm mũ** (ví dụ `s = \"aaaaaaaaaaaab\"`, `p = \"a*a*a*a*c\"`); ghi nhớ kết quả theo `(i, j)` đưa về `O(m · n)`."}, {"title": "Hướng xử lý", "text": "Định nghĩa `dp[i][j]` = `s[i...]` khớp `p[j...]`. Xét ký tự mẫu `p[j]`:\n\n1. Gọi `first` = ký tự đầu khớp nhau: `i < m` và (`p[j] == s[i]` hoặc `p[j] == \".\"`).\n2. **Nếu sau `p[j]` là `*`** — có hai lựa chọn, chỉ cần một cái đúng:\n   - *Dùng 0 lần*: bỏ cả cụm `x*` → `dp[i][j + 2]`.\n   - *Dùng thêm 1 lần*: cần `first`, tiêu một ký tự của `s` nhưng **giữ nguyên `j`** để cụm `x*` còn dùng tiếp được → `dp[i + 1][j]`.\n3. **Nếu không có `*`**: bắt buộc khớp đúng một ký tự → `first && dp[i + 1][j + 1]`.\n\nTrường hợp gốc: `dp[m][n] = true` (cả hai cùng hết). Còn `dp[i][n]` với `i < m` là `false` (mẫu hết mà chuỗi còn)."}, {"title": "Ý tưởng triển khai", "text": "- Bảng `(m + 1) × (n + 1)`, điền **từ dưới lên, từ phải sang trái** vì mỗi ô phụ thuộc vào `i + 1` và `j + 1`, `j + 2`.\n- `i` phải chạy từ `m` (chuỗi rỗng) chứ không phải `m - 1`: chuỗi rỗng vẫn có thể khớp mẫu như `a*b*`.\n- `j` chạy từ `n - 1`; cột `j = n` giữ giá trị khởi tạo.\n- Kiểm tra `i < m` trong `first` đảm bảo không bao giờ đọc `dp[m + 1][…]`, vì nhánh đó bị `&&` chặn lại.\n- Có thể nén còn hai hàng để giảm bộ nhớ xuống `O(n)`, nhưng bảng đầy đủ dễ đọc và dễ debug hơn."}, {"title": "Ghi nhớ", "text": "So khớp hai chuỗi (regex, wildcard, edit distance, LCS) → DP hai chiều trên cặp chỉ số `(i, j)`. Với `*`, nghĩ theo cụm `x*` và hai lựa chọn \"bỏ qua\" / \"ăn thêm một ký tự, ở lại chỗ cũ\"."}], "code": "class Solution {\n    func isMatch(_ s: String, _ p: String) -> Bool {\n        let s = Array(s), p = Array(p)\n        let m = s.count, n = p.count\n\n        // dp[i][j]: s[i...] có khớp p[j...] không\n        var dp = [[Bool]](repeating: [Bool](repeating: false, count: n + 1), count: m + 1)\n        dp[m][n] = true\n\n        for i in (0...m).reversed() {\n            for j in (0..<n).reversed() {\n                let first = i < m && (p[j] == s[i] || p[j] == \".\")\n\n                if j + 1 < n && p[j + 1] == \"*\" {\n                    // bỏ qua \"x*\" hoặc dùng nó ăn 1 ký tự\n                    dp[i][j] = dp[i][j + 2] || (first && dp[i + 1][j])\n                } else {\n                    dp[i][j] = first && dp[i + 1][j + 1]\n                }\n            }\n        }\n        return dp[0][0]\n    }\n}\n"}, {"id": 1114, "category": "concurrency", "title": "Print in Order", "slug": "print-in-order", "difficulty": "Easy", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(1)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Một đối tượng `Foo` có ba phương thức `first()`, `second()`, `third()`, được gọi bởi ba luồng khác nhau theo thứ tự bất kỳ. Phải đảm bảo chúng luôn chạy đúng thứ tự `first → second → third`."}, {"title": "Cơ sở lý thuyết", "text": "- **Luồng (thread)** chạy xen kẽ không đoán trước được: hệ điều hành quyết định luồng nào chạy lúc nào. Muốn có thứ tự thì phải **đồng bộ hóa** tường minh.\n- **Semaphore** là một bộ đếm số nguyên với hai thao tác nguyên tử: `wait()` giảm bộ đếm, nếu bộ đếm đang bằng 0 thì luồng **ngủ** cho tới khi có người `signal()`; `signal()` tăng bộ đếm và đánh thức một luồng đang chờ.\n- Semaphore khởi tạo bằng **0** đóng vai trò \"cổng đang đóng\": ai tới trước cũng phải chờ cho tới khi sự kiện xảy ra. Vì `signal()` được **ghi nhớ** trong bộ đếm, không sợ mất tín hiệu khi `signal` chạy trước `wait`.\n- Trong Swift: `DispatchSemaphore(value:)` của Grand Central Dispatch."}, {"title": "Hướng xử lý", "text": "1. Có hai quan hệ \"phải xảy ra trước\": `first` trước `second`, và `second` trước `third`. Mỗi quan hệ cần một cổng.\n2. `first` không chờ ai — chạy xong thì mở cổng 1.\n3. `second` chờ cổng 1, chạy, rồi mở cổng 2.\n4. `third` chờ cổng 2 rồi chạy.\n\nCách sai thường gặp: dùng biến cờ `Bool` rồi lặp `while !done {}` (busy-wait) — vừa tốn CPU vừa là data race vì đọc/ghi biến chung không khóa."}, {"title": "Ý tưởng triển khai", "text": "- Hai semaphore `s1`, `s2` cùng khởi tạo `0`.\n- `first`: in → `s1.signal()`.\n- `second`: `s1.wait()` → in → `s2.signal()`.\n- `third`: `s2.wait()` → in.\n- Nếu `third` được gọi đầu tiên, nó ngủ ở `s2.wait()`; `second` ngủ ở `s1.wait()`; chỉ `first` chạy được, và dây chuyền tự mở dần."}, {"title": "Ghi nhớ", "text": "\"Sự kiện A phải xảy ra trước B\" → một semaphore giá trị 0, A `signal`, B `wait`. Đây là viên gạch cơ bản cho mọi bài sắp thứ tự luồng. Với Swift hiện đại (async/await) có thể dùng `AsyncStream` hay continuation, nhưng semaphore vẫn là cách diễn đạt trực tiếp nhất cho bài kiểu này."}], "code": "import Foundation\n\nclass Foo {\n    let s1 = DispatchSemaphore(value: 0)\n    let s2 = DispatchSemaphore(value: 0)\n\n    func first(_ printFirst: () -> Void) {\n        printFirst()\n        s1.signal()\n    }\n\n    func second(_ printSecond: () -> Void) {\n        s1.wait()\n        printSecond()\n        s2.signal()\n    }\n\n    func third(_ printThird: () -> Void) {\n        s2.wait()\n        printThird()\n    }\n}\n"}, {"id": 1115, "category": "concurrency", "title": "Print FooBar Alternately", "slug": "print-foobar-alternately", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Hai luồng cùng dùng một đối tượng `FooBar(n)`: luồng A gọi `foo()` (in \"foo\" `n` lần), luồng B gọi `bar()` (in \"bar\" `n` lần). Phải in ra đúng `foobar` lặp lại `n` lần."}, {"title": "Cơ sở lý thuyết", "text": "- **Luân phiên nghiêm ngặt (strict alternation)** giữa hai luồng — còn gọi là mẫu **ping-pong**: mỗi luồng làm một bước rồi **trao lượt** cho luồng kia và tự đi ngủ.\n- Dùng **hai semaphore nhị phân** làm \"thẻ lượt\": tại mọi thời điểm tổng giá trị của hai semaphore cộng số luồng đang in luôn bằng 1 → không bao giờ có hai luồng cùng in.\n- Giá trị khởi tạo quyết định **ai đi trước**: semaphore của `foo` bắt đầu bằng `1`, của `bar` bằng `0`."}, {"title": "Hướng xử lý", "text": "1. Khác bài 1114 (mỗi hàm chạy một lần), ở đây thứ tự phải giữ qua `n` vòng → tín hiệu phải đi **hai chiều**.\n2. `foo` cần lượt để in; in xong thì đưa lượt cho `bar`.\n3. `bar` cần lượt để in; in xong thì trả lượt cho `foo`.\n4. Một `NSLock` thông thường không làm được: mutex chỉ đảm bảo \"không cùng lúc\", không đảm bảo \"xen kẽ\" — một luồng có thể giành lại khóa ngay sau khi nhả."}, {"title": "Ý tưởng triển khai", "text": "- `fooSem = 1`, `barSem = 0`.\n- Vòng lặp của `foo`: `fooSem.wait()` → in → `barSem.signal()`.\n- Vòng lặp của `bar`: `barSem.wait()` → in → `fooSem.signal()`.\n- Sau vòng cuối, `bar` vẫn `signal` cho `fooSem` thêm một lần thừa — vô hại vì không còn ai chờ."}, {"title": "Ghi nhớ", "text": "Hai luồng xen kẽ → hai semaphore, mỗi bên `wait` cái của mình và `signal` cái của bên kia. Mutex bảo vệ dữ liệu; semaphore (hoặc condition variable) mới điều khiển **thứ tự**."}], "code": "import Foundation\n\nclass FooBar {\n    let n: Int\n    let fooSem = DispatchSemaphore(value: 1)\n    let barSem = DispatchSemaphore(value: 0)\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    func foo(_ printFoo: () -> Void) {\n        for _ in 0..<n {\n            fooSem.wait()\n            printFoo()\n            barSem.signal()\n        }\n    }\n\n    func bar(_ printBar: () -> Void) {\n        for _ in 0..<n {\n            barSem.wait()\n            printBar()\n            fooSem.signal()\n        }\n    }\n}\n"}, {"id": 1116, "category": "concurrency", "title": "Print Zero Even Odd", "slug": "print-zero-even-odd", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Ba luồng dùng chung `ZeroEvenOdd(n)`: luồng `zero()` chỉ in số 0, luồng `even()` chỉ in số chẵn, luồng `odd()` chỉ in số lẻ. Kết quả phải là `0 1 0 2 0 3 … 0 n`."}, {"title": "Cơ sở lý thuyết", "text": "- Mở rộng mẫu ping-pong của bài 1115 lên **ba luồng với một \"nhạc trưởng\"**: luồng `zero` chạy xen giữa mọi bước và là bên quyết định ai đi tiếp.\n- **Chuyển lượt có điều kiện**: thay vì luôn `signal` cho một đối tác cố định, luồng đang giữ lượt chọn semaphore cần đánh thức dựa trên trạng thái (ở đây là tính chẵn lẻ của số sắp in).\n- Bất biến: tại mọi thời điểm chỉ có đúng **một thẻ lượt** lưu hành giữa ba semaphore."}, {"title": "Hướng xử lý", "text": "1. Chuỗi in ra có dạng `zero, odd, zero, even, zero, odd, …` — luồng `zero` in ở mọi vị trí lẻ, còn `odd`/`even` thay phiên ở vị trí chẵn.\n2. Cho mỗi luồng một semaphore riêng: `z` (bắt đầu `1`, vì 0 được in đầu tiên), `e` và `o` (bắt đầu `0`).\n3. `zero` in xong `0` thứ `i` thì đánh thức `odd` nếu `i` lẻ, `even` nếu `i` chẵn.\n4. `odd` và `even` in xong đều trả lượt về cho `zero`."}, {"title": "Ý tưởng triển khai", "text": "- `zero`: lặp `i` từ `1` đến `n` — biến `i` chính là số mà luồng kia sắp in, nên dùng luôn để chọn `o.signal()` hay `e.signal()`.\n- `even`: `stride(from: 2, through: n, by: 2)`; `odd`: `stride(from: 1, through: n, by: 2)`. Mỗi luồng tự biết mình in những số nào, không cần biến đếm dùng chung → **không có dữ liệu chia sẻ nào cần khóa**.\n- Số vòng lặp của ba luồng khớp nhau đúng bằng thiết kế (`n` lần `zero`, `⌊n/2⌋` lần `even`, `⌈n/2⌉` lần `odd`) nên cả ba cùng kết thúc, không luồng nào bị kẹt ở `wait()`."}, {"title": "Ghi nhớ", "text": "Nhiều hơn hai luồng luân phiên → mỗi luồng một semaphore, luồng đang chạy quyết định đánh thức ai. Thiết kế sao cho mỗi luồng tự suy ra được việc của mình từ biến cục bộ sẽ tránh được hẳn data race."}], "code": "import Foundation\n\nclass ZeroEvenOdd {\n    let n: Int\n    let z = DispatchSemaphore(value: 1)\n    let e = DispatchSemaphore(value: 0)\n    let o = DispatchSemaphore(value: 0)\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    func zero(_ printNumber: (Int) -> Void) {\n        for i in 1...n {\n            z.wait()\n            printNumber(0)\n            // số sắp in là i: lẻ thì gọi odd, chẵn thì gọi even\n            if i % 2 == 1 { o.signal() } else { e.signal() }\n        }\n    }\n\n    func even(_ printNumber: (Int) -> Void) {\n        for i in stride(from: 2, through: n, by: 2) {\n            e.wait()\n            printNumber(i)\n            z.signal()\n        }\n    }\n\n    func odd(_ printNumber: (Int) -> Void) {\n        for i in stride(from: 1, through: n, by: 2) {\n            o.wait()\n            printNumber(i)\n            z.signal()\n        }\n    }\n}\n"}, {"id": 1117, "category": "concurrency", "title": "Building H2O", "slug": "building-h2o", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore", "Mutex"], "date": "2026-10-09", "time": "O(1) mỗi luồng", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Có nhiều luồng hydro (gọi `hydrogen()`) và oxy (gọi `oxygen()`) tới theo thứ tự bất kỳ. Phải cho chúng \"đi qua\" theo từng nhóm ba tạo thành phân tử nước: trong chuỗi kết quả, cứ ba ký tự liên tiếp phải gồm đúng 2 `H` và 1 `O`."}, {"title": "Cơ sở lý thuyết", "text": "- **Semaphore đếm (counting semaphore)**: giá trị khởi tạo `k > 1` cho phép tối đa `k` luồng đi qua — dùng để mô hình hóa \"còn `k` chỗ trống\".\n- **Rào chắn / gom nhóm (barrier, rendezvous)**: một nhóm luồng chỉ được đi tiếp khi đã đủ thành phần. Đây là bài kinh điển trong *The Little Book of Semaphores*.\n- **Deadlock do giữ-và-chờ (hold and wait)**: hai luồng mỗi bên giữ một phần tài nguyên và chờ phần còn lại mà bên kia đang giữ → cả hai kẹt mãi. Cách chữa: bắt việc \"lấy nhiều tài nguyên\" phải diễn ra **nguyên khối** bằng một mutex."}, {"title": "Hướng xử lý", "text": "1. Mỗi phân tử có 2 chỗ cho H → semaphore `h = 2`: tối đa hai H được in trong một phân tử, H thứ ba phải chờ.\n2. O chỉ được in khi đã có đủ 2 H → semaphore `o = 0`, mỗi H in xong `signal` một lần, O phải `wait` **hai lần**.\n3. O in xong thì phân tử hoàn tất → `h.signal()` hai lần để mở chỗ cho phân tử kế tiếp.\n4. **Cạm bẫy**: nếu hai luồng O cùng lúc mỗi bên lấy được một `o.wait()`, cả hai chờ cái thứ hai mãi mãi — trong khi `h` đã hết chỗ nên không H nào tới cứu. Phải bọc hai lần `wait` trong một `NSLock` để mỗi lúc chỉ một O gom H."}, {"title": "Ý tưởng triển khai", "text": "- `hydrogen`: `h.wait()` → in H → `o.signal()`.\n- `oxygen`: `oLock.lock()` → `o.wait()` ×2 → in O → `h.signal()` ×2 → `oLock.unlock()`.\n- Thứ tự in trong một phân tử luôn là `H H O`. Đề chấp nhận mọi hoán vị, nên đây là một đáp án hợp lệ và đơn giản nhất.\n- Vì sao nhóm ba không lẫn sang nhau: H của phân tử sau chỉ qua được `h.wait()` **sau khi** O của phân tử trước đã in và `signal`."}, {"title": "Ghi nhớ", "text": "\"Cần `k` đơn vị mới được chạy\" → `wait` `k` lần, nhưng nhớ khóa lại để việc gom không bị chia đôi giữa hai luồng. Khi phân tích deadlock, tự hỏi: có tình huống nào hai luồng mỗi bên giữ một nửa không?"}], "code": "import Foundation\n\nclass H2O {\n    let h = DispatchSemaphore(value: 2)   // còn mấy chỗ cho H trong phân tử hiện tại\n    let o = DispatchSemaphore(value: 0)   // số H đã vào, chờ O\n    let oLock = NSLock()\n\n    func hydrogen(_ releaseHydrogen: () -> Void) {\n        h.wait()\n        releaseHydrogen()\n        o.signal()\n    }\n\n    func oxygen(_ releaseOxygen: () -> Void) {\n        // chỉ 1 O được gom H tại một thời điểm, không thì 2 O mỗi đứa giữ 1 H là kẹt\n        oLock.lock()\n        o.wait()\n        o.wait()\n        releaseOxygen()\n        h.signal()\n        h.signal()\n        oLock.unlock()\n    }\n}\n"}, {"id": 1195, "category": "concurrency", "title": "Fizz Buzz Multithreaded", "slug": "fizz-buzz-multithreaded", "difficulty": "Medium", "topics": ["Concurrency", "Condition Variable"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Bốn luồng dùng chung `FizzBuzz(n)`: `fizz()` in \"fizz\" cho số chia hết cho 3 (không chia hết cho 5), `buzz()` cho số chia hết cho 5 (không chia hết cho 3), `fizzbuzz()` cho số chia hết cho 15, `number()` in các số còn lại. Kết quả phải đúng thứ tự từ 1 đến `n`."}, {"title": "Cơ sở lý thuyết", "text": "- **Biến điều kiện (condition variable)**: cho phép luồng ngủ cho tới khi một **điều kiện trên trạng thái dùng chung** trở thành đúng. Luôn đi kèm một mutex. Trong Swift: `NSCondition` (gộp sẵn khóa + biến điều kiện).\n- Ba thao tác: `wait()` — **nhả khóa và ngủ** một cách nguyên tử, khi thức dậy tự lấy lại khóa; `signal()` — đánh thức một luồng; `broadcast()` — đánh thức tất cả.\n- **Thức giấc giả (spurious wakeup)**: luồng có thể tỉnh dậy mà điều kiện chưa đúng. Vì vậy luôn kiểm tra điều kiện trong vòng `while`, không bao giờ dùng `if`.\n- So với semaphore: semaphore hợp khi \"ai đi tiếp\" biết trước; biến điều kiện hợp khi việc đó phụ thuộc vào **trạng thái** (ở đây là giá trị của số hiện tại)."}, {"title": "Hướng xử lý", "text": "1. Trạng thái dùng chung duy nhất: số hiện tại `i`. Mỗi luồng có một vị từ \"số này có phải của tôi không\".\n2. Mỗi luồng lặp: khóa → chờ tới khi `i` thuộc về mình (hoặc đã hết số) → xử lý → `i += 1` → đánh thức mọi người → mở khóa.\n3. Phải dùng `broadcast()` chứ không phải `signal()`: ta không biết luồng nào là chủ của số kế tiếp; `signal` có thể đánh thức nhầm luồng, nó ngủ lại và cả hệ thống đứng im.\n4. **Điều kiện thoát**: khi `i > n` mọi luồng phải thoát. Điều kiện chờ là `i <= n && !mine(i)` nên luồng đang ngủ cũng sẽ tỉnh dậy và thoát sau lần `broadcast` cuối."}, {"title": "Ý tưởng triển khai", "text": "- Cả bốn hàm chỉ khác nhau ở vị từ và hành động → gom vào một hàm `run(mine, act)`.\n- Trong `run`: `cond.lock()`; `while i <= n && !mine(i) { cond.wait() }`; nếu `i > n` thì `unlock` và `return`; ngược lại `act(i)`, `i += 1`, `cond.broadcast()`, `cond.unlock()`.\n- Gọi `act(i)` **trong khi còn giữ khóa** để đảm bảo việc in và việc tăng `i` là một bước không thể bị chen ngang.\n- Nhớ `unlock` trước mọi `return` — quên là các luồng khác treo vĩnh viễn."}, {"title": "Ghi nhớ", "text": "Mẫu chuẩn của biến điều kiện: `lock → while !điều_kiện { wait } → làm việc → broadcast → unlock`. Nhiều luồng với các điều kiện khác nhau cùng chờ trên một biến → dùng `broadcast`."}], "code": "import Foundation\n\nclass FizzBuzz {\n    let n: Int\n    var i = 1\n    let cond = NSCondition()\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    // chờ tới lượt số i thuộc về mình thì xử lý, hết số thì thoát\n    func run(_ mine: (Int) -> Bool, _ act: (Int) -> Void) {\n        while true {\n            cond.lock()\n            while i <= n && !mine(i) {\n                cond.wait()\n            }\n            if i > n {\n                cond.unlock()\n                return\n            }\n            act(i)\n            i += 1\n            cond.broadcast()\n            cond.unlock()\n        }\n    }\n\n    func fizz(_ printFizz: () -> Void) {\n        run({ $0 % 3 == 0 && $0 % 5 != 0 }, { _ in printFizz() })\n    }\n\n    func buzz(_ printBuzz: () -> Void) {\n        run({ $0 % 5 == 0 && $0 % 3 != 0 }, { _ in printBuzz() })\n    }\n\n    func fizzbuzz(_ printFizzBuzz: () -> Void) {\n        run({ $0 % 15 == 0 }, { _ in printFizzBuzz() })\n    }\n\n    func number(_ printNumber: (Int) -> Void) {\n        run({ $0 % 3 != 0 && $0 % 5 != 0 }, printNumber)\n    }\n}\n"}, {"id": 1226, "category": "concurrency", "title": "The Dining Philosophers", "slug": "the-dining-philosophers", "difficulty": "Medium", "topics": ["Concurrency", "Mutex", "Deadlock"], "date": "2026-10-09", "time": "O(1) mỗi lần ăn", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Năm triết gia ngồi quanh bàn tròn, giữa hai người kề nhau có một chiếc nĩa (tổng cộng 5 nĩa). Muốn ăn phải cầm được **cả hai** nĩa bên trái và bên phải. Cài đặt `wantsToEat(...)` sao cho không ai bị đói mãi và chương trình không bao giờ deadlock."}, {"title": "Cơ sở lý thuyết", "text": "- **Mutex (khóa loại trừ)**: mỗi lúc chỉ một luồng giữ được. Mỗi chiếc nĩa là một mutex. Trong Swift: `NSLock`.\n- **Bốn điều kiện Coffman** — deadlock chỉ xảy ra khi có đủ cả bốn:\n   1. *Loại trừ lẫn nhau*: tài nguyên không chia sẻ được.\n   2. *Giữ và chờ*: giữ một tài nguyên trong lúc chờ tài nguyên khác.\n   3. *Không thu hồi*: không ai giật được tài nguyên của luồng khác.\n   4. *Chờ vòng tròn*: A chờ B, B chờ C, …, E chờ A.\n- Phá **một** trong bốn điều kiện là đủ ngăn deadlock. Dễ phá nhất là điều kiện 4 bằng **thứ tự tài nguyên (resource ordering)**: đánh số mọi tài nguyên và luôn khóa theo thứ tự tăng dần."}, {"title": "Hướng xử lý", "text": "1. Cách ngây thơ: ai cũng cầm nĩa trái trước rồi nĩa phải. Nếu cả năm người cùng cầm nĩa trái một lúc → mỗi người giữ một nĩa và chờ nĩa của người bên cạnh → vòng chờ khép kín → deadlock.\n2. Áp dụng thứ tự tài nguyên: nĩa đánh số `0…4`, mỗi người luôn khóa nĩa **số nhỏ hơn** trước.\n3. Vì sao hết deadlock: triết gia `0…3` lấy nĩa trái (`p`) trước rồi nĩa phải (`p + 1`); riêng triết gia `4` có nĩa trái là `4`, nĩa phải là `0` nên lấy nĩa `0` trước — **ngược chiều** với bốn người kia. Vòng tròn bị phá: không thể có chuỗi chờ mà số nĩa cứ tăng mãi rồi quay lại đầu.\n\nCác cách khác: dùng semaphore giá trị `4` chỉ cho tối đa bốn người ngồi vào bàn cùng lúc; hoặc một mutex toàn cục (đúng nhưng mất tính song song — hai người không kề nhau lẽ ra ăn cùng lúc được)."}, {"title": "Ý tưởng triển khai", "text": "- `forks`: mảng 5 `NSLock`. Nĩa trái của triết gia `p` là `p`, nĩa phải là `(p + 1) % 5`.\n- `a = min(l, r)`, `b = max(l, r)`; khóa `a` rồi `b`.\n- Khi đã giữ cả hai khóa mới gọi lần lượt `pickLeftFork`, `pickRightFork`, `eat`, `putLeftFork`, `putRightFork` — thứ tự gọi callback không cần trùng thứ tự khóa.\n- Mở khóa theo thứ tự ngược lại (`b` rồi `a`) — thói quen tốt, dù thứ tự mở không ảnh hưởng tới deadlock."}, {"title": "Ghi nhớ", "text": "Cần khóa nhiều mutex cùng lúc → luôn khóa theo **một thứ tự toàn cục cố định**. Đây là quy tắc thực chiến quan trọng nhất để tránh deadlock, áp dụng y nguyên khi viết code iOS với nhiều `NSLock` hay nhiều serial queue."}], "code": "import Foundation\n\nclass DiningPhilosophers {\n    let forks = (0..<5).map { _ in NSLock() }\n\n    func wantsToEat(_ p: Int,\n                    _ pickLeftFork: () -> Void,\n                    _ pickRightFork: () -> Void,\n                    _ eat: () -> Void,\n                    _ putLeftFork: () -> Void,\n                    _ putRightFork: () -> Void) {\n        let l = p, r = (p + 1) % 5\n        // luôn khóa nĩa số nhỏ trước -> không thể thành vòng chờ\n        let a = min(l, r), b = max(l, r)\n\n        forks[a].lock()\n        forks[b].lock()\n\n        pickLeftFork()\n        pickRightFork()\n        eat()\n        putLeftFork()\n        putRightFork()\n\n        forks[b].unlock()\n        forks[a].unlock()\n    }\n}\n"}];</script>
<script>
const DATA = window.LC_DATA || [];
const byId = new Map(DATA.map(p => [p.id, p]));
const TABS = [['algorithms', 'Thuật toán'], ['concurrency', 'Concurrency'], ['contests', 'Contest']];
let cat = 'algorithms';
let level = 'Tất cả';
const inCat = () => DATA.filter(p => p.category === cat);
// tab chưa có bài nào thì ẩn đi
const shownTabs = () => TABS.filter(([k]) => DATA.some(p => p.category === k));
const VI = { Easy: 'Dễ', Medium: 'Trung bình', Hard: 'Khó' };

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Markdown tối giản: đoạn văn, danh sách (lồng 1 cấp), `code`, **đậm**, *nghiêng*
function inline(s) {
  // tách `code` ra trước để dấu * bên trong không bị hiểu là in đậm
  const codes = [];
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '\u0001' + (codes.push(c) - 1) + '\u0001')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\u0001(\d+)\u0001/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function md(text) {
  const out = [];
  const stack = []; // các thẻ danh sách đang mở
  let para = [];
  const flush = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const closeTo = n => { while (stack.length > n) out.push('</li></' + stack.pop() + '>'); };

  for (const line of text.split('\n')) {
    const m = line.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
    if (m) {
      flush();
      const depth = m[1].length >= 2 ? 2 : 1;
      const tag = m[2] === '-' ? 'ul' : 'ol';
      if (stack.length > depth) closeTo(depth);
      if (stack.length === depth) out.push('</li>');
      while (stack.length < depth) { out.push('<' + tag + '>'); stack.push(tag); }
      out.push('<li>' + inline(m[3]));
    } else if (!line.trim()) {
      flush(); closeTo(0);
    } else {
      if (stack.length) closeTo(0);
      para.push(line.trim());
    }
  }
  flush(); closeTo(0);
  return out.join('\n');
}

const KW = new Set('class struct enum protocol extension func var let if else guard for while repeat in return break continue switch case default where import init self nil true false inout mutating static private public final throws throw try catch do as is defer typealias'.split(' '));
function swift(code) {
  const re = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|\b(\d[\d_]*(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="co">' + t + '</span>';
    else if (m[2]) out += '<span class="st">' + t + '</span>';
    else if (m[3]) out += '<span class="nu">' + t + '</span>';
    else if (KW.has(m[4])) out += '<span class="kw">' + t + '</span>';
    else if (/^[A-Z]/.test(m[4])) out += '<span class="ty">' + t + '</span>';
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  return inCat().filter(p => {
    if (level !== 'Tất cả' && p.difficulty !== level) return false;
    if (!q) return true;
    return (p.id + ' ' + p.title + ' ' + p.topics.join(' ')).toLowerCase().includes(q);
  });
}

function renderList() {
  const cur = currentId();
  const items = filtered();
  const days = [...new Set(items.map(p => p.date))].sort().reverse();
  const html = days.map(d =>
    `<div class="day">${fmtDate(d)}</div>` +
    items.filter(p => p.date === d).map(p =>
      `<a class="item ${p.difficulty}${p.id === cur ? ' active' : ''}" href="#/${p.id}">
        <span class="num">${p.id}</span><span class="name">${esc(p.title)}</span><span class="dot" title="${VI[p.difficulty]}"></span>
      </a>`).join('')
  ).join('');
  document.getElementById('list').innerHTML = html || '<p class="empty">Không có bài nào khớp.</p>';
}

function renderChips() {
  const levels = ['Tất cả', 'Easy', 'Medium', 'Hard'];
  document.getElementById('chips').innerHTML = levels.map(l =>
    `<button class="chip" aria-pressed="${l === level}" data-l="${l}">${VI[l] || l}</button>`).join('');
}

function currentId() {
  const m = location.hash.match(/^#\/(\d+)/);
  const id = m ? +m[1] : NaN;
  if (byId.has(id) && byId.get(id).category === cat) return id;
  const items = inCat();
  return items.length ? items[items.length - 1].id : null;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = shownTabs().map(([k, name]) =>
    `<button class="tab" role="tab" aria-selected="${k === cat}" data-c="${k}">${name}</button>`).join('');
  const count = l => inCat().filter(p => p.difficulty === l).length;
  document.getElementById('stats').textContent =
    `${inCat().length} bài · ${count('Easy')} dễ · ${count('Medium')} trung bình · ${count('Hard')} khó`;
}

function renderDoc() {
  const doc = document.getElementById('doc');
  const p = byId.get(currentId());
  if (!p) { doc.innerHTML = '<p class="empty">Chưa có bài nào trong mục này.</p>'; return; }

  const items = inCat();
  const i = items.indexOf(p);
  const prev = items[i - 1], next = items[i + 1];
  doc.innerHTML = `
    <p class="eyebrow">Bài ${p.id} · giải ngày ${fmtDate(p.date)}</p>
    <h1>${esc(p.title)}</h1>
    <div class="meta ${p.difficulty}">
      <span class="badge">${VI[p.difficulty]}</span>
      ${p.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
      ${p.status ? `<span class="ok">✓ ${esc(p.status)}</span>` : ''}
      <a class="link" href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener">Mở trên LeetCode ↗</a>
    </div>
    <div class="cx">
      <div><span>Thời gian</span><b>${esc(p.time)}</b></div>
      <div><span>Bộ nhớ</span><b>${esc(p.space)}</b></div>
    </div>
    ${p.sections.map(s => `<h2>${esc(s.title)}</h2>${md(s.text)}`).join('')}
    <h2>Lời giải Swift</h2>
    <div class="codebox"><button class="copy" id="copy">Sao chép</button><pre><code>${swift(p.code)}</code></pre></div>
    <div class="nav">
      <span>${prev ? `<a href="#/${prev.id}">← ${prev.id}. ${esc(prev.title)}</a>` : ''}</span>
      <span>${next ? `<a href="#/${next.id}">${next.id}. ${esc(next.title)} →</a>` : ''}</span>
    </div>`;
  document.getElementById('copy').onclick = e => {
    navigator.clipboard.writeText(p.code).then(() => {
      e.target.textContent = 'Đã chép';
      setTimeout(() => e.target.textContent = 'Sao chép', 1200);
    });
  };
  document.title = `${p.id}. ${p.title} · Sổ tay LeetCode`;
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('q').addEventListener('input', renderList);
document.getElementById('chips').addEventListener('click', e => {
  if (!e.target.dataset.l) return;
  level = e.target.dataset.l;
  renderChips(); renderList();
});
document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.dataset.c || e.target.dataset.c === cat) return;
  cat = e.target.dataset.c;
  const id = currentId();
  if (id != null) location.hash = '#/' + id;
  renderAll();
});

// mở link tới một bài thì chuyển sang đúng tab của bài đó
function syncCat() {
  const m = location.hash.match(/^#\/(\d+)/);
  if (m && byId.has(+m[1])) cat = byId.get(+m[1]).category;
}
function renderAll() { renderTabs(); renderChips(); renderList(); renderDoc(); }
window.addEventListener('hashchange', () => { syncCat(); renderAll(); });

syncCat(); renderAll();
</script>
</body>
</html>
