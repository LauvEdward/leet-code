 nếu tổng bằng `n` thì trả `true`; ngược lại dịch cửa sổ.\n3. Tổng tăng nghiêm ngặt sau mỗi lần dịch, nên khi vượt `n` thì chắc chắn không còn cơ hội → `false`."}, {"title": "Ý tưởng triển khai", "text": "- Gán bộ ba đồng thời bằng tuple: `(a, b, c) = (b, c, b + c)` — không cần biến tạm.\n- Tổng lớn nhất được tính chỉ cỡ vài tỉ, không lo tràn `Int` 64 bit."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 16` → **Output:** `true`\n\n```\n(a, b, c) = (0, 1, 1): tổng 2  ≠ 16 → dịch\n(a, b, c) = (1, 1, 2): tổng 4  ≠ 16 → dịch\n(a, b, c) = (1, 2, 3): tổng 6  ≠ 16 → dịch\n(a, b, c) = (2, 3, 5): tổng 10 ≠ 16 → dịch\n(a, b, c) = (3, 5, 8): tổng 16 = n → true\n```\n\n**Input:** `n = 8` → **Output:** `false`\n\n```\nCác tổng lần lượt: 2, 4, 6, rồi 10 > 8 → thoát vòng lặp → false\n(1 + 2 + 5 = 8 nhưng ba số đó không liên tiếp)\n```\n\n**Input:** `n = 2` → **Output:** `true` (ngay bộ ba đầu tiên `0 + 1 + 1`)."}, {"title": "Ghi nhớ", "text": "Dãy tăng theo hàm mũ (Fibonacci, lũy thừa 2, giai thừa) chỉ có vài chục số hạng trong phạm vi `10⁹`–`10¹⁸` → cứ sinh hết ra mà duyệt."}], "code": "class Solution {\n    func threeFibonacciSum(_ n: Int) -> Bool {\n        var a = 0, b = 1, c = 1\n        while a + b + c <= n {\n            if a + b + c == n { return true }\n            (a, b, c) = (b, c, b + c)\n        }\n        return false\n    }\n}\n"}, {"id": 4079, "category": "contests", "title": "Prime Subset Selection I", "slug": "prime-subset-selection-i", "difficulty": "Medium", "topics": ["Weekly Contest 523", "Math", "Greedy", "Number Theory", "Sieve"], "date": "2026-10-11", "time": "O(n log log n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho `n ≤ 10⁶` và `s ≤ 10⁹`. Trong các số nguyên tố không vượt `n`, chọn **nhiều số nhất** có thể (mỗi số một lần) sao cho tổng không vượt `s`. Trả về các số đã chọn theo thứ tự tăng (đáp án nào tối ưu cũng được)."}, {"title": "Cơ sở lý thuyết", "text": "- **Sàng Eratosthenes**: tìm mọi số nguyên tố `≤ n` trong `O(n log log n)`. Với mỗi số nguyên tố `i`, gạch các bội `i², i² + i, …` (các bội nhỏ hơn `i²` đã bị gạch bởi số nguyên tố nhỏ hơn). Chỉ cần xét `i` tới `√n`.\n- **Tham lam \"lấy cái rẻ nhất trước\"**: muốn chọn nhiều phần tử nhất dưới một ngân sách thì lấy các phần tử nhỏ nhất. Chứng minh bằng **lập luận đổi chỗ**: trong một lời giải tối ưu bất kỳ, thay một phần tử bằng phần tử nhỏ hơn chưa được chọn thì tổng giảm mà số lượng không đổi → luôn tồn tại lời giải tối ưu gồm `k` số nhỏ nhất."}, {"title": "Hướng xử lý", "text": "1. Sàng để có các số nguyên tố `≤ n`.\n2. Duyệt từ nhỏ đến lớn, cộng dồn; dừng ngay khi thêm số kế tiếp sẽ vượt `s`.\n3. Các số đã lấy vốn theo thứ tự tăng."}, {"title": "Ý tưởng triển khai", "text": "- `n < 2` thì không có số nguyên tố nào → trả mảng rỗng ngay (cũng tránh khoảng `2...n` không hợp lệ trong Swift).\n- Sàng viết bằng `while` vì bước nhảy thay đổi; `j` bắt đầu từ `i * i`.\n- Dừng bằng `break` chứ không `continue`: các số sau còn lớn hơn nên chắc chắn cũng vượt.\n- Test cục bộ: vét cạn mọi tập con với `n ≤ 40` để xác nhận số lượng là lớn nhất."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 15`, `s = 15`\n**Output:** `[2, 3, 5]` (đề cũng chấp nhận `[3, 5, 7]`, `[2, 3, 7]`, `[2, 5, 7]`)\n\n```\nSàng tới 15: 2, 3, 5, 7, 11, 13\np=2: sum = 0 + 2 = 2   <= 15 → lấy → res = [2]\np=3: sum = 2 + 3 = 5   <= 15 → lấy → res = [2, 3]\np=5: sum = 5 + 5 = 10  <= 15 → lấy → res = [2, 3, 5]\np=7: 10 + 7 = 17 > 15 → dừng\nKết quả: [2, 3, 5]   (3 số — bốn số nhỏ nhất đã có tổng 17 nên không thể hơn)\n```\n\n**Input:** `n = 7`, `s = 20` → **Output:** `[2, 3, 5, 7]`\n\n```\n2 → 5 → 10 → 17, tất cả <= 20, hết số nguyên tố → lấy cả bốn\n```\n\n**Input:** `n = 5`, `s = 1` → **Output:** `[]` (số nguyên tố nhỏ nhất là 2 đã vượt `s`)."}, {"title": "Ghi nhớ", "text": "\"Chọn nhiều phần tử nhất với tổng bị chặn\" → sắp tăng rồi lấy dần. Bản II đổi mục tiêu thành \"tổng lớn nhất\" thì tham lam hết đúng, phải dùng knapsack."}], "code": "class Solution {\n    func maxPrimes(_ n: Int, _ s: Int) -> [Int] {\n        if n < 2 { return [] }\n\n        // sàng Eratosthenes\n        var isPrime = [Bool](repeating: true, count: n + 1)\n        isPrime[0] = false\n        isPrime[1] = false\n        var i = 2\n        while i * i <= n {\n            if isPrime[i] {\n                var j = i * i\n                while j <= n {\n                    isPrime[j] = false\n                    j += i\n                }\n            }\n            i += 1\n        }\n\n        // lấy các số nguyên tố nhỏ nhất cho tới khi hết ngân sách\n        var res = [Int](), sum = 0\n        for p in 2...n where isPrime[p] {\n            if sum + p > s { break }\n            sum += p\n            res.append(p)\n        }\n        return res\n    }\n}\n"}, {"id": 4080, "category": "contests", "title": "Design Bus Seat Booking System", "slug": "design-bus-seat-booking-system", "difficulty": "Medium", "topics": ["Weekly Contest 523", "Design", "Hash Table", "Simulation"], "date": "2026-10-11", "time": "O(1) trung bình mỗi thao tác", "space": "O(số ghế đang đặt)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Xe buýt có `n` hàng, mỗi hàng bốn ghế `A B C D` (`A`, `D` sát cửa sổ; `A` kề `B`, `D` kề `C`). Đặt ghế giữa luôn mất 1 giây; đặt ghế cửa sổ mất 1 giây, hoặc 3 giây nếu ghế giữa kề nó **đã được đặt**. Cài đặt `toggle(seat)` (đặt nếu trống, hủy nếu đã đặt), `getTotalTime()` (tổng thời gian của các ghế đang đặt, theo đúng thứ tự đã đặt) và `getMinTime()` (tổng thời gian nhỏ nhất nếu được chọn lại thứ tự đặt)."}, {"title": "Cơ sở lý thuyết", "text": "- **Duy trì tổng tăng dần (running total)**: thay vì tính lại từ đầu mỗi lần hỏi, cập nhật tổng tại mỗi thao tác. Muốn hoàn tác được thì phải nhớ **đóng góp của từng phần tử** — ở đây là chi phí của từng ghế tại thời điểm nó được đặt.\n- **Chi phí được chốt tại lúc đặt** (đề nói rõ): việc đặt hay hủy ghế khác về sau không đổi chi phí của ghế đã đặt. Nên khi hủy, trừ đúng con số đã lưu, không tính lại.\n- **Tối ưu thứ tự bằng lập luận trực tiếp**: phụ phí chỉ phát sinh khi ghế cửa sổ được đặt **sau** ghế giữa kề nó. Nếu đặt hết ghế cửa sổ trước rồi mới tới ghế giữa thì không ghế nào bị phụ phí → mọi ghế tốn đúng 1 giây, và không thể thấp hơn 1 giây mỗi ghế."}, {"title": "Hướng xử lý", "text": "1. Lưu `cost[seat]` cho các ghế đang được đặt, và biến `total`.\n2. `toggle`:\n   - Ghế đang đặt → `total -= cost[seat]`, xóa khỏi bảng.\n   - Ghế trống → chi phí là `3` nếu nó là `A` và `B` cùng hàng đang đặt, hoặc là `D` và `C` cùng hàng đang đặt; ngược lại `1`. Lưu lại và cộng vào `total`.\n3. `getTotalTime` trả `total`.\n4. `getMinTime` trả **số ghế đang đặt**."}, {"title": "Ý tưởng triển khai", "text": "- Khóa của bảng băm là chính chuỗi tên ghế (`\"A3\"`); ghế kề được dựng bằng cách nối chuỗi: `\"B\" + row` với `row = seat.dropFirst()`.\n- `cost[seat] != nil` vừa là phép kiểm tra \"đang đặt\", nên không cần thêm `Set`.\n- Tham số `n` không cần dùng — bảng băm chỉ chứa ghế đang đặt.\n- Test cục bộ: so `getTotalTime` với một mô phỏng độc lập, và so `getMinTime` với vét cạn mọi thứ tự đặt (tối đa 6 ghế) trên 300 chuỗi thao tác ngẫu nhiên."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `BusBooking(20)`, `toggle(\"B3\")`, `toggle(\"A3\")`, `getTotalTime()`, `getMinTime()`, `toggle(\"C3\")`, `toggle(\"D3\")`, `getTotalTime()`, `getMinTime()`\n**Output:** `4`, `2`, rồi `8`, `4`\n\n```\ntoggle(\"B3\"): ghế giữa → 1          cost = {B3: 1}                      total = 1\ntoggle(\"A3\"): cửa sổ, B3 đang đặt → 3   cost = {B3: 1, A3: 3}           total = 4\ngetTotalTime() → 4\ngetMinTime()   → 2 ghế → 2          (đặt A3 trước B3 thì mỗi ghế 1 giây)\ntoggle(\"C3\"): ghế giữa → 1          cost = {B3: 1, A3: 3, C3: 1}        total = 5\ntoggle(\"D3\"): cửa sổ, C3 đang đặt → 3   cost = {…, D3: 3}               total = 8\ngetTotalTime() → 8\ngetMinTime()   → 4 ghế → 4\n```\n\n**Input:** `BusBooking(10)`, `toggle(\"C7\")`, `toggle(\"D7\")`, `getTotalTime()`, `toggle(\"D7\")`, `toggle(\"C7\")`, `toggle(\"D7\")`, `getTotalTime()`, `getMinTime()`\n**Output:** `4`, rồi `1`, `1`\n\n```\ntoggle(\"C7\"): 1                     cost = {C7: 1}          total = 1\ntoggle(\"D7\"): C7 đang đặt → 3       cost = {C7: 1, D7: 3}   total = 4\ngetTotalTime() → 4\ntoggle(\"D7\"): đang đặt → hủy, trừ 3 cost = {C7: 1}          total = 1\ntoggle(\"C7\"): đang đặt → hủy, trừ 1 cost = {}               total = 0\ntoggle(\"D7\"): C7 không còn đặt → 1  cost = {D7: 1}          total = 1\ngetTotalTime() → 1\ngetMinTime()   → 1\n```\n\nVí dụ 2 cho thấy vì sao phải lưu chi phí từng ghế: cùng ghế `D7` nhưng lần đầu tốn 3, lần sau tốn 1."}, {"title": "Ghi nhớ", "text": "Bài thiết kế có thao tác \"hoàn tác\" → lưu đóng góp của từng phần tử để trừ lại đúng. Và khi đề hỏi \"nhỏ nhất trên mọi thứ tự\", thử tìm một thứ tự đạt cận dưới hiển nhiên trước khi nghĩ tới thuật toán phức tạp."}], "code": "class BusBooking {\n    var cost = [String: Int]()   // ghế đang đặt -> thời gian đã tốn lúc đặt\n    var total = 0\n\n    init(_ n: Int) {\n    }\n\n    func toggle(_ seat: String) {\n        // đang đặt thì hủy, trả lại đúng chi phí lúc đặt\n        if let c = cost[seat] {\n            total -= c\n            cost[seat] = nil\n            return\n        }\n\n        let row = seat.dropFirst()\n        var c = 1\n        if seat.first == \"A\" && cost[\"B\" + row] != nil { c = 3 }\n        if seat.first == \"D\" && cost[\"C\" + row] != nil { c = 3 }\n        cost[seat] = c\n        total += c\n    }\n\n    func getTotalTime() -> Int {\n        return total\n    }\n\n    func getMinTime() -> Int {\n        // đặt hết ghế cửa sổ trước thì ghế nào cũng chỉ tốn 1 giây\n        return cost.count\n    }\n}\n"}, {"id": 4081, "category": "contests", "title": "Prime Subset Selection II", "slug": "prime-subset-selection-ii", "difficulty": "Hard", "topics": ["Weekly Contest 523", "Dynamic Programming", "Knapsack", "Number Theory", "Greedy"], "date": "2026-10-11", "time": "O(π(n) · s)", "space": "O(π(n) · s)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho `n, s ≤ 1000`. Chọn một tập con các số nguyên tố `≤ n` (mỗi số một lần) sao cho: (1) tổng lớn nhất có thể mà không vượt `s`; (2) trong các tập đạt tổng đó, ít phần tử nhất; (3) nếu vẫn hòa, mảng tăng dần nhỏ nhất theo thứ tự từ điển. Trả về mảng đó (rỗng nếu không chọn được gì)."}, {"title": "Cơ sở lý thuyết", "text": "- **Knapsack 0/1 theo tổng**: trạng thái là \"tổng đúng bằng `t`\", giá trị là thứ cần tối ưu (ở đây: **số phần tử ít nhất**). Với khoảng 168 số nguyên tố `≤ 1000` và `s ≤ 1000`, bảng chỉ có cỡ `1.7 × 10⁵` ô.\n- **Tối ưu nhiều tiêu chí theo thứ tự ưu tiên**: xử lý lần lượt — tiêu chí 1 chọn tổng `T`, tiêu chí 2 là giá trị DP tại `T`, tiêu chí 3 giải ở bước **truy vết**.\n- **Dựng lời giải nhỏ nhất theo từ điển**: đi từ trái sang phải, ở mỗi vị trí chọn giá trị **nhỏ nhất** mà phần còn lại vẫn hoàn thành được. Muốn kiểm tra \"phần còn lại hoàn thành được\" trong `O(1)` thì DP phải được định nghĩa trên **hậu tố** (`ps[i...]`), không phải tiền tố."}, {"title": "Hướng xử lý", "text": "1. Liệt kê các số nguyên tố `≤ n` thành `ps` (tăng dần).\n2. `g[i][t]` = số phần tử ít nhất chọn từ `ps[i...]` để có tổng đúng `t` (`∞` nếu không được). Với mỗi `i`: hoặc bỏ `ps[i]` (`g[i+1][t]`), hoặc lấy (`g[i+1][t - ps[i]] + 1`).\n3. Tiêu chí 1: `T` = giá trị `t` lớn nhất `≤ s` có `g[0][t]` hữu hạn. Nếu `T = 0` thì trả mảng rỗng.\n4. Tiêu chí 2: số phần tử `k = g[0][T]`.\n5. Tiêu chí 3 — truy vết: đang ở chỉ số `i`, còn cần tổng `t` với `k` phần tử. Duyệt `j` từ `i` lên, chọn `ps[j]` **đầu tiên** thỏa `g[j+1][t - ps[j]] == k - 1`; cập nhật `t`, `k`, `i = j + 1`. Lặp tới khi `k = 0`."}, {"title": "Ý tưởng triển khai", "text": "- Tìm số nguyên tố bằng cách thử chia cho các số nguyên tố đã có (`ps.allSatisfy`) — `n ≤ 1000` nên không cần sàng.\n- `INF = Int.max / 2` để `+ 1` không tràn; điều kiện tìm `T` là `g[0][t] >= INF`.\n- Vòng tìm `T` dừng ở `t = 0`, nơi `g[0][0] = 0` → `k = 0` → vòng truy vết không chạy → mảng rỗng. Không cần nhánh riêng cho \"không chọn được gì\".\n- Trong truy vết luôn tìm được `j` (vì `g[i][t] == k` đảm bảo tồn tại cách chọn), nên vòng `while` chắc chắn kết thúc.\n- Test cục bộ: vét cạn mọi tập con với `n ≤ 47` (15 số nguyên tố), so sánh đúng theo ba tiêu chí của đề."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 15`, `s = 18`\n**Output:** `[5, 13]`\n\n```\nps = [2, 3, 5, 7, 11, 13]   (chỉ số 0..5)\n\nTiêu chí 1: g[0][18] hữu hạn → T = 18\nTiêu chí 2: g[0][18] = 2     (các tập 2 phần tử có tổng 18: {5, 13}, {7, 11})\n\nTruy vết với i=0, t=18, k=2:\n   j=0 (2):  cần g[1][16] == 1 → 16 không phải một số nguyên tố trong [3..13] → g = 2 ✗\n   j=1 (3):  cần g[2][15] == 1 → 15 không tạo được từ [5, 7, 11, 13]           → ∞ ✗\n   j=2 (5):  cần g[3][13] == 1 → 13 có trong [7, 11, 13]                       → 1 ✓\n   → chọn 5,  t = 13, k = 1, i = 3\n\nTruy vết với i=3, t=13, k=1:\n   j=3 (7):  cần g[4][6] == 0  → ∞ ✗\n   j=4 (11): cần g[5][2] == 0  → ∞ ✗\n   j=5 (13): cần g[6][0] == 0  → 0 ✓\n   → chọn 13, t = 0, k = 0 → dừng\n\nKết quả: [5, 13]\n```\n\n**Input:** `n = 7`, `s = 20` → **Output:** `[2, 3, 5, 7]`\n\n```\nps = [2, 3, 5, 7], tổng tất cả là 17 <= 20\nt = 20, 19, 18: không tạo được · t = 17: g[0][17] = 4 → T = 17, k = 4\nTruy vết lấy lần lượt 2, 3, 5, 7\n```\n\n**Input:** `n = 5`, `s = 1` → **Output:** `[]` (`t` giảm về `0`, `k = g[0][0] = 0`)."}, {"title": "Ghi nhớ", "text": "Yêu cầu \"nhỏ nhất theo từ điển\" trên lời giải của một bài DP → định nghĩa DP theo **hậu tố** rồi truy vết tham lam từ trái sang. So với bản I: đổi mục tiêu từ \"nhiều phần tử nhất\" sang \"tổng lớn nhất\" là từ tham lam nhảy sang knapsack — đọc kỹ mục tiêu trước khi chọn kỹ thuật."}], "code": "class Solution {\n    func maxPrimeSubset(_ n: Int, _ s: Int) -> [Int] {\n        var ps = [Int]()\n        for x in stride(from: 2, through: n, by: 1) {\n            if ps.allSatisfy({ x % $0 != 0 }) { p <script>
const DATA = window.LC_DATA || [];
const byId = new Map(DATA.map(p => [p.id, p]));
const TABS = [['algorithms', 'Thuật toán'], ['concurrency', 'Concurrency'], ['contests', 'Contest']];

const inCat = () => DATA.filter(p => p.category === cat);

const shownTabs = () => TABS.filter(([k]) => DATA.some(p => p.category === k));

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Markdown tối giản: đoạn văn, danh sách (lồng 1 cấp), khối ``` , `code`, **đậm**, *nghiêng*
function inline(s) {
  // tách `code` ra trước để dấu * bên trong không bị hiểu là in đậm
  const codes = [];
  return esc(s)
    .replace(/`([^`]+)`/g, (_, c) => '\u0001' + (codes.push(c) - 1) + '\u0001')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\u0001(\d+)\u0001/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function md(text) {
  const out = [];
  const stack = []; // các thẻ danh sách đang mở
  let para = [];
  let fence = null; // các dòng của khối ``` đang mở
  const flush = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const closeTo = n => { while (stack.length > n) out.push('</li></' + stack.pop() + '>'); };

  for (const line of text.split('\n')) {
    if (line.startsWith('```')) {
      if (fence) { out.push('<pre class="trace"><code>' + esc(fence.join('\n')) + '</code></pre>'); fence = null; }
      else { flush(); closeTo(0); fence = []; }
      continue;
    }
    if (fence) { fence.push(line); continue; }
    const m = line.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
    if (m) {
      flush();
      const depth = m[1].length >= 2 ? 2 : 1;
      const tag = m[2] === '-' ? 'ul' : 'ol';
      if (stack.length > depth) closeTo(depth);
      if (stack.length === depth) out.push('</li>');
      while (stack.length < depth) { out.push('<' + tag + '>'); stack.push(tag); }
      out.push('<li>' + inline(m[3]));
    } else if (!line.trim()) {
      flush(); closeTo(0);
    } else {
      if (stack.length) closeTo(0);
      para.push(line.trim());
    }
  }
  flush(); closeTo(0);
  return out.join('\n');
}

const KW = new Set('class struct enum protocol extension func var let if else guard for while repeat in return break continue switch case default where import init self nil true false inout mutating static private public final throws throw try catch do as is defer typealias'.split(' '));
function swift(code) {
  const re = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|\b(\d[\d_]*(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += '<span class="co">' + t + '</span>';
    else if (m[2]) out += '<span class="st">' + t + '</span>';
    else if (m[3]) out += '<span class="nu">' + t + '</span>';
    else if (KW.has(m[4])) out += '<span class="kw">' + t + '</span>';
    else if (/^[A-Z]/.test(m[4])) out += '<span class="ty">' + t + '</span>';
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  return inCat().filter(p => {
    if (level !== 'Tất cả' && p.difficulty !== level) return false;
    if (!q) return true;
    return (p.id + ' ' + p.title + ' ' + p.topics.join(' ')).toLowerCase().includes(q);
  });
}

function renderList() {
  const cur = currentId();
  const items = filtered();
  // tab Contest nhóm theo kỳ thi (topic đầu tiên), các tab khác nhóm theo ngày giải
  const byContest = cat === 'contests';
  const key = p => byContest ? p.topics[0] : p.date;
  const maxId = g => Math.max(...items.filter(p => key(p) === g).map(p => p.id));
  const groups = [...new Set(items.map(key))];
  if (byContest) groups.sort((a, b) => maxId(b) - maxId(a)); else groups.sort().reverse();
  const html = groups.map(d =>
    `<div class="day">${byContest ? esc(d) : fmtDate(d)}</div>` +
    items.filter(p => key(p) === d).map(p =>
      `<a class="item ${p.difficulty}${p.id === cur ? ' active' : ''}" href="#/${p.id}">
        <span class="num">${p.id}</span><span class="name">${esc(p.title)}</span><span class="dot" title="${VI[p.difficulty]}"></span>
      </a>`).join('')
  ).join('');
  document.getElementById('list').innerHTML = html || '<p class="empty">Không có bài nào khớp.</p>';
}

function renderChips() {
  const levels = ['Tất cả', 'Easy', 'Medium', 'Hard'];
  document.getElementById('chips').innerHTML = levels.map(l =>
    `<button class="chip" aria-pressed="${l === level}" data-l="${l}">${VI[l] || l}</button>`).join('');
}

function currentId() {
  const m = location.hash.match(/^#\/(\d+)/);
  const id = m ? +m[1] : NaN;
  if (byId.has(id) && byId.get(id).category === cat) return id;
  const items = inCat();
  return items.length ? items[items.length - 1].id : null;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = shownTabs().map(([k, name]) =>
    `<button class="tab" role="tab" aria-selected="${k === cat}" data-c="${k}">${name}</button>`).join('');
  const count = l => inCat().filter(p => p.difficulty === l).length;
  document.getElementById('stats').textContent =
    `${inCat().length} bài · ${count('Easy')} dễ · ${count('Medium')} trung bình · ${count('Hard')} khó`;
}

function renderDoc() {
  const doc = document.getElementById('doc');
  const p = byId.get(currentId());
  if (!p) { doc.innerHTML = '<p class="empty">Chưa có bài nào trong mục này.</p>'; return; }

  const items = inCat();

  const prev = items[i - 1], next = items[i + 1];
  doc.innerHTML = `
    <p class="eyebrow">Bài ${p.id} · giải ngày ${fmtDate(p.date)}</p>

      <span class="badge">${VI[p.difficulty]}</span>

      ${p.status ? `<span class="ok">✓ ${esc(p.status)}</span>` : ''}
      <a class="link" href="https://leetcode.com/problems/${p.slug}/" target="_blank" rel="noopener">Mở trên LeetCode ↗</a>
    </div>
    <div class="cx">
      <div><span>Thời gian</span><b>${esc(p.time)}</b></div>
      <div><span>Bộ nhớ</span><b>${esc(p.space)}</b></div>
    </div>
    ${p.sections.map(s => `<h2>${esc(s.title)}</h2>${md(s.text)}`).join('')}
    <h2>Lời giải Swift</h2>
    <div class="codebox"><button class="copy" id="copy">Sao chép</button><pre><code>${swift(p.code)}</code></pre></div>
    <div class="nav">
      <span>${prev ? `<a href="#/${prev.id}">← ${prev.id}. ${esc(prev.title)}</a>` : ''}</span>
      <span>${next ? `<a href="#/${next.id}">${next.id}. ${esc(next.title)} →</a>` : ''}</span>
    </div>`;
  document.getElementById('copy').onclick = e => {
    navigator.clipboard.writeText(p.code).then(() => {
      e.target.textContent = 'Đã chép';
      setTimeout(() => e.target.textContent = 'Sao chép', 1200);
    });
  };
  document.title = `${p.id}. ${p.title} · Sổ tay LeetCode`;
  document.getElementById('main').scrollTop = 0;
}

document.getElementById('q').addEventListener('input', renderList);
document.getElementById('chips').addEventListener('click', e => {
  if (!e.target.dataset.l) return;
  level = e.target.dataset.l;
  renderChips(); renderList();
});
document.getElementById('tabs').addEventListener('click', e => {

  cat = e.target.dataset.c;
  const id = currentId();
  if (id != null) location.hash = '#/' + id;

// mở link tới một bài thì chuyển sang đúng tab của bài đó
function syncCat() {
  const m = location.hash.match(/^#\/(\d+)/);
  if (m && byId.has(+m[1])) cat = byId.get(+m[1]).category;
}
function renderAll() { renderTabs(); renderChips(); renderList(); renderDoc(); }
window.addEventListener('hashchange', () => { syncCat(); renderAll(); });

syncCat(); renderAll();
</script>
