<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ tay LeetCode</title>
<style>
:root {
  --bg: #f6f5f1;
  --panel: #ffffff;
  --ink: #1d1f24;
  --muted: #6b7078;
  --line: #e3e1da;
  --accent: #b4541a;
  --accent-soft: #f6e7dc;
  --code-bg: #faf9f6;
  --easy: #1a8a5a;
  --medium: #b57a00;
  --hard: #c2362f;
  --kw: #a3287a;
  --type: #1c6fa3;
  --str: #2f7d32;
  --num: #a05a00;
  --com: #8a8f98;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171b;
    --panel: #1c1f25;
    --ink: #e7e8ea;
    --muted: #979ca6;
    --line: #2c3038;
    --accent: #f0935a;
    --accent-soft: #33261d;
    --code-bg: #171a1f;
    --easy: #4ccb92;
    --medium: #e6b23e;
    --hard: #f0716a;
    --kw: #e28ac6;
    --type: #73bdea;
    --str: #8fce8f;
    --num: #e0a560;
    --com: #747a85;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
code, pre, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; }

/* Cột trái */
.side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 20px 16px 12px; border-bottom: 1px solid var(--line); }
.brand { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 2px; }
.stats { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tabs { display: flex; gap: 4px; margin: 10px 0 10px; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.tab {
  flex: 1; font: inherit; font-size: 13px; padding: 5px 8px; border: 0; border-radius: 7px; cursor: pointer;
  background: transparent; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.search {
  width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--muted); border: 1px solid var(--line);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }

.list { overflow-y: auto; padding: 8px 8px 24px; flex: 1; }
.day { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 14px 8px 6px; }
.item {
  display: flex; align-items: baseline; gap: 8px; padding: 7px 8px; border-radius: 8px;
  color: inherit; text-decoration: none; font-size: 14px; line-height: 1.35;
}
.item:hover { background: var(--bg); }
.item.active { background: var(--accent-soft); }
.item .num { color: var(--muted); font-size: 12px; min-width: 28px; font-variant-numeric: tabular-nums; }
.item .name { flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }
.Easy { --d: var(--easy); } .Medium { --d: var(--medium); } .Hard { --d: var(--hard); }
.dot { background: var(--d); }
.empty { color: var(--muted); font-size: 14px; padding: 16px 8px; }

/* Nội dung */
.main { overflow-y: auto; min-height: 0; }
.doc { max-width: 780px; margin: 0 auto; padding: 40px 32px 96px; }
.eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 14px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; color: var(--d); border: 1px solid var(--d); }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.ok { font-size: 12px; font-weight: 600; color: var(--easy); }
.link { font-size: 13px; color: var(--accent); text-decoration: none; margin-left: auto; }
.link:hover { text-decoration: underline; }

.cx { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 8px; }
.cx div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.cx span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.cx b { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 14px; font-weight: 600; }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin: 36px 0 10px; }
.doc p { margin: 0 0 12px; }
.doc ul, .doc ol { margin: 0 0 12px; padding-left: 22px; }
.doc li { margin-bottom: 6px; }
.doc li > ul { margin-top: 6px; }
.doc :not(pre) > code { background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }

.codebox { position: relative; margin-top: 4px; }
pre {
  margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; line-height: 1.6; tab-size: 4;
}
pre.trace { margin: 0 0 14px; font-size: 13px; }
.copy {
  position: absolute; top: 8px; right: 8px; font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer;
  background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
}
.copy:hover { color: var(--ink); }
.kw { color: var(--kw); } .ty { color: var(--type); } .st { color: var(--str); } .nu { color: var(--num); } .co { color: var(--com); font-style: italic; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
.nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
.nav a:hover { text-decoration: underline; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 38vh; }
  .main { overflow: visible; }
  .doc { padding: 28px 16px 72px; }
  h1 { font-size: 24px; }
  .link { margin-left: 0; }
}
</style>
</head>

</div>

<script>window.LC_DATA = [{"id": 1, "category": "algorithms", "title": "Two Sum", "slug": "two-sum", "difficulty": "Easy", "topics": ["Array", "Hash Table"], "date": "2026-10-09", "time": "O(n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng số nguyên `nums` và số `target`. Trả về chỉ số của hai phần tử có tổng bằng `target`. Đề đảm bảo có đúng một đáp án và không được dùng một phần tử hai lần."}, {"title": "Cơ sở lý thuyết", "text": "- **Bảng băm (Hash Table)**: cấu trúc ánh xạ khóa → giá trị, tra cứu và chèn trung bình `O(1)`. Trong Swift đó là `Dictionary`.\n- **Bài toán \"phần bù\" (complement)**: thay vì hỏi \"cặp nào có tổng bằng target?\", ta hỏi \"với số `x` đang xét, số `target - x` đã từng xuất hiện chưa?\". Câu hỏi thứ hai trả lời được bằng một lần tra bảng băm.\n- Đánh đổi kinh điển **thời gian ↔ bộ nhớ**: dùng thêm `O(n)` bộ nhớ để giảm thời gian từ `O(n²)` xuống `O(n)`."}, {"title": "Hướng xử lý", "text": "1. Cách ngây thơ: hai vòng lặp lồng nhau thử mọi cặp `(i, j)` → `O(n²)`.\n2. Nhận xét: với mỗi `nums[i]`, phần tử còn lại bắt buộc phải bằng `target - nums[i]`. Việc \"tìm một giá trị cụ thể\" chính là thế mạnh của bảng băm.\n3. Duyệt một lượt từ trái sang phải, vừa duyệt vừa ghi nhớ các số đã qua. Vì chỉ tra những số **đứng trước**, ta không bao giờ dùng trùng một phần tử."}, {"title": "Ý tưởng triển khai", "text": "- Dùng `seen: [Int: Int]` lưu `giá trị → chỉ số`.\n- Với mỗi `(i, num)`: nếu `seen[target - num]` tồn tại thì trả về `[j, i]`; ngược lại ghi `seen[num] = i`.\n- **Tra trước, ghi sau**: thứ tự này xử lý đúng trường hợp hai số bằng nhau như `[3, 3]`, `target = 6`.\n- `return []` ở cuối chỉ để trình biên dịch vui lòng — đề đảm bảo luôn có đáp án."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [2, 7, 11, 15]`, `target = 9`\n**Output:** `[0, 1]`\n\n```\ni=0, x=2 : cần 9-2 = 7, seen = {}        → chưa có → ghi seen = {2: 0}\ni=1, x=7 : cần 9-7 = 2, seen = {2: 0}    → có 2 ở vị trí 0 → trả về [0, 1]\n```\n\n**Input:** `nums = [3, 2, 4]`, `target = 6`\n**Output:** `[1, 2]`\n\n```\ni=0, x=3 : cần 3, seen = {}              → chưa có → seen = {3: 0}\ni=1, x=2 : cần 4, seen = {3: 0}          → chưa có → seen = {3: 0, 2: 1}\ni=2, x=4 : cần 2, seen = {3: 0, 2: 1}    → có 2 ở vị trí 1 → trả về [1, 2]\n```\n\nỞ ví dụ 2, số `3` cần chính nó (`3 + 3 = 6`) nhưng vì tra trước khi ghi nên không tự ghép với mình."}, {"title": "Ghi nhớ", "text": "Thấy đề hỏi \"tìm cặp thỏa điều kiện tổng/hiệu\" trên mảng **chưa sắp xếp** → nghĩ ngay tới bảng băm. Nếu mảng đã sắp xếp → hai con trỏ, không cần bộ nhớ phụ."}], "code": "class Solution {\n    func twoSum(_ nums: [Int], _ target: Int) -> [Int] {\n        var seen = [Int: Int]()\n        for (i, x) in nums.enumerated() {\n            if let j = seen[target - x] {\n                return [j, i]\n            }\n            seen[x] = i\n        }\n        return []\n    }\n}\n"}, {"id": 2, "category": "algorithms", "title": "Add Two Numbers", "slug": "add-two-numbers", "difficulty": "Medium", "topics": ["Linked List", "Math", "Recursion"], "date": "2026-10-09", "time": "O(max(m, n))", "space": "O(1) phụ (không tính danh sách kết quả)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Hai số nguyên không âm được lưu dưới dạng danh sách liên kết, mỗi nút một chữ số, **theo thứ tự ngược** (hàng đơn vị đứng đầu). Trả về tổng của chúng cũng dưới dạng danh sách liên kết ngược."}, {"title": "Cơ sở lý thuyết", "text": "- **Danh sách liên kết đơn**: chỉ đi được một chiều qua `next`, không truy cập ngẫu nhiên.\n- **Phép cộng tay theo cột**: cộng từ hàng đơn vị lên, mỗi cột cho ra `chữ số = tổng % 10` và `nhớ = tổng / 10`. Số nhớ luôn chỉ là 0 hoặc 1 vì tối đa `9 + 9 + 1 = 19`.\n- **Nút giả (dummy head)**: tạo một nút đứng trước đầu danh sách kết quả để khỏi phải xử lý riêng trường hợp \"nút đầu tiên\"."}, {"title": "Hướng xử lý", "text": "1. Vì chữ số được lưu ngược, đầu danh sách chính là hàng đơn vị — đúng thứ tự mà phép cộng tay cần. Không phải đảo danh sách.\n2. Đi song song trên hai danh sách; danh sách nào hết trước thì coi chữ số của nó là `0`.\n3. Đừng quên số nhớ cuối cùng: `5 + 5 = 10` phải sinh thêm một nút `1`."}, {"title": "Ý tưởng triển khai", "text": "- Gộp cả ba điều kiện dừng vào một vòng lặp: `while a != nil || b != nil || carry > 0`. Nhờ vậy không cần viết đoạn \"xử lý phần còn lại\" hay \"thêm nút nhớ\" riêng.\n- `a?.val ?? 0` — optional chaining kết hợp nil-coalescing giúp coi nút thiếu là 0 một cách gọn gàng.\n- `tail` luôn trỏ tới nút cuối của kết quả; mỗi vòng gắn nút mới vào `tail.next` rồi dịch `tail`.\n- Trả về `dummy.next`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `l1 = [2, 4, 3]`, `l2 = [5, 6, 4]` (tức 342 + 465)\n**Output:** `[7, 0, 8]` (tức 807)\n\n```\na=2,   b=5,   carry=0 → sum = 7  → thêm nút 7, carry = 0\na=4,   b=6,   carry=0 → sum = 10 → thêm nút 0, carry = 1\na=3,   b=4,   carry=1 → sum = 8  → thêm nút 8, carry = 0\na=nil, b=nil, carry=0 → dừng vòng lặp\nKết quả: 7 → 0 → 8\n```\n\n**Input:** `l1 = [5]`, `l2 = [5]`\n**Output:** `[0, 1]`\n\n```\na=5,   b=5,   carry=0 → sum = 10 → thêm nút 0, carry = 1\na=nil, b=nil, carry=1 → sum = 1  → thêm nút 1, carry = 0   (vòng lặp chạy tiếp chỉ vì còn carry)\nKết quả: 0 → 1\n```"}, {"title": "Ghi nhớ", "text": "Mẫu **dummy head + con trỏ tail** dùng lại được cho hầu hết bài \"xây danh sách liên kết mới\" (merge, partition, remove...). Không chuyển sang `Int` rồi cộng: số có thể dài tới 100 chữ số, tràn mọi kiểu số nguyên."}], "code": "class Solution {\n    func addTwoNumbers(_ l1: ListNode?, _ l2: ListNode?) -> ListNode? {\n        let dummy = ListNode(0)\n        var tail = dummy\n        var a = l1, b = l2\n        var carry = 0\n\n        while a != nil || b != nil || carry > 0 {\n            let sum = (a?.val ?? 0) + (b?.val ?? 0) + carry\n            carry = sum / 10\n\n            tail.next = ListNode(sum % 10)\n            tail = tail.next!\n\n            a = a?.next\n            b = b?.next\n        }\n        return dummy.next\n    }\n}\n"}, {"id": 3, "category": "algorithms", "title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "difficulty": "Medium", "topics": ["Hash Table", "String", "Sliding Window"], "date": "2026-10-09", "time": "O(n)", "space": "O(n) (mảng ký tự; bảng băm tối đa bằng kích thước bảng chữ cái)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s`, tìm độ dài của chuỗi con (liên tiếp) dài nhất không chứa ký tự lặp lại."}, {"title": "Cơ sở lý thuyết", "text": "- **Cửa sổ trượt (Sliding Window)**: duy trì một đoạn liên tiếp `[start, i]` luôn thỏa một bất biến (ở đây: không có ký tự trùng). Biên phải chỉ tiến, biên trái cũng chỉ tiến → mỗi phần tử được xét `O(1)` lần, tổng `O(n)`.\n- **Tính đơn điệu**: nếu `[start, i]` có ký tự trùng thì mọi cửa sổ rộng hơn chứa nó cũng trùng. Vì thế không bao giờ cần lùi `start`.\n- **Bảng băm ký tự → vị trí**: cho phép biết ngay ký tự vừa gặp đã xuất hiện ở đâu, không phải dò lại cửa sổ."}, {"title": "Hướng xử lý", "text": "1. Vét cạn mọi chuỗi con là `O(n²)` đến `O(n³)`.\n2. Mở rộng cửa sổ sang phải từng ký tự. Khi ký tự mới `c` đã có trong cửa sổ, phải thu biên trái vượt qua lần xuất hiện trước đó của `c`.\n3. Thay vì thu từng bước (dùng `Set`), ta nhớ **vị trí gần nhất** của mỗi ký tự và nhảy `start` thẳng tới `last[c] + 1`."}, {"title": "Ý tưởng triển khai", "text": "- `Array(s)` để có chỉ số nguyên; `last: [Character: Int]` lưu chỉ số gần nhất của mỗi ký tự.\n- Điều kiện `j >= start` là mấu chốt: lần xuất hiện cũ chỉ gây xung đột khi nó còn **nằm trong cửa sổ**. Thiếu điều kiện này sẽ sai với `\"abba\"` (`start` bị kéo lùi về sau khi gặp `a` thứ hai).\n- Cập nhật `best = max(best, i - start + 1)` sau mỗi bước.\n- Muốn nhanh hơn thì đổi `Dictionary` thành mảng 128 ô duyệt trên `s.utf8`, nhưng bản này đã đủ qua và dễ đọc hơn."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"abcabcbb\"`\n**Output:** `3` (chuỗi con `\"abc\"`)\n\n```\ni=0 'a': chưa gặp                 → start=0, cửa sổ \"a\",   best=1\ni=1 'b': chưa gặp                 → start=0, cửa sổ \"ab\",  best=2\ni=2 'c': chưa gặp                 → start=0, cửa sổ \"abc\", best=3\ni=3 'a': last[a]=0 >= start=0     → start=1, cửa sổ \"bca\", best=3\ni=4 'b': last[b]=1 >= start=1     → start=2, cửa sổ \"cab\", best=3\ni=5 'c': last[c]=2 >= start=2     → start=3, cửa sổ \"abc\", best=3\ni=6 'b': last[b]=4 >= start=3     → start=5, cửa sổ \"cb\",  best=3\ni=7 'b': last[b]=6 >= start=5     → start=7, cửa sổ \"b\",   best=3\n```\n\n**Input:** `s = \"abba\"` — ca cho thấy vì sao cần điều kiện `j >= start`\n**Output:** `2`\n\n```\ni=0 'a': start=0, cửa sổ \"a\",  best=1\ni=1 'b': start=0, cửa sổ \"ab\", best=2\ni=2 'b': last[b]=1 >= 0  → start=2, cửa sổ \"b\",  best=2\ni=3 'a': last[a]=0 <  2  → KHÔNG đổi start, cửa sổ \"ba\", best=2\n```"}, {"title": "Ghi nhớ", "text": "Cụm \"chuỗi con / mảng con **liên tiếp** dài nhất (ngắn nhất) thỏa điều kiện\" gần như luôn là cửa sổ trượt. Trong Swift, hãy chuyển sang `utf8` hoặc `Array(s)` trước khi cần chỉ số — `String.Index` không phải số nguyên."}], "code": "class Solution {\n    func lengthOfLongestSubstring(_ s: String) -> Int {\n        let a = Array(s)\n        var last = [Character: Int]()\n        var start = 0, best = 0\n\n        for i in 0..<a.count {\n            if let j = last[a[i]], j >= start {\n                start = j + 1\n            }\n            last[a[i]] = i\n            best = max(best, i - start + 1)\n        }\n        return best\n    }\n}\n"}, {"id": 4, "category": "algorithms", "title": "Median of Two Sorted Arrays", "slug": "median-of-two-sorted-arrays", "difficulty": "Hard", "topics": ["Array", "Binary Search", "Divide and Conquer"], "date": "2026-10-09", "time": "O(log(min(m, n)))", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho hai mảng đã sắp xếp `nums1` (độ dài `m`) và `nums2` (độ dài `n`). Tìm trung vị của hai mảng gộp lại, với độ phức tạp `O(log(m + n))`."}, {"title": "Cơ sở lý thuyết", "text": "- **Trung vị** chia tập dữ liệu thành hai nửa bằng nhau sao cho mọi phần tử nửa trái `≤` mọi phần tử nửa phải. Trung vị là `max(nửa trái)` (tổng lẻ) hoặc trung bình của `max(nửa trái)` và `min(nửa phải)` (tổng chẵn).\n- **Tìm kiếm nhị phân trên đáp án**: không tìm một giá trị trong mảng mà tìm một **vị trí cắt** thỏa điều kiện đơn điệu.\n- **Phân hoạch (partition)**: cắt `a` tại `i` và `b` tại `j`. Nếu cố định kích thước nửa trái là `half = (m + n + 1) / 2` thì `j = half - i` — chỉ còn **một** ẩn số `i`."}, {"title": "Hướng xử lý", "text": "1. Gộp hai mảng rồi lấy phần tử giữa là `O(m + n)` — đúng nhưng không đạt yêu cầu log.\n2. Yêu cầu `log` gợi ý tìm nhị phân. Ta tìm `i` sao cho phép cắt hợp lệ:\n   - `a[i-1] ≤ b[j]` (trái của `a` không vượt phải của `b`)\n   - `b[j-1] ≤ a[i]` (trái của `b` không vượt phải của `a`)\n3. Tính đơn điệu: nếu `a[i-1] > b[j]` thì ta lấy **quá nhiều** từ `a` → giảm `i`. Ngược lại, nếu `b[j-1] > a[i]` thì lấy quá ít → tăng `i`.\n4. Tìm nhị phân trên mảng **ngắn hơn** để đạt `O(log(min(m, n)))` và đảm bảo `j` không bao giờ âm."}, {"title": "Ý tưởng triển khai", "text": "- Hoán đổi để `a` là mảng ngắn hơn; `lo = 0`, `hi = m` (có `m + 1` vị trí cắt, kể cả lấy 0 hoặc lấy hết).\n- **Lính canh**: khi cắt ở mép, coi phần tử \"ngoài biên\" là `Int.min` (bên trái) hoặc `Int.max` (bên phải). Nhờ đó không phải viết nhánh riêng cho mảng rỗng hay cắt ở đầu/cuối.\n- `half = (m + n + 1) / 2` — cộng 1 để khi tổng lẻ, nửa trái nhiều hơn 1 phần tử, và trung vị chính là `max(aL, bL)`.\n- Khi tổng chẵn: `(max(aL, bL) + min(aR, bR)) / 2`.\n- Cách \"lười\" vẫn qua được LeetCode: `(nums1 + nums2).sorted()` rồi lấy phần tử giữa — `O((m+n) log(m+n))`, đáng biết để viết nhanh khi phỏng vấn trước khi tối ưu."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums1 = [1, 3]`, `nums2 = [2]`\n**Output:** `2.0`\n\nSau khi hoán đổi: `a = [2]` (ngắn hơn), `b = [1, 3]`, `m = 1`, `n = 2`, `half = 2`.\n\n```\nlo=0, hi=1 → i=0, j=2\n   aL=-∞  aR=2  |  bL=3  bR=+∞\n   bL=3 > aR=2 → lấy quá ít từ a → lo = 1\n\nlo=1, hi=1 → i=1, j=1\n   aL=2  aR=+∞  |  bL=1  bR=3\n   aL <= bR và bL <= aR → phép cắt hợp lệ\n   tổng 3 phần tử (lẻ) → trung vị = max(aL, bL) = max(2, 1) = 2\n```\n\n**Input:** `nums1 = [1, 2]`, `nums2 = [3, 4]`\n**Output:** `2.5`\n\n`a = [1, 2]`, `b = [3, 4]`, `m = n = 2`, `half = 2`.\n\n```\nlo=0, hi=2 → i=1, j=1\n   aL=1  aR=2  |  bL=3  bR=4\n   bL=3 > aR=2 → lo = 2\n\nlo=2, hi=2 → i=2, j=0\n   aL=2  aR=+∞  |  bL=-∞  bR=3\n   hợp lệ; tổng 4 phần tử (chẵn)\n   → (max(2, -∞) + min(+∞, 3)) / 2 = (2 + 3) / 2 = 2.5\n```"}, {"title": "Ghi nhớ", "text": "Mấu chốt là đổi câu hỏi từ \"tìm phần tử thứ k\" thành \"tìm vị trí cắt hợp lệ\". Luôn nhị phân trên mảng ngắn hơn và dùng lính canh `±∞` cho biên — hai mẹo này loại bỏ gần hết lỗi lệch-một."}], "code": "class Solution {\n    func findMedianSortedArrays(_ nums1: [Int], _ nums2: [Int]) -> Double {\n        // a là mảng ngắn hơn\n        var a = nums1, b = nums2\n        if a.count > b.count { swap(&a, &b) }\n        let m = a.count, n = b.count\n        let half = (m + n + 1) / 2\n\n        var lo = 0, hi = m\n        while lo <= hi {\n            let i = (lo + hi) / 2\n            let j = half - i\n\n            let aL = i > 0 ? a[i - 1] : Int.min\n            let aR = i < m ? a[i] : Int.max\n            let bL = j > 0 ? b[j - 1] : Int.min\n            let bR = j < n ? b[j] : Int.max\n\n            if aL > bR {\n                hi = i - 1\n            } else if bL > aR {\n                lo = i + 1\n            } else {\n                if (m + n) % 2 == 1 { return Double(max(aL, bL)) }\n                return Double(max(aL, bL) + min(aR, bR)) / 2\n            }\n        }\n        return 0\n    }\n}\n"}, {"id": 5, "category": "algorithms", "title": "Longest Palindromic Substring", "slug": "longest-palindromic-substring", "difficulty": "Medium", "topics": ["Two Pointers", "String", "Dynamic Programming"], "date": "2026-10-09", "time": "O(n²)", "space": "O(n) (mảng ký tự của chuỗi)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s`, trả về chuỗi con đối xứng (palindrome) dài nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Palindrome** đọc xuôi ngược như nhau, tức đối xứng qua một **tâm**. Tâm có thể là một ký tự (độ dài lẻ, `aba`) hoặc khe giữa hai ký tự (độ dài chẵn, `abba`). Chuỗi dài `n` có `2n - 1` tâm.\n- **Tính chất lồng nhau**: nếu `s[l...r]` là palindrome thì `s[l+1...r-1]` cũng vậy. Ngược lại, palindrome mở rộng được khi và chỉ khi hai ký tự ở hai đầu bằng nhau.\n- Có ba cách phổ biến: quy hoạch động `O(n²)` thời gian + `O(n²)` bộ nhớ; **mở rộng từ tâm** `O(n²)` thời gian + `O(1)` bộ nhớ phụ; thuật toán **Manacher** `O(n)`."}, {"title": "Hướng xử lý", "text": "1. Vét cạn: thử mọi cặp `(l, r)` và kiểm tra đối xứng → `O(n³)`.\n2. Dùng tính chất lồng nhau: thay vì kiểm tra từ ngoài vào, ta đi **từ tâm ra**. Mỗi tâm mở rộng tối đa `O(n)` bước và dừng ngay khi gặp cặp ký tự khác nhau.\n3. Duyệt cả `2n - 1` tâm, giữ lại palindrome dài nhất.\n\nVới `n ≤ 1000`, `O(n²)` là quá đủ; Manacher chỉ cần khi `n` lên tới hàng trăm nghìn."}, {"title": "Ý tưởng triển khai", "text": "- Hàm lồng `expand(i, j)`: lùi `l`, tiến `r` khi còn khớp. Khi dừng, `l` và `r` đã vượt quá biên một bước nên palindrome là `a[l+1...r-1]`, độ dài `r - l - 1`.\n- Hàm lồng cập nhật thẳng `start`, `len` của hàm ngoài — khỏi phải trả về rồi tính ngược vị trí bắt đầu từ tâm.\n- Gọi `expand(i, i)` cho tâm lẻ và `expand(i, i + 1)` cho tâm chẵn.\n- Cắt chuỗi **một lần** ở cuối, tránh tạo `String` trong vòng lặp.\n- Làm việc trên `Array(s)` để có chỉ số nguyên `O(1)`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"babad\"`\n**Output:** `\"bab\"` (`\"aba\"` cũng đúng)\n\n```\ni=0: expand(0,0) \"b\"   → không mở rộng được → dài 1 → len=1, start=0\n     expand(0,1) b≠a   → dài 0\ni=1: expand(1,1) \"a\"   → l=0,r=2: b==b ✓ → l=-1 dừng → \"bab\" dài 3 → len=3, start=0\n     expand(1,2) a≠b   → dài 0\ni=2: expand(2,2) \"b\"   → l=1,r=3: a==a ✓ → l=0,r=4: b≠d dừng → \"aba\" dài 3 (không lớn hơn 3, giữ nguyên)\n     expand(2,3) b≠a   → dài 0\ni=3: expand(3,3) \"a\"   → l=2,r=4: b≠d → dài 1\ni=4: expand(4,4) \"d\"   → dài 1\nKết quả: a[0..<3] = \"bab\"\n```\n\n**Input:** `s = \"cbbd\"` — palindrome độ dài chẵn\n**Output:** `\"bb\"`\n\n```\ni=1: expand(1,1) \"b\"   → l=0,r=2: c≠b → dài 1\n     expand(1,2) b==b ✓ → l=0,r=3: c≠d dừng → \"bb\" dài 2 → len=2, start=1\n```"}, {"title": "Ghi nhớ", "text": "Bài palindrome → nghĩ \"tâm đối xứng\" trước. Nhớ xử lý **cả hai loại tâm**; quên tâm chẵn là lỗi thường gặp nhất (sai với `\"cbbd\"`)."}], "code": "class Solution {\n    func longestPalindrome(_ s: String) -> String {\n        let a = Array(s)\n        let n = a.count\n        var start = 0, len = 0\n\n        func expand(_ i: Int, _ j: Int) {\n            var l = i, r = j\n            while l >= 0 && r < n && a[l] == a[r] {\n                l -= 1\n                r += 1\n            }\n            // palindrome là a[l+1...r-1]\n            if r - l - 1 > len {\n                len = r - l - 1\n                start = l + 1\n            }\n        }\n\n        for i in 0..<n {\n            expand(i, i)\n            expand(i, i + 1)\n        }\n        return String(a[start..<start + len])\n    }\n}\n"}, {"id": 6, "category": "algorithms", "title": "Zigzag Conversion", "slug": "zigzag-conversion", "difficulty": "Medium", "topics": ["String", "Simulation"], "date": "2026-10-09", "time": "O(n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Viết chuỗi `s` theo hình zigzag trên `numRows` dòng (đi xuống rồi chéo lên, lặp lại), sau đó đọc từng dòng từ trái sang phải và nối lại."}, {"title": "Cơ sở lý thuyết", "text": "- **Mô phỏng (Simulation)**: làm đúng theo quy trình đề mô tả, không cần công thức thông minh.\n- Điều duy nhất quan trọng là **mỗi ký tự rơi vào dòng nào**; vị trí cột không ảnh hưởng vì ta chỉ đọc theo dòng, và trong cùng một dòng các ký tự xuất hiện đúng theo thứ tự gốc.\n- Chỉ số dòng dao động kiểu \"quả bóng nảy\": `0, 1, …, numRows-1, numRows-2, …, 1, 0, 1, …` với chu kỳ `2 * (numRows - 1)`."}, {"title": "Hướng xử lý", "text": "1. Không cần dựng ma trận 2 chiều — chỉ cần `numRows` chuỗi, mỗi chuỗi gom các ký tự của một dòng.\n2. Duyệt `s`, giữ dòng hiện tại `r` và hướng đi `step` (`+1` xuống, `-1` lên). Chạm dòng đầu hoặc dòng cuối thì đổi hướng.\n3. Nối các dòng lại là xong.\n\nCách khác: tính trực tiếp chỉ số bằng chu kỳ `2 * (numRows - 1)` để không cần bộ nhớ theo dòng, nhưng khó đọc hơn mà độ phức tạp không đổi."}, {"title": "Ý tưởng triển khai", "text": "- `rows = [String](repeating: \"\", count: numRows)`.\n- Đặt hướng **trước** khi bước: ở dòng `0` thì `step = 1`, ở dòng cuối thì `step = -1`, rồi `r += step`.\n- **Trường hợp biên `numRows == 1`**: dòng đầu cũng là dòng cuối, `step` sẽ thành `-1` và `r` chạy ra `-1` → crash. Phải trả về `s` ngay từ đầu.\n- Khi `numRows >= s.count` không cần xử lý riêng: mỗi ký tự một dòng, nối lại vẫn ra `s`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"PAYPALISHIRING\"`, `numRows = 3`\n**Output:** `\"PAHNAPLSIIGYIR\"`\n\nHình zigzag:\n\n```\nP   A   H   N\nA P L S I I G\nY   I   R\n```\n\nTừng ký tự rơi vào dòng nào (`r`) và hướng đi sau đó (`step`):\n\n```\nP → r=0 (step=+1)    A → r=1    Y → r=2 (step=-1)    P → r=1\nA → r=0 (step=+1)    L → r=1    I → r=2 (step=-1)    S → r=1\nH → r=0 (step=+1)    I → r=1    R → r=2 (step=-1)    I → r=1\nN → r=0 (step=+1)    G → r=1\n\nrows[0] = \"PAHN\"\nrows[1] = \"APLSIIG\"\nrows[2] = \"YIR\"\nNối lại: \"PAHN\" + \"APLSIIG\" + \"YIR\" = \"PAHNAPLSIIGYIR\"\n```"}, {"title": "Ghi nhớ", "text": "Gặp bài \"sắp xếp theo hình dạng rồi đọc lại\", hãy hỏi: thông tin nào thật sự cần giữ? Ở đây chỉ là chỉ số dòng. Luôn thử trường hợp suy biến (`numRows = 1`) trước khi nộp."}], "code": "class Solution {\n    func convert(_ s: String, _ numRows: Int) -> String {\n        if numRows == 1 { return s }\n\n        var rows = [String](repeating: \"\", count: numRows)\n        var r = 0, step = 1\n\n        for c in s {\n            rows[r].append(c)\n            if r == 0 { step = 1 }\n            if r == numRows - 1 { step = -1 }\n            r += step\n        }\n        return rows.joined()\n    }\n}\n"}, {"id": 7, "category": "algorithms", "title": "Reverse Integer", "slug": "reverse-integer", "difficulty": "Medium", "topics": ["Math"], "date": "2026-10-09", "time": "O(log |x|) (số chữ số, tối đa 10)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho số nguyên 32 bit có dấu `x`, trả về `x` với các chữ số đảo ngược. Nếu kết quả vượt khỏi khoảng `[-2³¹, 2³¹ - 1]` thì trả về `0`."}, {"title": "Cơ sở lý thuyết", "text": "- **Tách chữ số bằng chia lấy dư**: `x % 10` lấy chữ số cuối, `x / 10` bỏ chữ số cuối. Ghép ngược lại bằng `res = res * 10 + chữ số`.\n- **Phép chia số âm trong Swift** (giống C, Java) làm tròn **về 0**: `-123 % 10 == -3`, `-123 / 10 == -12`. Nhờ vậy cùng một vòng lặp chạy đúng cho cả số âm, không cần tách dấu.\n- **Tràn số (overflow)**: khoảng 32 bit là `[-2147483648, 2147483647]`. Đảo `1534236469` ra `9646324351` — vượt giới hạn."}, {"title": "Hướng xử lý", "text": "1. Lặp: lấy chữ số cuối của `x`, đẩy vào cuối `res`, cho tới khi `x == 0`.\n2. Xử lý tràn — có hai cách:\n   - **Cách đơn giản (dùng ở đây)**: `Int` của Swift trên LeetCode là 64 bit, đảo một số 32 bit không bao giờ tràn 64 bit. Cứ đảo xong rồi so với `Int32.min/max`.\n   - **Cách \"đúng tinh thần đề\"** (đề nói môi trường không lưu được số 64 bit): kiểm tra **trước** khi nhân, `res > Int32.max / 10` hoặc `res == Int32.max / 10 && chữ số > 7` thì trả `0` (tương tự cho phía âm với `-8`)."}, {"title": "Ý tưởng triển khai", "text": "- `var x = x` để che tham số (tham số hàm trong Swift là hằng).\n- Điều kiện lặp là `x != 0` chứ không phải `x > 0`, để số âm cũng chạy.\n- Số 0 ở cuối tự biến mất: `120 → 021 → 21` vì `res * 10 + 0` khi `res = 0` vẫn là `0`.\n- Trong Swift, tràn số nguyên sẽ **crash** chứ không cuộn vòng như C — nên nếu dùng `Int32` thật thì bắt buộc phải kiểm tra trước khi nhân."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `x = 123` → **Output:** `321`\n\n```\nx=123, res=0   → lấy 3 → res = 3,   x = 12\nx=12,  res=3   → lấy 2 → res = 32,  x = 1\nx=1,   res=32  → lấy 1 → res = 321, x = 0 → dừng\n321 nằm trong khoảng 32 bit → trả về 321\n```\n\n**Input:** `x = -123` → **Output:** `-321`\n\n```\nx=-123 → -123 % 10 = -3 → res = -3,   x = -12\nx=-12  → -12 % 10  = -2 → res = -32,  x = -1\nx=-1   → -1 % 10   = -1 → res = -321, x = 0 → dừng\n```\n\n**Input:** `x = 1534236469` → **Output:** `0`\n\n```\nĐảo xong: res = 9646324351\n9646324351 > 2147483647 (Int32.max) → trả về 0\n```"}, {"title": "Ghi nhớ", "text": "Bài thao tác chữ số: `% 10` và `/ 10`. Luôn tự hỏi \"có tràn không?\" và nhớ rằng Swift bẫy lỗi tràn lúc chạy."}], "code": "class Solution {\n    func reverse(_ x: Int) -> Int {\n        var x = x, res = 0\n        while x != 0 {\n            res = res * 10 + x % 10\n            x /= 10\n        }\n        // Int của Swift là 64 bit nên cứ đảo xong rồi mới kiểm tra tràn\n        if res > Int(Int32.max) || res < Int(Int32.min) { return 0 }\n        return res\n    }\n}\n"}, {"id": 8, "category": "algorithms", "title": "String to Integer (atoi)", "slug": "string-to-integer-atoi", "difficulty": "Medium", "topics": ["String"], "date": "2026-10-09", "time": "O(n)", "space": "O(n) (mảng ký tự; có thể O(1) nếu duyệt trực tiếp)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cài đặt `myAtoi(s)`: bỏ khoảng trắng đầu, đọc dấu `+`/`-` (nếu có), đọc các chữ số liên tiếp cho tới khi gặp ký tự khác, rồi kẹp kết quả vào khoảng số nguyên 32 bit."}, {"title": "Cơ sở lý thuyết", "text": "- **Phân tích cú pháp tuần tự (parsing)**: đọc chuỗi một lượt từ trái sang phải qua các **pha** cố định. Về bản chất đây là một **máy trạng thái hữu hạn**: `khoảng trắng → dấu → chữ số → dừng`, và không bao giờ quay lại pha trước.\n- **Tích lũy chữ số**: `res = res * 10 + d` (sơ đồ Horner).\n- **Kẹp giá trị (clamp)**: `min(max(x, lo), hi)`."}, {"title": "Hướng xử lý", "text": "Bài không khó về thuật toán, khó ở chỗ **làm đúng từng quy tắc theo đúng thứ tự**:\n1. Bỏ qua mọi dấu cách ở đầu.\n2. Đọc **tối đa một** dấu. `\"+-12\"` → `0` vì sau `+` là `-`, không phải chữ số.\n3. Đọc chữ số đến khi gặp ký tự không phải số hoặc hết chuỗi. Không có chữ số nào → `0`.\n4. Kẹp vào `[-2³¹, 2³¹ - 1]`.\n\nCạm bẫy: chuỗi có thể dài 200 ký tự toàn chữ số → tràn cả `Int` 64 bit nếu cứ cộng dồn."}, {"title": "Ý tưởng triển khai", "text": "- Một con trỏ `i` chạy qua ba vòng/khối nối tiếp nhau, mỗi khối là một pha.\n- **Chống tràn kiểu lười**: ngay khi `res > Int32.max` thì `break`. Lúc đó `res` nhiều nhất cỡ `2.1 × 10¹⁰`, còn rất xa giới hạn 64 bit; phần kẹp ở cuối sẽ đưa nó về đúng biên.\n- `Character.wholeNumberValue` trả `Int?` — vừa kiểm tra \"là chữ số\" vừa lấy giá trị. Kèm `isASCII` để không nhận nhầm chữ số Unicode khác (ví dụ `\"٣\"`).\n- Nhân dấu **sau cùng**, rồi kẹp: xử lý đúng cả `-2147483648`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"   -042\"` → **Output:** `-42`\n\n```\nPha 1 (khoảng trắng): bỏ 3 dấu cách       → i=3\nPha 2 (dấu):          gặp '-' → sign=-1   → i=4\nPha 3 (chữ số):       '0' → res=0\n                      '4' → res=4\n                      '2' → res=42        → hết chuỗi\nres = 42 * (-1) = -42, nằm trong khoảng → trả về -42\n```\n\n**Input:** `s = \"1337c0d3\"` → **Output:** `1337`\n\n```\nKhông có khoảng trắng, không có dấu.\n'1' → 1, '3' → 13, '3' → 133, '7' → 1337, gặp 'c' → dừng đọc\nTrả về 1337\n```\n\n**Input:** `s = \"-91283472332\"` → **Output:** `-2147483648`\n\n```\nsign = -1\n9 → 91 → 912 → 9128 → 91283 → 912834 → 9128347 → 91283472 → 912834723\n→ 9128347233 > 2147483647 → break (bỏ các chữ số còn lại)\nres = -9128347233 → kẹp về Int32.min = -2147483648\n```\n\n**Input:** `s = \"+-12\"` → **Output:** `0` (sau `+` là `-`, không phải chữ số nên pha 3 không đọc được gì)."}, {"title": "Ghi nhớ", "text": "Với bài parsing, viết ra danh sách các pha rồi code từng pha một, kiểm tra `i < a.count` ở mọi chỗ truy cập. Thử các ca: rỗng, toàn dấu cách, chỉ có dấu, hai dấu liền nhau, tràn dương, tràn âm."}], "code": "class Solution {\n    func myAtoi(_ s: String) -> Int {\n        let a = Array(s)\n        var i = 0, sign = 1, res = 0\n\n        while i < a.count && a[i] == \" \" { i += 1 }\n\n        if i < a.count && (a[i] == \"+\" || a[i] == \"-\") {\n            if a[i] == \"-\" { sign = -1 }\n            i += 1\n        }\n\n        while i < a.count, let d = a[i].wholeNumberValue, a[i].isASCII {\n            res = res * 10 + d\n            // vượt 32 bit là dừng luôn, khỏi sợ tràn 64 bit\n            if res > Int(Int32.max) { break }\n            i += 1\n        }\n\n        res *= sign\n        return min(max(res, Int(Int32.min)), Int(Int32.max))\n    }\n}\n"}, {"id": 9, "category": "algorithms", "title": "Palindrome Number", "slug": "palindrome-number", "difficulty": "Easy", "topics": ["Math"], "date": "2026-10-09", "time": "O(log x) (số chữ số)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho số nguyên `x`, trả về `true` nếu `x` đọc xuôi ngược như nhau. Câu hỏi thêm: làm mà không chuyển sang chuỗi."}, {"title": "Cơ sở lý thuyết", "text": "- Một số là **palindrome** khi dãy chữ số thập phân của nó đối xứng.\n- **Đảo số bằng số học**: lặp `rev = rev * 10 + n % 10; n /= 10` — cùng kỹ thuật với bài 7 (Reverse Integer).\n- Số âm không bao giờ là palindrome vì dấu `-` chỉ nằm ở một đầu (`-121` đọc ngược là `121-`)."}, {"title": "Hướng xử lý", "text": "1. Cách nhanh nhất để viết: `String(x) == String(String(x).reversed())`. Đúng, nhưng tốn bộ nhớ cho chuỗi.\n2. Cách số học: đảo toàn bộ `x` rồi so với chính nó.\n3. Tối ưu thêm (không bắt buộc): chỉ đảo **nửa sau** — dừng khi `rev >= n`, rồi so `n == rev` (số chữ số chẵn) hoặc `n == rev / 10` (lẻ). Cách này tránh hẳn nguy cơ tràn, nhưng phải loại riêng các số tận cùng bằng `0`."}, {"title": "Ý tưởng triển khai", "text": "- Loại số âm ngay đầu hàm.\n- Đảo cả số cho đơn giản. Với `Int` 64 bit của Swift, đảo một số 32 bit không thể tràn nên không cần kiểm tra gì thêm.\n- Giữ nguyên `x` để so sánh, làm việc trên bản sao `n`.\n- `x = 0` → vòng lặp không chạy, `rev = 0 == x` → `true`. Các số tận cùng bằng 0 như `10` → `rev = 1 ≠ 10` → `false`, tự đúng."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `x = 121` → **Output:** `true`\n\n```\nn=121, rev=0  → rev = 1,   n = 12\nn=12,  rev=1  → rev = 12,  n = 1\nn=1,   rev=12 → rev = 121, n = 0 → dừng\nrev == x (121 == 121) → true\n```\n\n**Input:** `x = 10` → **Output:** `false`\n\n```\nn=10, rev=0 → rev = 0, n = 1\nn=1,  rev=0 → rev = 1, n = 0 → dừng\nrev == x ? 1 ≠ 10 → false\n```\n\n**Input:** `x = -121` → **Output:** `false` (số âm bị loại ngay ở dòng đầu)."}, {"title": "Ghi nhớ", "text": "Bài dễ nhưng là dịp ôn mẫu \"tách và ghép chữ số\". Nếu ngôn ngữ dùng số 32 bit thật thì dùng biến thể \"đảo nửa sau\" để khỏi lo tràn."}], "code": "class Solution {\n    func isPalindrome(_ x: Int) -> Bool {\n        if x < 0 { return false }\n\n        var n = x, rev = 0\n        while n > 0 {\n            rev = rev * 10 + n % 10\n            n /= 10\n        }\n        return rev == x\n    }\n}\n"}, {"id": 10, "category": "algorithms", "title": "Regular Expression Matching", "slug": "regular-expression-matching", "difficulty": "Hard", "topics": ["String", "Dynamic Programming", "Recursion"], "date": "2026-10-09", "time": "O(m · n)", "space": "O(m · n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s` và mẫu `p`, cài đặt so khớp biểu thức chính quy hỗ trợ `.` (khớp một ký tự bất kỳ) và `*` (khớp **0 hoặc nhiều** lần ký tự đứng ngay trước). Phải khớp **toàn bộ** `s`."}, {"title": "Cơ sở lý thuyết", "text": "- **Quy hoạch động (DP)** áp dụng khi bài toán có *cấu trúc con tối ưu* và *bài toán con gối nhau*. Ở đây: \"`s[i...]` có khớp `p[j...]` không\" chỉ phụ thuộc vào các hậu tố ngắn hơn, và cùng một cặp `(i, j)` bị hỏi lại rất nhiều lần nếu đệ quy ngây thơ.\n- `*` không đứng một mình: nó luôn đi kèm ký tự ngay trước, tạo thành một **đơn vị** `x*` nghĩa là \"không, một hoặc nhiều `x`\".\n- Đệ quy quay lui thuần có thể mất thời gian **hàm mũ** (ví dụ `s = \"aaaaaaaaaaaab\"`, `p = \"a*a*a*a*c\"`); ghi nhớ kết quả theo `(i, j)` đưa về `O(m · n)`."}, {"title": "Hướng xử lý", "text": "Định nghĩa `dp[i][j]` = `s[i...]` khớp `p[j...]`. Xét ký tự mẫu `p[j]`:\n\n1. Gọi `first` = ký tự đầu khớp nhau: `i < m` và (`p[j] == s[i]` hoặc `p[j] == \".\"`).\n2. **Nếu sau `p[j]` là `*`** — có hai lựa chọn, chỉ cần một cái đúng:\n   - *Dùng 0 lần*: bỏ cả cụm `x*` → `dp[i][j + 2]`.\n   - *Dùng thêm 1 lần*: cần `first`, tiêu một ký tự của `s` nhưng **giữ nguyên `j`** để cụm `x*` còn dùng tiếp được → `dp[i + 1][j]`.\n3. **Nếu không có `*`**: bắt buộc khớp đúng một ký tự → `first && dp[i + 1][j + 1]`.\n\nTrường hợp gốc: `dp[m][n] = true` (cả hai cùng hết). Còn `dp[i][n]` với `i < m` là `false` (mẫu hết mà chuỗi còn)."}, {"title": "Ý tưởng triển khai", "text": "- Bảng `(m + 1) × (n + 1)`, điền **từ dưới lên, từ phải sang trái** vì mỗi ô phụ thuộc vào `i + 1` và `j + 1`, `j + 2`.\n- `i` phải chạy từ `m` (chuỗi rỗng) chứ không phải `m - 1`: chuỗi rỗng vẫn có thể khớp mẫu như `a*b*`.\n- `j` chạy từ `n - 1`; cột `j = n` giữ giá trị khởi tạo.\n- Kiểm tra `i < m` trong `first` đảm bảo không bao giờ đọc `dp[m + 1][…]`, vì nhánh đó bị `&&` chặn lại.\n- Có thể nén còn hai hàng để giảm bộ nhớ xuống `O(n)`, nhưng bảng đầy đủ dễ đọc và dễ debug hơn."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"aab\"`, `p = \"c*a*b\"`\n**Output:** `true`\n\n`dp[i][j]` trả lời: `s[i...]` có khớp `p[j...]` không. Bảng được điền từ dưới lên; dưới đây là các ô nằm trên đường dẫn tới đáp án:\n\n```\ndp[3][5]: \"\"    vs \"\"       → cả hai cùng hết                          → true\ndp[2][4]: \"b\"   vs \"b\"      → 'b' == 'b', xét tiếp dp[3][5]            → true\ndp[2][2]: \"b\"   vs \"a*b\"    → bỏ qua \"a*\", xét dp[2][4]                → true\ndp[1][2]: \"ab\"  vs \"a*b\"    → \"a*\" ăn 'a', ở lại j=2, xét dp[2][2]     → true\ndp[0][2]: \"aab\" vs \"a*b\"    → \"a*\" ăn 'a', ở lại j=2, xét dp[1][2]     → true\ndp[0][0]: \"aab\" vs \"c*a*b\"  → bỏ qua \"c*\" (dùng 0 lần), xét dp[0][2]   → true\n```\n\nToàn bộ bảng (`T` = true, `.` = false), cột là `j`, hàng là `i`:\n\n```\n            j=0   1   2   3   4   5\np[j...]  =  c*a*b      a*b     b   \"\"\ni=0 \"aab\"    T    .   T   .   .   .\ni=1 \"ab\"     T    .   T   .   .   .\ni=2 \"b\"      T    .   T   .   T   .\ni=3 \"\"       .    .   .   .   .   T\n```\n\n**Input:** `s = \"aa\"`, `p = \"a\"` → **Output:** `false`\n\n```\ndp[2][1] = true\ndp[1][0]: \"a\"  vs \"a\" → khớp, xét dp[2][1] → true\ndp[0][0]: \"aa\" vs \"a\" → khớp 'a', xét dp[1][1]: \"a\" vs \"\" → false\n→ false (mẫu hết mà chuỗi còn)\n```"}, {"title": "Ghi nhớ", "text": "So khớp hai chuỗi (regex, wildcard, edit distance, LCS) → DP hai chiều trên cặp chỉ số `(i, j)`. Với `*`, nghĩ theo cụm `x*` và hai lựa chọn \"bỏ qua\" / \"ăn thêm một ký tự, ở lại chỗ cũ\"."}], "code": "class Solution {\n    func isMatch(_ s: String, _ p: String) -> Bool {\n        let s = Array(s), p = Array(p)\n        let m = s.count, n = p.count\n\n        // dp[i][j]: s[i...] có khớp p[j...] không\n        var dp = [[Bool]](repeating: [Bool](repeating: false, count: n + 1), count: m + 1)\n        dp[m][n] = true\n\n        for i in (0...m).reversed() {\n            for j in (0..<n).reversed() {\n                let first = i < m && (p[j] == s[i] || p[j] == \".\")\n\n                if j + 1 < n && p[j + 1] == \"*\" {\n                    // bỏ qua \"x*\" hoặc dùng nó ăn 1 ký tự\n                    dp[i][j] = dp[i][j + 2] || (first && dp[i + 1][j])\n                } else {\n                    dp[i][j] = first && dp[i + 1][j + 1]\n                }\n            }\n        }\n        return dp[0][0]\n    }\n}\n"}, {"id": 11, "category": "algorithms", "title": "Container With Most Water", "slug": "container-with-most-water", "difficulty": "Medium", "topics": ["Two Pointers", "Array", "Greedy"], "date": "2026-10-13", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Có `n` vạch thẳng đứng, vạch `i` cao `height[i]`. Chọn hai vạch cùng trục hoành tạo thành bình chứa được nhiều nước nhất; trả về lượng nước đó."}, {"title": "Cơ sở lý thuyết", "text": "- Diện tích với hai vạch `l < r` là `min(height[l], height[r]) × (r - l)` — bị giới hạn bởi vạch **thấp hơn**.\n- **Hai con trỏ với lập luận loại bỏ**: bắt đầu với bề rộng lớn nhất. Giả sử `height[l] < height[r]`. Mọi cặp `(l, r')` với `r' < r` đều hẹp hơn và chiều cao vẫn không vượt `height[l]` → không thể tốt hơn cặp hiện tại. Vậy vạch `l` đã cho kết quả tốt nhất của nó → loại `l`.\n- Mỗi bước loại một vạch nên tổng cộng `O(n)`, thay cho `O(n²)` khi thử mọi cặp."}, {"title": "Hướng xử lý", "text": "1. `l = 0`, `r = n - 1`.\n2. Cập nhật đáp án bằng diện tích của cặp hiện tại.\n3. Tiến con trỏ ở vạch thấp hơn vào trong.\n4. Dừng khi hai con trỏ gặp nhau."}, {"title": "Ý tưởng triển khai", "text": "- Khi hai vạch bằng nhau, tiến bên nào cũng đúng (cả hai đều đã đạt tốt nhất của mình); code tiến `r`.\n- Test cục bộ đối chiếu với vét cạn mọi cặp."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `height = [1, 8, 6, 2, 5, 4, 8, 3, 7]`\n**Output:** `49`\n\n```\nl=0 (1), r=8 (7): min 1 × 8 = 8     best=8    1 < 7 → l=1\nl=1 (8), r=8 (7): min 7 × 7 = 49    best=49   8 < 7 sai → r=7\nl=1 (8), r=7 (3): min 3 × 6 = 18    best=49   → r=6\nl=1 (8), r=6 (8): min 8 × 5 = 40    best=49   8 < 8 sai → r=5\nl=1 (8), r=5 (4): min 4 × 4 = 16    best=49   → r=4\nl=1 (8), r=4 (5): min 5 × 3 = 15    best=49   → r=3\nl=1 (8), r=3 (2): min 2 × 2 = 4     best=49   → r=2\nl=1 (8), r=2 (6): min 6 × 1 = 6     best=49   → r=1\nl == r → dừng, trả về 49\n```\n\n**Input:** `height = [1, 1]` → **Output:** `1` (`min(1, 1) × 1`)."}, {"title": "Ghi nhớ", "text": "Khác bài 42 (hứng nước mưa — tổng nước trên mọi cột), bài này chỉ chọn **hai vạch**. Điểm chung: luôn xử lý/loại bên thấp hơn, vì bên thấp là bên quyết định."}], "code": "class Solution {\n    func maxArea(_ height: [Int]) -> Int {\n        var l = 0, r = height.count - 1, best = 0\n        while l < r {\n            best = max(best, min(height[l], height[r]) * (r - l))\n            // bỏ cột thấp hơn, giữ nó cũng không thể tốt hơn\n            if height[l] < height[r] { l += 1 } else { r -= 1 }\n        }\n        return best\n    }\n}\n"}, {"id": 12, "category": "algorithms", "title": "Integer to Roman", "slug": "integer-to-roman", "difficulty": "Medium", "topics": ["Array / String", "Hash Table", "Math", "Greedy"], "date": "2026-10-13", "time": "O(1)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Đổi một số nguyên từ 1 đến 3999 sang số La Mã."}, {"title": "Cơ sở lý thuyết", "text": "- **Tham lam theo mệnh giá**: giống bài đổi tiền với một hệ mệnh giá \"chuẩn tắc\" — luôn lấy mệnh giá lớn nhất còn vừa. Với số La Mã, tham lam cho đúng cách viết chuẩn.\n- Mẹo then chốt: coi sáu dạng trừ (`CM`, `CD`, `XC`, `XL`, `IX`, `IV`) là **mệnh giá riêng**. Khi đó có 13 mệnh giá và không còn phải xử lý đặc biệt cho chữ số 4 hay 9.\n- Số vòng lặp bị chặn bởi hằng số (số La Mã dài nhất trong khoảng này là `MMMDCCCLXXXVIII`, 15 ký tự) nên độ phức tạp là `O(1)`."}, {"title": "Hướng xử lý", "text": "1. Bảng 13 cặp `(giá trị, ký hiệu)` xếp giảm dần.\n2. Với mỗi cặp: chừng nào số còn `≥` giá trị thì nối ký hiệu vào kết quả và trừ đi."}, {"title": "Ý tưởng triển khai", "text": "- Bảng là mảng tuple, duyệt bằng `for (v, r) in table`.\n- Vòng `while n >= v` tự xử lý việc lặp ký hiệu (`MMM`, `CC`…); các mệnh giá trừ như `900` không bao giờ lặp vì sau khi trừ số còn lại nhỏ hơn mệnh giá đó.\n- Test cục bộ: mọi số 1…3999 đổi sang rồi đổi ngược phải ra chính nó, và không có ký hiệu nào lặp quá số lần cho phép."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `num = 1994`\n**Output:** `\"MCMXCIV\"`\n\n```\nn = 1994: 1994 >= 1000 → \"M\"        n = 994\nn = 994:  994 >= 900   → \"MCM\"      n = 94\nn = 94:   bỏ qua 500, 400, 100\n          94 >= 90     → \"MCMXC\"    n = 4\nn = 4:    bỏ qua 50, 40, 10, 9, 5\n          4 >= 4       → \"MCMXCIV\"  n = 0\n```\n\n**Input:** `num = 3749` → **Output:** `\"MMMDCCXLIX\"`\n\n```\n3749 → MMM (còn 749) → D (249) → CC (49) → XL (9) → IX (0)\n```"}, {"title": "Ghi nhớ", "text": "Khi quy tắc có ngoại lệ (dạng trừ), thử **đưa ngoại lệ vào bảng dữ liệu** thay vì viết nhánh `if` — code ngắn hơn và khó sai hơn."}], "code": "class Solution {\n    func intToRoman(_ num: Int) -> String {\n        let table = [(1000, \"M\"), (900, \"CM\"), (500, \"D\"), (400, \"CD\"), (100, \"C\"), (90, \"XC\"),\n                     (50, \"L\"), (40, \"XL\"), (10, \"X\"), (9, \"IX\"), (5, \"V\"), (4, \"IV\"), (1, \"I\")]\n        var n = num, res = \"\"\n        for (v, r) in table {\n            while n >= v {\n                res += r\n                n -= v\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 13, "category": "algorithms", "title": "Roman to Integer", "slug": "roman-to-integer", "difficulty": "Easy", "topics": ["Array / String", "Hash Table", "Math"], "date": "2026-10-13", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Đổi một số La Mã hợp lệ (trong khoảng 1 đến 3999) sang số nguyên."}, {"title": "Cơ sở lý thuyết", "text": "- Số La Mã viết các ký hiệu theo giá trị **giảm dần** từ trái sang phải và cộng lại: `VIII = 5 + 1 + 1 + 1`.\n- **Quy tắc trừ**: một ký hiệu nhỏ đứng **ngay trước** ký hiệu lớn hơn thì bị trừ đi. Chỉ có sáu trường hợp: `IV` (4), `IX` (9), `XL` (40), `XC` (90), `CD` (400), `CM` (900).\n- Vì vậy chỉ cần **nhìn trước một ký tự** là biết ký hiệu hiện tại được cộng hay trừ."}, {"title": "Hướng xử lý", "text": "1. Bảng tra giá trị của 7 ký hiệu.\n2. Duyệt từng ký tự: nếu giá trị của nó **nhỏ hơn** giá trị ký tự kế tiếp thì trừ, ngược lại cộng.\n3. Ký tự cuối cùng luôn được cộng."}, {"title": "Ý tưởng triển khai", "text": "- `val: [Character: Int]` làm bảng tra; `Array(s)` để lấy chỉ số.\n- Điều kiện `i + 1 < a.count && v < val[a[i + 1]]!` — kiểm tra biên trước khi nhìn sang phải.\n- Force-unwrap `val[...]!` vì đề đảm bảo chuỗi chỉ gồm ký hiệu hợp lệ.\n- Test cục bộ: đổi mọi số từ 1 đến 3999 sang La Mã rồi đổi ngược lại."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"MCMXCIV\"`\n**Output:** `1994`\n\n```\nM (1000): sau là C (100)  → 1000 >= 100 → cộng → res = 1000\nC (100):  sau là M (1000) → 100 < 1000  → trừ  → res = 900\nM (1000): sau là X (10)   → cộng               → res = 1900\nX (10):   sau là C (100)  → 10 < 100    → trừ  → res = 1890\nC (100):  sau là I (1)    → cộng               → res = 1990\nI (1):    sau là V (5)    → 1 < 5       → trừ  → res = 1989\nV (5):    ký tự cuối      → cộng               → res = 1994\n```\n\n**Input:** `s = \"LVIII\"` → **Output:** `58`\n\n```\nL (50) + V (5) + I (1) + I (1) + I (1) = 58   (không có cặp trừ nào)\n```"}, {"title": "Ghi nhớ", "text": "Chuỗi có quy tắc phụ thuộc ký tự kề bên → duyệt một lượt và nhìn trước một bước. Bài 12 là chiều ngược lại."}], "code": "class Solution {\n    func romanToInt(_ s: String) -> Int {\n        let val: [Character: Int] = [\"I\": 1, \"V\": 5, \"X\": 10, \"L\": 50, \"C\": 100, \"D\": 500, \"M\": 1000]\n        let a = Array(s)\n        var res = 0\n\n        for i in 0..<a.count {\n            let v = val[a[i]]!\n            // ký hiệu nhỏ đứng trước ký hiệu lớn thì bị trừ\n            if i + 1 < a.count && v < val[a[i + 1]]! {\n                res -= v\n            } else {\n                res += v\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 14, "category": "algorithms", "title": "Longest Common Prefix", "slug": "longest-common-prefix", "difficulty": "Easy", "topics": ["Array / String", "Trie"], "date": "2026-10-13", "time": "O(tổng số ký tự)", "space": "O(độ dài chuỗi đầu)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Tìm tiền tố chung dài nhất của một mảng chuỗi; không có thì trả chuỗi rỗng."}, {"title": "Cơ sở lý thuyết", "text": "- **Tiền tố chung chỉ có thể ngắn dần**: tiền tố chung của cả mảng là tiền tố của chuỗi đầu tiên, và mỗi chuỗi mới chỉ có thể làm nó ngắn lại. Đây là kiểu \"thu hẹp ứng viên dần\".\n- Hai cách quét tương đương: **quét ngang** (so ứng viên với từng chuỗi, cắt bớt khi cần — dùng ở đây) và **quét dọc** (so từng cột ký tự trên mọi chuỗi).\n- Chuỗi rỗng là tiền tố của mọi chuỗi, nên việc cắt chắc chắn dừng."}, {"title": "Hướng xử lý", "text": "1. Lấy chuỗi đầu tiên làm ứng viên `p`.\n2. Với mỗi chuỗi `s`: chừng nào `s` chưa bắt đầu bằng `p` thì bỏ ký tự cuối của `p`.\n3. Trả về `p`."}, {"title": "Ý tưởng triển khai", "text": "- `s.hasPrefix(p)` và `p.removeLast()`.\n- Khi `p` thành rỗng: `hasPrefix(\"\")` trả `true` nên vòng `while` dừng, không gọi `removeLast()` trên chuỗi rỗng (sẽ crash).\n- Mỗi lần `hasPrefix` tốn `O(|p|)`, và `p` chỉ ngắn dần → tổng chi phí vẫn nhỏ."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `strs = [\"flower\", \"flow\", \"flight\"]`\n**Output:** `\"fl\"`\n\n```\np = \"flower\"\ns = \"flower\": bắt đầu bằng \"flower\" ✓\ns = \"flow\":   \"flower\" ✗ → \"flowe\" ✗ → \"flow\" ✓        p = \"flow\"\ns = \"flight\": \"flow\" ✗ → \"flo\" ✗ → \"fl\" ✓              p = \"fl\"\nTrả về \"fl\"\n```\n\n**Input:** `strs = [\"dog\", \"racecar\", \"car\"]`\n**Output:** `\"\"`\n\n```\np = \"dog\"\ns = \"dog\":     ✓\ns = \"racecar\": \"dog\" ✗ → \"do\" ✗ → \"d\" ✗ → \"\" ✓         p = \"\"\ns = \"car\":     \"\" ✓\nTrả về \"\"\n```"}, {"title": "Ghi nhớ", "text": "Bài \"phần chung của nhiều thứ\" → bắt đầu từ một ứng viên rồi thu hẹp. Nếu phải truy vấn tiền tố chung nhiều lần trên cùng tập chuỗi thì dùng Trie."}], "code": "class Solution {\n    func longestCommonPrefix(_ strs: [String]) -> String {\n        var p = strs[0]\n        for s in strs {\n            while !s.hasPrefix(p) {\n                p.removeLast()\n            }\n        }\n        return p\n    }\n}\n"}, {"id": 15, "category": "algorithms", "title": "3Sum", "slug": "3sum", "difficulty": "Medium", "topics": ["Two Pointers", "Array", "Sorting"], "date": "2026-10-13", "time": "O(n²)", "space": "O(n) (mảng đã sắp, không tính kết quả)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Tìm mọi bộ ba **giá trị** khác nhau `[a, b, c]` lấy từ ba vị trí khác nhau của `nums` sao cho `a + b + c = 0`. Kết quả không được chứa bộ ba trùng lặp."}, {"title": "Cơ sở lý thuyết", "text": "- **Quy về bài con đã biết**: cố định một phần tử `a[i]`, phần còn lại là bài \"tìm cặp có tổng `-a[i]` trên mảng đã sắp\" — chính là hai con trỏ của bài 167. Tổng chi phí `O(n) × O(n) = O(n²)`.\n- **Sắp xếp để khử trùng lặp**: sau khi sắp, các giá trị bằng nhau nằm liền nhau, nên chỉ cần **bỏ qua giá trị vừa dùng** ở mỗi vị trí là không sinh ra bộ ba lặp — không cần `Set`.\n- Cận dưới thực tế của bài là `O(n²)`; chưa có thuật toán nhanh hơn đáng kể."}, {"title": "Hướng xử lý", "text": "1. Sắp tăng dần.\n2. Với mỗi `i`: nếu `a[i]` bằng `a[i - 1]` thì bỏ qua (đã xét giá trị này làm phần tử đầu).\n3. Hai con trỏ `l = i + 1`, `r = n - 1`: tổng âm → `l += 1`; dương → `r -= 1`; bằng 0 → ghi bộ ba, tiến cả hai con trỏ, rồi cho `l` nhảy qua các giá trị trùng."}, {"title": "Ý tưởng triển khai", "text": "- Chỉ cần khử trùng cho `l`: khi `l` đã sang giá trị mới thì `r` cũ cho tổng khác 0 và tự bị đẩy đi.\n- `while l < r && a[l] == a[l - 1]` — so với phần tử **vừa dùng** (`l - 1`).\n- Có thể dừng sớm khi `a[i] > 0` (ba số dương không thể có tổng 0); bỏ qua cho gọn.\n- Test cục bộ đối chiếu với vét cạn ba vòng lặp + `Set`, và kiểm tra không có bộ ba trùng."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [-1, 0, 1, 2, -1, -4]`\n**Output:** `[[-1, -1, 2], [-1, 0, 1]]`\n\n```\nSắp xếp: a = [-4, -1, -1, 0, 1, 2]\n\ni=0 (-4): l=1, r=5: -4 + -1 + 2 = -3 < 0 → l=2\n                    -4 + -1 + 2 = -3 < 0 → l=3\n                    -4 +  0 + 2 = -2 < 0 → l=4\n                    -4 +  1 + 2 = -1 < 0 → l=5 → dừng\n\ni=1 (-1): l=2, r=5: -1 + -1 + 2 = 0 → ghi [-1, -1, 2], l=3, r=4\n                    (a[3]=0 khác a[2]=-1 → không nhảy)\n                    -1 + 0 + 1 = 0  → ghi [-1, 0, 1],  l=4, r=3 → dừng\n\ni=2 (-1): bằng a[1] → bỏ qua (nếu không sẽ ghi lại [-1, 0, 1])\n\ni=3 (0):  l=4, r=5: 0 + 1 + 2 = 3 > 0 → r=4 → dừng\n```\n\n**Input:** `nums = [0, 0, 0, 0]`\n**Output:** `[[0, 0, 0]]`\n\n```\ni=0: l=1, r=3: tổng 0 → ghi [0, 0, 0], l=2, r=2 → dừng\ni=1: bằng a[0] → bỏ qua\n```"}, {"title": "Ghi nhớ", "text": "`k`-sum: sắp xếp, cố định `k - 2` phần tử bằng vòng lặp, hai phần tử cuối dùng hai con trỏ. Khử trùng lặp bằng cách bỏ qua giá trị kề giống nhau ở **mỗi tầng**."}], "code": "class Solution {\n    func threeSum(_ nums: [Int]) -> [[Int]] {\n        let a = nums.sorted()\n        let n = a.count\n        var res = [[Int]]()\n\n        for i in 0..<n - 2 {\n            if i > 0 && a[i] == a[i - 1] { continue }\n            var l = i + 1, r = n - 1\n            while l < r {\n                let sum = a[i] + a[l] + a[r]\n                if sum < 0 {\n                    l += 1\n                } else if sum > 0 {\n                    r -= 1\n                } else {\n                    res.append([a[i], a[l], a[r]])\n                    l += 1\n                    r -= 1\n                    // nhảy qua các số trùng để không ra bộ ba lặp\n                    while l < r && a[l] == a[l - 1] { l += 1 }\n                }\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 26, "category": "algorithms", "title": "Remove Duplicates from Sorted Array", "slug": "remove-duplicates-from-sorted-array", "difficulty": "Easy", "topics": ["Array / String", "Two Pointers"], "date": "2026-10-11", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng `nums` đã sắp không giảm. Xóa trùng tại chỗ để mỗi giá trị chỉ còn một lần, giữ nguyên thứ tự. Trả về số giá trị khác nhau `k`; `k` ô đầu chứa chúng."}, {"title": "Cơ sở lý thuyết", "text": "- Trong mảng **đã sắp xếp**, các phần tử bằng nhau nằm **liền nhau**. Vậy \"đã gặp giá trị này chưa\" chỉ cần so với phần tử vừa giữ lại gần nhất — không cần `Set`.\n- **Con trỏ đọc/ghi** như bài 27, với điều kiện giữ là \"khác phần tử cuối của phần đã giữ\"."}, {"title": "Hướng xử lý", "text": "1. Phần tử đầu tiên luôn được giữ → `k = 1`.\n2. Duyệt `i` từ `1`: nếu `nums[i] != nums[k - 1]` thì đó là giá trị mới → ghi vào `nums[k]`, tăng `k`.\n3. Trả về `k`."}, {"title": "Ý tưởng triển khai", "text": "- So với `nums[k - 1]` (phần tử cuối đã giữ) chứ không phải `nums[i - 1]`; hai cách đều đúng ở bài này, nhưng cách đầu mở rộng được sang bài 80.\n- Đề đảm bảo mảng có ít nhất 1 phần tử nên `k = 1` là an toàn."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4]`\n**Output:** `5`, `nums = [0, 1, 2, 3, 4, _, _, _, _, _]`\n\n```\nk=1 (đã giữ [0])\ni=1 (0): bằng nums[0]=0 → bỏ\ni=2 (1): khác nums[0]=0 → nums[1] = 1   k=2\ni=3 (1): bằng nums[1]=1 → bỏ\ni=4 (1): bằng nums[1]=1 → bỏ\ni=5 (2): khác nums[1]=1 → nums[2] = 2   k=3\ni=6 (2): bằng nums[2]=2 → bỏ\ni=7 (3): khác nums[2]=2 → nums[3] = 3   k=4\ni=8 (3): bằng nums[3]=3 → bỏ\ni=9 (4): khác nums[3]=3 → nums[4] = 4   k=5\n```\n\n**Input:** `nums = [1, 1, 2]` → **Output:** `2`, `nums = [1, 2, _]`"}, {"title": "Ghi nhớ", "text": "\"Đã sắp xếp\" là gợi ý lớn: trùng lặp nằm liền nhau, nên chỉ cần nhìn lại một bước."}], "code": "class Solution {\n    func removeDuplicates(_ nums: inout [Int]) -> Int {\n        var k = 1\n        for i in 1..<nums.count where nums[i] != nums[k - 1] {\n            nums[k] = nums[i]\n            k += 1\n        }\n        return k\n    }\n}\n"}, {"id": 27, "category": "algorithms", "title": "Remove Element", "slug": "remove-element", "difficulty": "Easy", "topics": ["Array / String", "Two Pointers"], "date": "2026-10-11", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Xóa tại chỗ mọi phần tử bằng `val` khỏi `nums`. Trả về `k` — số phần tử còn lại; `k` ô đầu của `nums` phải chứa các phần tử đó (thứ tự tùy ý)."}, {"title": "Cơ sở lý thuyết", "text": "- **Hai con trỏ đọc/ghi (read/write)**: con trỏ đọc duyệt mọi phần tử, con trỏ ghi `k` chỉ vị trí kế tiếp của phần \"giữ lại\". Vì `k` không bao giờ vượt con trỏ đọc nên ghi đè là an toàn.\n- Đây là thao tác **lọc tại chỗ** (in-place filter), nền tảng của các bài 26, 80, 283."}, {"title": "Hướng xử lý", "text": "1. Duyệt từng phần tử `x`.\n2. Nếu `x != val`: ghi vào `nums[k]`, tăng `k`.\n3. Nếu `x == val`: bỏ qua.\n4. Trả về `k`."}, {"title": "Ý tưởng triển khai", "text": "- `for x in nums where x != val` — vòng `for` của Swift duyệt trên **bản sao** của mảng (value semantics), nên sửa `nums` bên trong vòng lặp không ảnh hưởng tới việc duyệt.\n- Phần sau chỉ số `k` chứa gì cũng được, đề không kiểm tra."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [3, 2, 2, 3]`, `val = 3`\n**Output:** `2`, `nums = [2, 2, _, _]`\n\n```\nx=3: bằng val → bỏ qua                          k=0\nx=2: khác val → nums[0] = 2 → [2, 2, 2, 3]      k=1\nx=2: khác val → nums[1] = 2 → [2, 2, 2, 3]      k=2\nx=3: bằng val → bỏ qua                          k=2\nTrả về 2; hai ô đầu là [2, 2]\n```\n\n**Input:** `nums = [0, 1, 2, 2, 3, 0, 4, 2]`, `val = 2` → **Output:** `5`\n\n```\nGiữ lần lượt 0, 1, 3, 0, 4 → nums = [0, 1, 3, 0, 4, _, _, _], k = 5\n```"}, {"title": "Ghi nhớ", "text": "\"Xóa tại chỗ, trả về độ dài mới\" → con trỏ ghi `k`. Mẫu ba dòng này nên thuộc lòng."}], "code": "class Solution {\n    func removeElement(_ nums: inout [Int], _ val: Int) -> Int {\n        var k = 0\n        for x in nums where x != val {\n            nums[k] = x\n            k += 1\n        }\n        return k\n    }\n}\n"}, {"id": 28, "category": "algorithms", "title": "Find the Index of the First Occurrence in a String", "slug": "find-the-index-of-the-first-occurrence-in-a-string", "difficulty": "Easy", "topics": ["Array / String", "Two Pointers", "String Matching"], "date": "2026-10-13", "time": "O(n · m)", "space": "O(n + m)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Trả về vị trí đầu tiên mà `needle` xuất hiện trong `haystack`, hoặc `-1` nếu không có."}, {"title": "Cơ sở lý thuyết", "text": "- **So khớp chuỗi ngây thơ**: thử từng vị trí bắt đầu `i`, so `needle` với đoạn `haystack[i ..< i + m]`. Tệ nhất `O(n · m)`.\n- Các thuật toán tuyến tính: **KMP** (bảng tiền tố để không lùi con trỏ), **Rabin–Karp** (băm cuộn), **Z-algorithm**. Với `n, m ≤ 10⁴` cách ngây thơ đã đủ.\n- Trong Swift, so sánh `Character` chậm vì phải xử lý Unicode; so trên mảng byte `utf8` nhanh hơn nhiều và đúng với dữ liệu ASCII của đề."}, {"title": "Hướng xử lý", "text": "1. Nếu `needle` dài hơn `haystack` → `-1`.\n2. Với mỗi `i` từ `0` đến `n - m`: nếu đoạn dài `m` bắt đầu tại `i` bằng `needle` thì trả `i`.\n3. Không tìm thấy → `-1`."}, {"title": "Ý tưởng triển khai", "text": "- `Array(haystack.utf8)` và `Array(needle.utf8)` để có chỉ số nguyên.\n- `h[i..<i + n.count].elementsEqual(n)` so từng phần tử và **dừng ngay** khi gặp chỗ khác nhau.\n- Phải kiểm tra độ dài trước: nếu không, khoảng `0...(h.count - n.count)` có cận trên âm và Swift sẽ crash.\n- Test cục bộ đối chiếu với `String.range(of:)` trên 3000 cặp chuỗi ngẫu nhiên."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `haystack = \"sadbutsad\"`, `needle = \"sad\"`\n**Output:** `0`\n\n```\nn = 9, m = 3 → thử i từ 0 đến 6\ni=0: \"sad\" == \"sad\" ✓ → trả về 0\n```\n\n**Input:** `haystack = \"leetcode\"`, `needle = \"leeto\"`\n**Output:** `-1`\n\n```\nn = 8, m = 5 → thử i từ 0 đến 3\ni=0: \"leetc\" vs \"leeto\" → khác ở ký tự thứ 5 ✗\ni=1: \"eetco\" ✗ (khác ngay ký tự đầu)\ni=2: \"etcod\" ✗\ni=3: \"tcode\" ✗\nHết → -1\n```\n\n**Input:** `haystack = \"a\"`, `needle = \"ab\"` → **Output:** `-1` (`needle` dài hơn, trả về ngay)."}, {"title": "Ghi nhớ", "text": "Bài tìm chuỗi con: cách ngây thơ trước, nhưng biết tên và ý tưởng của KMP để trả lời câu hỏi \"làm sao nhanh hơn\". Ở Swift, đổi sang `utf8` trước khi lặp nhiều trên chuỗi."}], "code": "class Solution {\n    func strStr(_ haystack: String, _ needle: String) -> Int {\n        let h = Array(haystack.utf8), n = Array(needle.utf8)\n        if n.count > h.count { return -1 }\n\n        for i in 0...(h.count - n.count) {\n            if h[i..<i + n.count].elementsEqual(n) {\n                return i\n            }\n        }\n        return -1\n    }\n}\n"}, {"id": 30, "category": "algorithms", "title": "Substring with Concatenation of All Words", "slug": "substring-with-concatenation-of-all-words", "difficulty": "Hard", "topics": ["Sliding Window", "Hash Table", "String"], "date": "2026-10-13", "time": "O(n · L) (n = độ dài s, L = độ dài một từ)", "space": "O(số từ · L)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho chuỗi `s` và mảng `words` gồm các từ **cùng độ dài** `L`. Tìm mọi vị trí bắt đầu trong `s` của một chuỗi con là phép ghép của **tất cả** các từ trong `words`, mỗi từ đúng một lần, theo thứ tự bất kỳ."}, {"title": "Cơ sở lý thuyết", "text": "- Vì mọi từ dài bằng nhau, một chuỗi con hợp lệ bắt đầu tại `i` được cắt thành các **ô** dài `L` ở các vị trí `i, i + L, i + 2L, …`. Mọi vị trí bắt đầu có cùng số dư `i mod L` dùng chung một lưới ô.\n- **Chia theo độ lệch (offset)**: với mỗi `off` trong `0 ..< L`, coi `s` là một dãy các ô. Bài toán thành: tìm mọi cửa sổ gồm `k` ô liên tiếp có **đa tập** từ trùng với `words` — đây là bài cửa sổ trượt với bảng đếm (giống tìm anagram, bài 438), chỉ khác đơn vị là từ thay cho ký tự.\n- Nhờ vậy tổng số ô được xét trên mọi độ lệch là `≈ n`, thay vì kiểm tra lại từ đầu cho từng vị trí bắt đầu (`O(n · k)` ô)."}, {"title": "Hướng xử lý", "text": "1. Đếm số lần xuất hiện cần có của mỗi từ: `need`.\n2. Với mỗi `off`: cửa sổ `[l, r)` trên lưới ô, bảng đếm `have`, và `cnt` = số ô trong cửa sổ.\n3. Đọc ô kế tiếp `w`:\n   - `w` không có trong `need` → không cửa sổ nào chứa được ô này: xóa sạch, đặt `l` ngay sau nó.\n   - Ngược lại thêm `w` vào cửa sổ. Nếu `w` bị **thừa**, co biên trái từng ô cho tới khi hết thừa.\n   - Nếu `cnt == k` → cửa sổ gồm đúng `k` ô hợp lệ, không ô nào thừa → ghi `l`."}, {"title": "Ý tưởng triển khai", "text": "- `need[w] == nil` để nhận biết từ lạ; `have[w, default: 0] += 1` để đếm.\n- Không cần co cửa sổ riêng sau khi ghi kết quả: ở vòng sau, ô mới vào sẽ làm một từ bị thừa (hoặc là từ lạ), và vòng `while` tự đẩy `l` lên.\n- Bất biến: mọi từ trong cửa sổ đều có `have ≤ need`, nên `cnt == k` tương đương `have == need`.\n- `String(a[r..<r + L])` tạo khóa cho bảng băm.\n- Test cục bộ đối chiếu với vét cạn (cắt, sắp xếp các ô rồi so với `words` đã sắp) trên 4000 bộ ngẫu nhiên."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"barfoothefoobarman\"`, `words = [\"foo\", \"bar\"]`\n**Output:** `[0, 9]`\n\n`L = 3`, `k = 2`, `need = {foo: 1, bar: 1}`.\n\n```\noff = 0 → các ô: bar | foo | the | foo | bar | man\n   ô \"bar\" (r=0→3):   have = {bar: 1}, cnt=1\n   ô \"foo\" (r=3→6):   have = {bar: 1, foo: 1}, cnt=2 == k → ghi l = 0\n   ô \"the\" (r=6→9):   từ lạ → xóa sạch, l = 9\n   ô \"foo\" (r=9→12):  have = {foo: 1}, cnt=1\n   ô \"bar\" (r=12→15): have = {foo: 1, bar: 1}, cnt=2 == k → ghi l = 9\n   ô \"man\" (r=15→18): từ lạ → xóa sạch, l = 18\n\noff = 1 → các ô: arf | oot | hef | oob | arm → toàn từ lạ\noff = 2 → các ô: rfo | oth | efo | oba | rma → toàn từ lạ\n\nKết quả: [0, 9]\n```\n\n**Input:** `s = \"barfoofoobarthefoobarman\"`, `words = [\"bar\", \"foo\", \"the\"]`\n**Output:** `[6, 9, 12]`\n\n```\noff = 0 → các ô: bar | foo | foo | bar | the | foo | bar | man   (k = 3)\n   bar, foo:   cnt=2\n   foo:        thừa foo → bỏ \"bar\" (l=3), bỏ \"foo\" (l=6) → have = {foo: 1}, cnt=1\n   bar:        cnt=2\n   the:        cnt=3 → ghi l = 6\n   foo:        thừa foo → bỏ \"foo\" (l=9) → cnt=3 → ghi l = 9\n   bar:        thừa bar → bỏ \"bar\" (l=12) → cnt=3 → ghi l = 12\n   man:        từ lạ → xóa sạch\n```"}, {"title": "Ghi nhớ", "text": "Khi các \"đơn vị\" có độ dài cố định `L`, chia bài toán theo `L` độ lệch rồi trượt cửa sổ theo từng đơn vị. Cửa sổ có bảng đếm: thêm bên phải, co bên trái khi thừa, kiểm tra kích thước — cùng một khuôn với bài 76 và 438."}], "code": "class Solution {\n    func findSubstring(_ s: String, _ words: [String]) -> [Int] {\n        let a = Array(s)\n        let L = words[0].count, k = words.count\n        var need = [String: Int]()\n        for w in words { need[w, default: 0] += 1 }\n        var res = [Int]()\n\n        // mỗi độ lệch là một dãy các \"ô\" dài L, trượt cửa sổ trên các ô đó\n        for off in 0..<L {\n            var l = off, r = off, cnt = 0\n            var have = [String: Int]()\n\n            while r + L <= a.count {\n                let w = String(a[r..<r + L])\n                r += L\n\n                if need[w] == nil {\n                    // từ lạ: bỏ hết, bắt đầu lại sau nó\n                    have = [:]\n                    cnt = 0\n                    l = r\n                    continue\n                }\n\n                have[w, default: 0] += 1\n                cnt += 1\n                // thừa từ w thì co bên trái tới khi hết thừa\n                while have[w]! > need[w]! {\n                    let lw = String(a[l..<l + L])\n                    have[lw]! -= 1\n                    cnt -= 1\n                    l += L\n                }\n                if cnt == k { res.append(l) }\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 36, "category": "algorithms", "title": "Valid Sudoku", "slug": "valid-sudoku", "difficulty": "Medium", "topics": ["Matrix", "Hash Table"], "date": "2026-10-18", "time": "O(81) = O(1)", "space": "O(81) = O(1)", "status": "Chưa nộp (LeetCode trong Chrome chưa đăng nhập)", "sections": [{"title": "Đề bài", "text": "Kiểm tra một bảng Sudoku 9×9 (đang điền dở, ô trống là `.`) có hợp lệ không: mỗi hàng, mỗi cột và mỗi ô vuông 3×3 không được có chữ số lặp lại. Không cần kiểm tra bảng có giải được hay không."}, {"title": "Cơ sở lý thuyết", "text": "- **Kiểm tra trùng lặp bằng tập hợp**: `Set.insert` trả về `inserted = false` khi phần tử đã có — vừa thêm vừa phát hiện trùng trong một bước.\n- **Đánh số ô 3×3**: ô `(i, j)` thuộc khối `(i / 3) * 3 + j / 3` (từ 0 đến 8, đi theo hàng). Phép chia nguyên gom 3 hàng và 3 cột liền nhau vào cùng một khối.\n- Mỗi ô tham gia đúng ba ràng buộc (hàng, cột, khối), nên chỉ cần duyệt bảng **một lần** và cập nhật ba tập."}, {"title": "Hướng xử lý", "text": "1. 9 tập cho hàng, 9 tập cho cột, 9 tập cho khối.\n2. Duyệt từng ô có chữ số; thêm vào ba tập tương ứng.\n3. Lần thêm nào thất bại (đã có) → `false`. Duyệt hết → `true`."}, {"title": "Ý tưởng triển khai", "text": "- `[Set<Character>](repeating: [], count: 9)` cho mỗi loại.\n- Gộp ba lần `insert` trong một biểu thức `||`: Swift đánh giá ngắn mạch, nhưng khi đã trả `false` thì không cần quan tâm các tập còn lại.\n- Kích thước cố định 9×9 nên mọi độ phức tạp đều là hằng số."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** bảng của đề với ô `(0, 0)` đổi thành `8`:\n\n```\n8 3 . | . 7 . | . . .\n6 . . | 1 9 5 | . . .\n. 9 8 | . . . | . 6 .\n------+-------+------\n8 . . | . 6 . | . . 3\n...\n```\n\n**Output:** `false`\n\n```\n(0,0) '8': rows[0]={8}, cols[0]={8}, boxes[0]={8}\n(0,1) '3': rows[0]={8,3}, cols[1]={3}, boxes[0]={8,3}\n(0,4) '7': rows[0], cols[4], boxes[1] đều thêm được\n(1,0) '6', (1,3) '1', (1,4) '9', (1,5) '5': thêm được\n(2,1) '9': rows[2]={9}, cols[1]={3,9}, boxes[0]={8,3,6,9}\n(2,2) '8': rows[2] thêm được, cols[2] thêm được,\n           boxes[(2/3)*3 + 2/3 = 0] đã có 8 → insert thất bại → false\n```\n\nLỗi bị phát hiện ở ô 3×3 đầu tiên trước cả khi tới hàng 3 (nơi cột 0 cũng có hai số 8).\n\n**Input:** bảng trống chỉ có hai số `5` ở `(0, 0)` và `(4, 4)` → **Output:** `true` (khác hàng, khác cột, khác khối)."}, {"title": "Ghi nhớ", "text": "Kiểm tra ràng buộc \"không trùng\" trên nhiều nhóm chồng nhau → mỗi nhóm một tập, duyệt một lần. Công thức chỉ số khối `(i / 3) * 3 + j / 3` dùng lại trong bài giải Sudoku (37)."}], "code": "class Solution {\n    func isValidSudoku(_ board: [[Character]]) -> Bool {\n        var rows = [Set<Character>](repeating: [], count: 9)\n        var cols = [Set<Character>](repeating: [], count: 9)\n        var boxes = [Set<Character>](repeating: [], count: 9)\n\n        for i in 0..<9 {\n            for j in 0..<9 {\n                let c = board[i][j]\n                if c == \".\" { continue }\n                let b = (i / 3) * 3 + j / 3\n                // insert trả về inserted = false nếu đã có\n                if !rows[i].insert(c).inserted || !cols[j].insert(c).inserted || !boxes[b].insert(c).inserted {\n                    return false\n                }\n            }\n        }\n        return true\n    }\n}\n"}, {"id": 42, "category": "algorithms", "title": "Trapping Rain Water", "slug": "trapping-rain-water", "difficulty": "Hard", "topics": ["Array / String", "Two Pointers", "Dynamic Programming", "Stack"], "date": "2026-10-13", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "`height[i]` là chiều cao cột thứ `i` (mỗi cột rộng 1). Tính lượng nước đọng lại giữa các cột sau cơn mưa."}, {"title": "Cơ sở lý thuyết", "text": "- **Nước trên một cột** chỉ phụ thuộc hai con số: cột cao nhất bên trái và cột cao nhất bên phải. Mực nước tại `i` là `min(maxTrái, maxPhải)`, lượng nước là mực nước trừ `height[i]`.\n- Cách trực tiếp: tính sẵn hai mảng `maxTrái`, `maxPhải` (`O(n)` bộ nhớ) — cùng họ \"trái × phải\" với bài 238.\n- **Hai con trỏ** nén bộ nhớ về `O(1)` nhờ nhận xét: nếu `height[l] < height[r]` thì bên phải của `l` chắc chắn có cột cao ít nhất bằng `height[r]`, tức cao hơn `lmax` hiện tại hoặc ít nhất không thấp hơn `height[l]`. Do đó mực nước tại `l` do **`lmax` quyết định**, không cần biết chính xác `maxPhải`."}, {"title": "Hướng xử lý", "text": "1. Hai con trỏ `l`, `r` ở hai đầu; `lmax`, `rmax` là cột cao nhất đã gặp ở mỗi phía.\n2. Mỗi bước xử lý bên có cột **thấp hơn**: cập nhật max của phía đó, cộng `max - height` vào kết quả, rồi tiến con trỏ vào trong.\n3. Dừng khi hai con trỏ gặp nhau."}, {"title": "Ý tưởng triển khai", "text": "- Cập nhật `lmax` **trước** khi cộng: nếu cột hiện tại là cột cao nhất thì `lmax - height[l] = 0`, không bao giờ ra số âm.\n- Khi hai cột bằng nhau, xử lý bên nào cũng đúng; code đi nhánh `else` (bên phải).\n- Test cục bộ đối chiếu với công thức `min(maxTrái, maxPhải) - height[i]` tính thẳng cho từng cột."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `height = [4, 2, 0, 3, 2, 5]`\n**Output:** `9`\n\n```\nl=0 (4), r=5 (5): 4 < 5 → lmax = 4, nước += 4 - 4 = 0   res = 0   l=1\nl=1 (2), r=5 (5): 2 < 5 → lmax = 4, nước += 4 - 2 = 2   res = 2   l=2\nl=2 (0), r=5 (5): 0 < 5 → lmax = 4, nước += 4 - 0 = 4   res = 6   l=3\nl=3 (3), r=5 (5): 3 < 5 → lmax = 4, nước += 4 - 3 = 1   res = 7   l=4\nl=4 (2), r=5 (5): 2 < 5 → lmax = 4, nước += 4 - 2 = 2   res = 9   l=5\nl == r → dừng, trả về 9\n```\n\n**Input:** `height = [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]`\n**Output:** `6`\n\n```\nl=0 (0), r=11 (1): 0 < 1  → lmax=0, +0          res=0   l=1\nl=1 (1), r=11 (1): 1 < 1 sai → rmax=1, +0       res=0   r=10\nl=1 (1), r=10 (2): 1 < 2  → lmax=1, +0          res=0   l=2\nl=2 (0), r=10 (2): 0 < 2  → lmax=1, +1          res=1   l=3\nl=3 (2), r=10 (2): 2 < 2 sai → rmax=2, +0       res=1   r=9\nl=3 (2), r=9  (1): sai    → rmax=2, +1          res=2   r=8\nl=3 (2), r=8  (2): sai    → rmax=2, +0          res=2   r=7\nl=3 (2), r=7  (3): 2 < 3  → lmax=2, +0          res=2   l=4\nl=4 (1), r=7  (3): 1 < 3  → lmax=2, +1          res=3   l=5\nl=5 (0), r=7  (3): 0 < 3  → lmax=2, +2          res=5   l=6\nl=6 (1), r=7  (3): 1 < 3  → lmax=2, +1          res=6   l=7\nl == r → dừng, trả về 6\n```"}, {"title": "Ghi nhớ", "text": "\"Giá trị tại `i` = hàm của max bên trái và max bên phải\" → hoặc hai mảng tiền tố/hậu tố, hoặc hai con trỏ luôn xử lý bên thấp hơn. Cách thứ ba dùng ngăn xếp đơn điệu (tính nước theo từng lớp ngang) đáng biết cho các bài biến thể."}], "code": "class Solution {\n    func trap(_ height: [Int]) -> Int {\n        var l = 0, r = height.count - 1\n        var lmax = 0, rmax = 0, res = 0\n\n        while l < r {\n            // bên thấp hơn quyết định mực nước\n            if height[l] < height[r] {\n                lmax = max(lmax, height[l])\n                res += lmax - height[l]\n                l += 1\n            } else {\n                rmax = max(rmax, height[r])\n                res += rmax - height[r]\n                r -= 1\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 45, "category": "algorithms", "title": "Jump Game II", "slug": "jump-game-ii", "difficulty": "Medium", "topics": ["Array / String", "Greedy", "BFS"], "date": "2026-10-11", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Như bài 55 nhưng đề đảm bảo luôn tới được ô cuối; tìm **số lần nhảy ít nhất**."}, {"title": "Cơ sở lý thuyết", "text": "- **BFS ngầm theo tầng**: tầng `t` là tập các ô tới được với đúng `t` lần nhảy. Vì các ô tới được tạo thành đoạn liền, mỗi tầng cũng là một **đoạn liền** — không cần hàng đợi, chỉ cần biên phải của tầng.\n- Tham lam: trong tầng hiện tại, tính điểm xa nhất `far` mà một cú nhảy nữa vươn tới. Khi đi hết tầng, bắt buộc phải nhảy thêm một lần, và tầng mới kéo dài tới `far`."}, {"title": "Hướng xử lý", "text": "1. `end` = biên phải của tầng hiện tại, `far` = tầm với xa nhất tính từ các ô đã duyệt, `jumps = 0`.\n2. Duyệt `i` từ `0` đến `n - 2`: cập nhật `far`.\n3. Khi `i == end` (hết tầng): `jumps += 1`, `end = far`.\n4. Trả về `jumps`."}, {"title": "Ý tưởng triển khai", "text": "- Chỉ duyệt tới `n - 2`: nếu duyệt cả ô cuối và nó trùng `end` thì sẽ đếm thừa một cú nhảy.\n- Mảng 1 phần tử: khoảng `0..<0` rỗng → `0` lần nhảy."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [2, 3, 1, 1, 4]`\n**Output:** `2` (ô 0 → ô 1 → ô 4)\n\n```\nBan đầu: jumps=0, end=0, far=0\ni=0: far = max(0, 0+2) = 2 · i == end → jumps=1, end=2    (tầng 1 = ô 1..2)\ni=1: far = max(2, 1+3) = 4\ni=2: far = max(4, 2+1) = 4 · i == end → jumps=2, end=4    (tầng 2 = ô 3..4)\ni=3: far = 4 · 3 ≠ end\nHết vòng lặp (i chỉ tới n-2 = 3) → 2\n```\n\n**Input:** `nums = [1, 1, 1, 1]` → **Output:** `3`\n\n```\ni=0: far=1, i == end(0) → jumps=1, end=1\ni=1: far=2, i == end(1) → jumps=2, end=2\ni=2: far=3, i == end(2) → jumps=3, end=3\n```"}, {"title": "Ghi nhớ", "text": "\"Số bước ít nhất\" trên mảng với bước nhảy trong một khoảng → BFS theo tầng, mỗi tầng là một đoạn `[bắt đầu, end]`. Ba biến `jumps`, `end`, `far` là đủ."}], "code": "class Solution {\n    func jump(_ nums: [Int]) -> Int {\n        var jumps = 0, end = 0, far = 0\n        for i in 0..<nums.count - 1 {\n            far = max(far, i + nums[i])\n            if i == end {\n                jumps += 1\n                end = far\n            }\n        }\n        return jumps\n    }\n}\n"}, {"id": 48, "category": "algorithms", "title": "Rotate Image", "slug": "rotate-image", "difficulty": "Medium", "topics": ["Matrix", "Math"], "date": "2026-10-18", "time": "O(n²)", "space": "O(1)", "status": "Chưa nộp (LeetCode trong Chrome chưa đăng nhập)", "sections": [{"title": "Đề bài", "text": "Xoay ma trận vuông `n × n` 90 độ theo chiều kim đồng hồ, **tại chỗ** (không dùng ma trận thứ hai)."}, {"title": "Cơ sở lý thuyết", "text": "- Xoay 90 độ theo chiều kim đồng hồ đưa phần tử `(i, j)` tới `(j, n - 1 - i)`.\n- **Phân rã thành hai phép đơn giản**:\n   - **Chuyển vị** (đối xứng qua đường chéo chính): `(i, j) → (j, i)`.\n   - **Đảo mỗi hàng** (đối xứng qua trục dọc): `(j, i) → (j, n - 1 - i)`.\n   Ghép lại đúng bằng phép xoay. Cả hai đều làm được tại chỗ bằng cách hoán đổi từng cặp.\n- Các biến thể: xoay ngược chiều kim đồng hồ = chuyển vị rồi đảo từng **cột** (hoặc đảo hàng trước rồi chuyển vị); xoay 180 độ = đảo hàng rồi đảo cột."}, {"title": "Hướng xử lý", "text": "1. Chuyển vị: với mọi `i < j`, hoán đổi `matrix[i][j]` và `matrix[j][i]`.\n2. Đảo từng hàng."}, {"title": "Ý tưởng triển khai", "text": "- Vòng trong `for j in i + 1..<n` — chỉ đụng nửa trên đường chéo; nếu duyệt cả ma trận, mỗi cặp bị hoán đổi hai lần và trở lại như cũ.\n- `matrix[i].reverse()` đảo tại chỗ một hàng.\n- Test cục bộ kiểm tra đúng công thức `(i, j) → (j, n - 1 - i)` cho mọi `n` từ 1 đến 7."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `matrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]`\n**Output:** `[[7, 4, 1], [8, 5, 2], [9, 6, 3]]`\n\n```\nBan đầu        Chuyển vị        Đảo từng hàng\n1 2 3          1 4 7            7 4 1\n4 5 6    →     2 5 8     →      8 5 2\n7 8 9          3 6 9            9 6 3\n\nChuyển vị hoán đổi các cặp: (0,1)↔(1,0): 2↔4 · (0,2)↔(2,0): 3↔7 · (1,2)↔(2,1): 6↔8\nKiểm tra: số 2 ở (0,1) → về (1, 3-1-0) = (1,2) ✓\n```\n\n**Input:** `matrix = [[1]]` → **Output:** `[[1]]` (không có cặp nào để hoán đổi)."}, {"title": "Ghi nhớ", "text": "Phép biến đổi hình học khó làm tại chỗ → tách thành tích của các phép đối xứng đơn giản (chuyển vị, lật ngang, lật dọc), mỗi phép đều là hoán đổi từng cặp."}], "code": "class Solution {\n    func rotate(_ matrix: inout [[Int]]) {\n        let n = matrix.count\n        // chuyển vị rồi đảo từng hàng = xoay 90 độ theo chiều kim đồng hồ\n        for i in 0..<n {\n            for j in i + 1..<n {\n                let t = matrix[i][j]\n                matrix[i][j] = matrix[j][i]\n                matrix[j][i] = t\n            }\n        }\n        for i in 0..<n {\n            matrix[i].reverse()\n        }\n    }\n}\n"}, {"id": 49, "category": "algorithms", "title": "Group Anagrams", "slug": "gro
