 mảng + bảng băm vị trí, xóa bằng swap với phần tử cuối. Mẫu này xuất hiện lại ở LRU/LFU cache và các bài lấy mẫu ngẫu nhiên."}], "code": "class RandomizedSet {\n    var arr = [Int]()\n    var idx = [Int: Int]()   // giá trị -> vị trí trong arr\n\n    init() {\n    }\n\n    func insert(_ val: Int) -> Bool {\n        if idx[val] != nil { return false }\n        idx[val] = arr.count\n        arr.append(val)\n        return true\n    }\n\n    func remove(_ val: Int) -> Bool {\n        guard let i = idx[val] else { return false }\n        // đưa phần tử cuối vào chỗ trống rồi cắt đuôi\n        let last = arr[arr.count - 1]\n        arr[i] = last\n        idx[last] = i\n        arr.removeLast()\n        idx[val] = nil\n        return true\n    }\n\n    func getRandom() -> Int {\n        return arr.randomElement()!\n    }\n}\n"}, {"id": 383, "category": "algorithms", "title": "Ransom Note", "slug": "ransom-note", "difficulty": "Easy", "topics": ["Hashmap", "String", "Counting"], "date": "2026-10-18", "time": "O(|r| + |m|)", "space": "O(số loại ký tự)", "status": "Chưa nộp (LeetCode trong Chrome chưa đăng nhập)", "sections": [{"title": "Đề bài", "text": "Kiểm tra có thể ghép chuỗi `ransomNote` từ các chữ cái của `magazine` hay không, mỗi chữ cái trong `magazine` chỉ dùng được một lần."}, {"title": "Cơ sở lý thuyết", "text": "- **Đếm tần suất (counting)**: so sánh hai đa tập ký tự. `ransomNote` ghép được khi và chỉ khi với mọi ký tự, số lần cần ≤ số lần có.\n- Bảng băm ký tự → số lượng; với bảng chữ cái nhỏ cố định có thể dùng mảng 26 ô."}, {"title": "Hướng xử lý", "text": "1. Đếm số lần mỗi ký tự xuất hiện trong `magazine`.\n2. Duyệt `ransomNote`, trừ dần; nếu số nào xuống âm thì thiếu → `false`.\n3. Duyệt hết → `true`."}, {"title": "Ý tưởng triển khai", "text": "- `cnt[c, default: 0] -= 1` rồi kiểm tra `cnt[c]! < 0` — ký tự không có trong `magazine` sẽ xuống `-1` ngay.\n- Dừng sớm ngay khi thiếu, không cần đếm hết."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `ransomNote = \"aa\"`, `magazine = \"aab\"`\n**Output:** `true`\n\n```\nĐếm magazine: {a: 2, b: 1}\n'a' → a = 1\n'a' → a = 0\nHết ransomNote, không số nào âm → true\n```\n\n**Input:** `ransomNote = \"aa\"`, `magazine = \"ab\"`\n**Output:** `false`\n\n```\nĐếm magazine: {a: 1, b: 1}\n'a' → a = 0\n'a' → a = -1 < 0 → false\n```"}, {"title": "Ghi nhớ", "text": "\"Ghép được A từ các phần của B\" → đếm tần suất B rồi trừ theo A. Cùng họ với bài 242 (anagram) và 49."}], "code": "class Solution {\n    func canConstruct(_ ransomNote: String, _ magazine: String) -> Bool {\n        var cnt = [Character: Int]()\n        for c in magazine { cnt[c, default: 0] += 1 }\n        for c in ransomNote {\n            cnt[c, default: 0] -= 1\n            if cnt[c]! < 0 { return false }\n        }\n        return true\n    }\n}\n"}, {"id": 392, "category": "algorithms", "title": "Is Subsequence", "slug": "is-subsequence", "difficulty": "Easy", "topics": ["Two Pointers", "String", "Dynamic Programming"], "date": "2026-10-13", "time": "O(|t|)", "space": "O(|s|)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Kiểm tra `s` có phải là **dãy con** của `t` không — tức có thể xóa bớt một số ký tự của `t` (giữ nguyên thứ tự) để được `s`."}, {"title": "Cơ sở lý thuyết", "text": "- **Dãy con (subsequence)** khác **chuỗi con (substring)**: không cần liên tiếp, chỉ cần đúng thứ tự.\n- **Tham lam khớp sớm nhất**: khi cần ký tự `s[i]`, hãy khớp nó với lần xuất hiện **đầu tiên** còn lại trong `t`. Khớp sớm không bao giờ thiệt — nó để lại nhiều ký tự nhất cho phần sau (lập luận đổi chỗ).\n- Câu hỏi mở rộng của đề (rất nhiều chuỗi `s` trên cùng một `t`): lưu danh sách vị trí của từng ký tự trong `t` rồi tìm nhị phân vị trí kế tiếp."}, {"title": "Hướng xử lý", "text": "1. Con trỏ `i` trên `s`, ban đầu `0`.\n2. Duyệt từng ký tự `c` của `t`: nếu `c == s[i]` thì `i += 1`.\n3. Kết thúc: `s` là dãy con khi và chỉ khi `i` đã đi hết `s`."}, {"title": "Ý tưởng triển khai", "text": "- `for c in t where i < a.count && c == a[i]` — điều kiện `i < a.count` đứng trước để không truy cập ngoài mảng khi đã khớp hết.\n- `s` rỗng → `i == 0 == a.count` → `true`.\n- Test cục bộ: vét cạn mọi dãy con của `t` (độ dài ≤ 8) để đối chiếu."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"abc\"`, `t = \"ahbgdc\"`\n**Output:** `true`\n\n```\ni=0 (cần 'a')\nc='a': khớp → i=1 (cần 'b')\nc='h': không\nc='b': khớp → i=2 (cần 'c')\nc='g': không\nc='d': không\nc='c': khớp → i=3\ni == 3 == độ dài s → true\n```\n\n**Input:** `s = \"axc\"`, `t = \"ahbgdc\"`\n**Output:** `false`\n\n```\nc='a': khớp → i=1 (cần 'x')\nc='h', 'b', 'g', 'd', 'c': không có 'x'\ni == 1 ≠ 3 → false\n```"}, {"title": "Ghi nhớ", "text": "\"Dãy con\" + chỉ hỏi có/không → hai con trỏ tham lam, `O(n)`. Chỉ cần DP khi phải **đếm** số cách hoặc tìm dãy con chung dài nhất."}], "code": "class Solution {\n    func isSubsequence(_ s: String, _ t: String) -> Bool {\n        let a = Array(s)\n        var i = 0\n        for c in t where i < a.count && c == a[i] {\n            i += 1\n        }\n        return i == a.count\n    }\n}\n"}, {"id": 1114, "category": "concurrency", "title": "Print in Order", "slug": "print-in-order", "difficulty": "Easy", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(1)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Một đối tượng `Foo` có ba phương thức `first()`, `second()`, `third()`, được gọi bởi ba luồng khác nhau theo thứ tự bất kỳ. Phải đảm bảo chúng luôn chạy đúng thứ tự `first → second → third`."}, {"title": "Cơ sở lý thuyết", "text": "- **Luồng (thread)** chạy xen kẽ không đoán trước được: hệ điều hành quyết định luồng nào chạy lúc nào. Muốn có thứ tự thì phải **đồng bộ hóa** tường minh.\n- **Semaphore** là một bộ đếm số nguyên với hai thao tác nguyên tử: `wait()` giảm bộ đếm, nếu bộ đếm đang bằng 0 thì luồng **ngủ** cho tới khi có người `signal()`; `signal()` tăng bộ đếm và đánh thức một luồng đang chờ.\n- Semaphore khởi tạo bằng **0** đóng vai trò \"cổng đang đóng\": ai tới trước cũng phải chờ cho tới khi sự kiện xảy ra. Vì `signal()` được **ghi nhớ** trong bộ đếm, không sợ mất tín hiệu khi `signal` chạy trước `wait`.\n- Trong Swift: `DispatchSemaphore(value:)` của Grand Central Dispatch."}, {"title": "Hướng xử lý", "text": "1. Có hai quan hệ \"phải xảy ra trước\": `first` trước `second`, và `second` trước `third`. Mỗi quan hệ cần một cổng.\n2. `first` không chờ ai — chạy xong thì mở cổng 1.\n3. `second` chờ cổng 1, chạy, rồi mở cổng 2.\n4. `third` chờ cổng 2 rồi chạy.\n\nCách sai thường gặp: dùng biến cờ `Bool` rồi lặp `while !done {}` (busy-wait) — vừa tốn CPU vừa là data race vì đọc/ghi biến chung không khóa."}, {"title": "Ý tưởng triển khai", "text": "- Hai semaphore `s1`, `s2` cùng khởi tạo `0`.\n- `first`: in → `s1.signal()`.\n- `second`: `s1.wait()` → in → `s2.signal()`.\n- `third`: `s2.wait()` → in.\n- Nếu `third` được gọi đầu tiên, nó ngủ ở `s2.wait()`; `second` ngủ ở `s1.wait()`; chỉ `first` chạy được, và dây chuyền tự mở dần."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [3, 1, 2]` — nghĩa là luồng A gọi `third()`, luồng B gọi `first()`, luồng C gọi `second()`, theo đúng thứ tự khởi động đó.\n**Output:** `\"firstsecondthird\"`\n\nBan đầu `s1 = 0`, `s2 = 0`.\n\n```\nLuồng A: third()  → s2.wait(): s2 = 0 → NGỦ\nLuồng B: first()  → in \"first\" → s1.signal(): s1 = 1\nLuồng C: second() → s1.wait(): s1 = 1 → 0, đi tiếp\n                  → in \"second\" → s2.signal(): đánh thức luồng A\nLuồng A: (thức dậy) → in \"third\"\n```\n\nNếu luồng C chạy trước cả luồng B thì nó ngủ ở `s1.wait()` y như luồng A ngủ ở `s2.wait()`; chỉ `first()` là không phải chờ ai, nên kết quả luôn giống nhau."}, {"title": "Ghi nhớ", "text": "\"Sự kiện A phải xảy ra trước B\" → một semaphore giá trị 0, A `signal`, B `wait`. Đây là viên gạch cơ bản cho mọi bài sắp thứ tự luồng. Với Swift hiện đại (async/await) có thể dùng `AsyncStream` hay continuation, nhưng semaphore vẫn là cách diễn đạt trực tiếp nhất cho bài kiểu này."}], "code": "import Foundation\n\nclass Foo {\n    let s1 = DispatchSemaphore(value: 0)\n    let s2 = DispatchSemaphore(value: 0)\n\n    func first(_ printFirst: () -> Void) {\n        printFirst()\n        s1.signal()\n    }\n\n    func second(_ printSecond: () -> Void) {\n        s1.wait()\n        printSecond()\n        s2.signal()\n    }\n\n    func third(_ printThird: () -> Void) {\n        s2.wait()\n        printThird()\n    }\n}\n"}, {"id": 1115, "category": "concurrency", "title": "Print FooBar Alternately", "slug": "print-foobar-alternately", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Hai luồng cùng dùng một đối tượng `FooBar(n)`: luồng A gọi `foo()` (in \"foo\" `n` lần), luồng B gọi `bar()` (in \"bar\" `n` lần). Phải in ra đúng `foobar` lặp lại `n` lần."}, {"title": "Cơ sở lý thuyết", "text": "- **Luân phiên nghiêm ngặt (strict alternation)** giữa hai luồng — còn gọi là mẫu **ping-pong**: mỗi luồng làm một bước rồi **trao lượt** cho luồng kia và tự đi ngủ.\n- Dùng **hai semaphore nhị phân** làm \"thẻ lượt\": tại mọi thời điểm tổng giá trị của hai semaphore cộng số luồng đang in luôn bằng 1 → không bao giờ có hai luồng cùng in.\n- Giá trị khởi tạo quyết định **ai đi trước**: semaphore của `foo` bắt đầu bằng `1`, của `bar` bằng `0`."}, {"title": "Hướng xử lý", "text": "1. Khác bài 1114 (mỗi hàm chạy một lần), ở đây thứ tự phải giữ qua `n` vòng → tín hiệu phải đi **hai chiều**.\n2. `foo` cần lượt để in; in xong thì đưa lượt cho `bar`.\n3. `bar` cần lượt để in; in xong thì trả lượt cho `foo`.\n4. Một `NSLock` thông thường không làm được: mutex chỉ đảm bảo \"không cùng lúc\", không đảm bảo \"xen kẽ\" — một luồng có thể giành lại khóa ngay sau khi nhả."}, {"title": "Ý tưởng triển khai", "text": "- `fooSem = 1`, `barSem = 0`.\n- Vòng lặp của `foo`: `fooSem.wait()` → in → `barSem.signal()`.\n- Vòng lặp của `bar`: `barSem.wait()` → in → `fooSem.signal()`.\n- Sau vòng cuối, `bar` vẫn `signal` cho `fooSem` thêm một lần thừa — vô hại vì không còn ai chờ."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 2`\n**Output:** `\"foobarfoobar\"`\n\nBan đầu `fooSem = 1`, `barSem = 0`. Giả sử luồng `bar` được chạy trước:\n\n```\nbar (vòng 1): barSem.wait(): 0 → NGỦ\nfoo (vòng 1): fooSem.wait(): 1 → 0 → in \"foo\" → barSem.signal()\nfoo (vòng 2): fooSem.wait(): 0 → NGỦ\nbar (vòng 1): (thức dậy) → in \"bar\" → fooSem.signal()\nbar (vòng 2): barSem.wait(): 0 → NGỦ\nfoo (vòng 2): (thức dậy) → in \"foo\" → barSem.signal() → xong\nbar (vòng 2): (thức dậy) → in \"bar\" → fooSem.signal() (thừa, vô hại) → xong\n```\n\nDù hệ điều hành xếp lịch thế nào, mỗi luồng chỉ in được khi nhận \"thẻ lượt\" từ luồng kia."}, {"title": "Ghi nhớ", "text": "Hai luồng xen kẽ → hai semaphore, mỗi bên `wait` cái của mình và `signal` cái của bên kia. Mutex bảo vệ dữ liệu; semaphore (hoặc condition variable) mới điều khiển **thứ tự**."}], "code": "import Foundation\n\nclass FooBar {\n    let n: Int\n    let fooSem = DispatchSemaphore(value: 1)\n    let barSem = DispatchSemaphore(value: 0)\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    func foo(_ printFoo: () -> Void) {\n        for _ in 0..<n {\n            fooSem.wait()\n            printFoo()\n            barSem.signal()\n        }\n    }\n\n    func bar(_ printBar: () -> Void) {\n        for _ in 0..<n {\n            barSem.wait()\n            printBar()\n            fooSem.signal()\n        }\n    }\n}\n"}, {"id": 1116, "category": "concurrency", "title": "Print Zero Even Odd", "slug": "print-zero-even-odd", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Ba luồng dùng chung `ZeroEvenOdd(n)`: luồng `zero()` chỉ in số 0, luồng `even()` chỉ in số chẵn, luồng `odd()` chỉ in số lẻ. Kết quả phải là `0 1 0 2 0 3 … 0 n`."}, {"title": "Cơ sở lý thuyết", "text": "- Mở rộng mẫu ping-pong của bài 1115 lên **ba luồng với một \"nhạc trưởng\"**: luồng `zero` chạy xen giữa mọi bước và là bên quyết định ai đi tiếp.\n- **Chuyển lượt có điều kiện**: thay vì luôn `signal` cho một đối tác cố định, luồng đang giữ lượt chọn semaphore cần đánh thức dựa trên trạng thái (ở đây là tính chẵn lẻ của số sắp in).\n- Bất biến: tại mọi thời điểm chỉ có đúng **một thẻ lượt** lưu hành giữa ba semaphore."}, {"title": "Hướng xử lý", "text": "1. Chuỗi in ra có dạng `zero, odd, zero, even, zero, odd, …` — luồng `zero` in ở mọi vị trí lẻ, còn `odd`/`even` thay phiên ở vị trí chẵn.\n2. Cho mỗi luồng một semaphore riêng: `z` (bắt đầu `1`, vì 0 được in đầu tiên), `e` và `o` (bắt đầu `0`).\n3. `zero` in xong `0` thứ `i` thì đánh thức `odd` nếu `i` lẻ, `even` nếu `i` chẵn.\n4. `odd` và `even` in xong đều trả lượt về cho `zero`."}, {"title": "Ý tưởng triển khai", "text": "- `zero`: lặp `i` từ `1` đến `n` — biến `i` chính là số mà luồng kia sắp in, nên dùng luôn để chọn `o.signal()` hay `e.signal()`.\n- `even`: `stride(from: 2, through: n, by: 2)`; `odd`: `stride(from: 1, through: n, by: 2)`. Mỗi luồng tự biết mình in những số nào, không cần biến đếm dùng chung → **không có dữ liệu chia sẻ nào cần khóa**.\n- Số vòng lặp của ba luồng khớp nhau đúng bằng thiết kế (`n` lần `zero`, `⌊n/2⌋` lần `even`, `⌈n/2⌉` lần `odd`) nên cả ba cùng kết thúc, không luồng nào bị kẹt ở `wait()`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 3`\n**Output:** `\"010203\"`\n\nBan đầu `z = 1`, `e = 0`, `o = 0`. Luồng `even` và `odd` ngủ ngay ở `wait()` đầu tiên cho tới khi được gọi.\n\n```\nzero (i=1): z.wait() ✓ → in 0 → i lẻ  → o.signal()\nodd  (i=1): (thức dậy)  → in 1 → z.signal()\nzero (i=2): z.wait() ✓ → in 0 → i chẵn → e.signal()\neven (i=2): (thức dậy)  → in 2 → z.signal() → hết vòng lặp, xong\nzero (i=3): z.wait() ✓ → in 0 → i lẻ  → o.signal() → xong\nodd  (i=3): (thức dậy)  → in 3 → z.signal() (thừa) → xong\n```\n\nSố lần lặp: `zero` 3 lần, `odd` 2 lần (1, 3), `even` 1 lần (2) — khớp nhau nên không luồng nào bị kẹt."}, {"title": "Ghi nhớ", "text": "Nhiều hơn hai luồng luân phiên → mỗi luồng một semaphore, luồng đang chạy quyết định đánh thức ai. Thiết kế sao cho mỗi luồng tự suy ra được việc của mình từ biến cục bộ sẽ tránh được hẳn data race."}], "code": "import Foundation\n\nclass ZeroEvenOdd {\n    let n: Int\n    let z = DispatchSemaphore(value: 1)\n    let e = DispatchSemaphore(value: 0)\n    let o = DispatchSemaphore(value: 0)\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    func zero(_ printNumber: (Int) -> Void) {\n        for i in 1...n {\n            z.wait()\n            printNumber(0)\n            // số sắp in là i: lẻ thì gọi odd, chẵn thì gọi even\n            if i % 2 == 1 { o.signal() } else { e.signal() }\n        }\n    }\n\n    func even(_ printNumber: (Int) -> Void) {\n        for i in stride(from: 2, through: n, by: 2) {\n            e.wait()\n            printNumber(i)\n            z.signal()\n        }\n    }\n\n    func odd(_ printNumber: (Int) -> Void) {\n        for i in stride(from: 1, through: n, by: 2) {\n            o.wait()\n            printNumber(i)\n            z.signal()\n        }\n    }\n}\n"}, {"id": 1117, "category": "concurrency", "title": "Building H2O", "slug": "building-h2o", "difficulty": "Medium", "topics": ["Concurrency", "Semaphore", "Mutex"], "date": "2026-10-09", "time": "O(1) mỗi luồng", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Có nhiều luồng hydro (gọi `hydrogen()`) và oxy (gọi `oxygen()`) tới theo thứ tự bất kỳ. Phải cho chúng \"đi qua\" theo từng nhóm ba tạo thành phân tử nước: trong chuỗi kết quả, cứ ba ký tự liên tiếp phải gồm đúng 2 `H` và 1 `O`."}, {"title": "Cơ sở lý thuyết", "text": "- **Semaphore đếm (counting semaphore)**: giá trị khởi tạo `k > 1` cho phép tối đa `k` luồng đi qua — dùng để mô hình hóa \"còn `k` chỗ trống\".\n- **Rào chắn / gom nhóm (barrier, rendezvous)**: một nhóm luồng chỉ được đi tiếp khi đã đủ thành phần. Đây là bài kinh điển trong *The Little Book of Semaphores*.\n- **Deadlock do giữ-và-chờ (hold and wait)**: hai luồng mỗi bên giữ một phần tài nguyên và chờ phần còn lại mà bên kia đang giữ → cả hai kẹt mãi. Cách chữa: bắt việc \"lấy nhiều tài nguyên\" phải diễn ra **nguyên khối** bằng một mutex."}, {"title": "Hướng xử lý", "text": "1. Mỗi phân tử có 2 chỗ cho H → semaphore `h = 2`: tối đa hai H được in trong một phân tử, H thứ ba phải chờ.\n2. O chỉ được in khi đã có đủ 2 H → semaphore `o = 0`, mỗi H in xong `signal` một lần, O phải `wait` **hai lần**.\n3. O in xong thì phân tử hoàn tất → `h.signal()` hai lần để mở chỗ cho phân tử kế tiếp.\n4. **Cạm bẫy**: nếu hai luồng O cùng lúc mỗi bên lấy được một `o.wait()`, cả hai chờ cái thứ hai mãi mãi — trong khi `h` đã hết chỗ nên không H nào tới cứu. Phải bọc hai lần `wait` trong một `NSLock` để mỗi lúc chỉ một O gom H."}, {"title": "Ý tưởng triển khai", "text": "- `hydrogen`: `h.wait()` → in H → `o.signal()`.\n- `oxygen`: `oLock.lock()` → `o.wait()` ×2 → in O → `h.signal()` ×2 → `oLock.unlock()`.\n- Thứ tự in trong một phân tử luôn là `H H O`. Đề chấp nhận mọi hoán vị, nên đây là một đáp án hợp lệ và đơn giản nhất.\n- Vì sao nhóm ba không lẫn sang nhau: H của phân tử sau chỉ qua được `h.wait()` **sau khi** O của phân tử trước đã in và `signal`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `water = \"OOHHHH\"` — 2 luồng oxy tới trước, rồi 4 luồng hydro.\n**Output:** `\"HHOHHO\"` (mọi kết quả mà cứ 3 ký tự gồm 2 `H` + 1 `O` đều được chấp nhận)\n\nBan đầu `h = 2`, `o = 0`.\n\n```\nO1: lấy oLock → o.wait(): 0 → NGỦ (vẫn giữ oLock)\nO2: chờ oLock\nH1: h.wait(): 2 → 1 → in H → o.signal()   (O1 nhận 1/2)\nH2: h.wait(): 1 → 0 → in H → o.signal()   (O1 nhận 2/2)\nH3: h.wait(): 0 → NGỦ\nH4: h.wait(): 0 → NGỦ\nO1: (đủ 2 H) → in O → h.signal() ×2 → nhả oLock        ← xong phân tử 1: H H O\nH3: (thức dậy) → in H → o.signal()\nH4: (thức dậy) → in H → o.signal()\nO2: lấy oLock → o.wait() ×2 ✓ → in O → h.signal() ×2   ← xong phân tử 2: H H O\n```\n\nNếu bỏ `oLock`: O1 và O2 có thể mỗi bên lấy được một tín hiệu từ H1, H2 rồi cùng chờ tín hiệu thứ hai, trong khi H3, H4 đang ngủ vì `h = 0` → deadlock."}, {"title": "Ghi nhớ", "text": "\"Cần `k` đơn vị mới được chạy\" → `wait` `k` lần, nhưng nhớ khóa lại để việc gom không bị chia đôi giữa hai luồng. Khi phân tích deadlock, tự hỏi: có tình huống nào hai luồng mỗi bên giữ một nửa không?"}], "code": "import Foundation\n\nclass H2O {\n    let h = DispatchSemaphore(value: 2)   // còn mấy chỗ cho H trong phân tử hiện tại\n    let o = DispatchSemaphore(value: 0)   // số H đã vào, chờ O\n    let oLock = NSLock()\n\n    func hydrogen(_ releaseHydrogen: () -> Void) {\n        h.wait()\n        releaseHydrogen()\n        o.signal()\n    }\n\n    func oxygen(_ releaseOxygen: () -> Void) {\n        // chỉ 1 O được gom H tại một thời điểm, không thì 2 O mỗi đứa giữ 1 H là kẹt\n        oLock.lock()\n        o.wait()\n        o.wait()\n        releaseOxygen()\n        h.signal()\n        h.signal()\n        oLock.unlock()\n    }\n}\n"}, {"id": 1195, "category": "concurrency", "title": "Fizz Buzz Multithreaded", "slug": "fizz-buzz-multithreaded", "difficulty": "Medium", "topics": ["Concurrency", "Condition Variable"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Bốn luồng dùng chung `FizzBuzz(n)`: `fizz()` in \"fizz\" cho số chia hết cho 3 (không chia hết cho 5), `buzz()` cho số chia hết cho 5 (không chia hết cho 3), `fizzbuzz()` cho số chia hết cho 15, `number()` in các số còn lại. Kết quả phải đúng thứ tự từ 1 đến `n`."}, {"title": "Cơ sở lý thuyết", "text": "- **Biến điều kiện (condition variable)**: cho phép luồng ngủ cho tới khi một **điều kiện trên trạng thái dùng chung** trở thành đúng. Luôn đi kèm một mutex. Trong Swift: `NSCondition` (gộp sẵn khóa + biến điều kiện).\n- Ba thao tác: `wait()` — **nhả khóa và ngủ** một cách nguyên tử, khi thức dậy tự lấy lại khóa; `signal()` — đánh thức một luồng; `broadcast()` — đánh thức tất cả.\n- **Thức giấc giả (spurious wakeup)**: luồng có thể tỉnh dậy mà điều kiện chưa đúng. Vì vậy luôn kiểm tra điều kiện trong vòng `while`, không bao giờ dùng `if`.\n- So với semaphore: semaphore hợp khi \"ai đi tiếp\" biết trước; biến điều kiện hợp khi việc đó phụ thuộc vào **trạng thái** (ở đây là giá trị của số hiện tại)."}, {"title": "Hướng xử lý", "text": "1. Trạng thái dùng chung duy nhất: số hiện tại `i`. Mỗi luồng có một vị từ \"số này có phải của tôi không\".\n2. Mỗi luồng lặp: khóa → chờ tới khi `i` thuộc về mình (hoặc đã hết số) → xử lý → `i += 1` → đánh thức mọi người → mở khóa.\n3. Phải dùng `broadcast()` chứ không phải `signal()`: ta không biết luồng nào là chủ của số kế tiếp; `signal` có thể đánh thức nhầm luồng, nó ngủ lại và cả hệ thống đứng im.\n4. **Điều kiện thoát**: khi `i > n` mọi luồng phải thoát. Điều kiện chờ là `i <= n && !mine(i)` nên luồng đang ngủ cũng sẽ tỉnh dậy và thoát sau lần `broadcast` cuối."}, {"title": "Ý tưởng triển khai", "text": "- Cả bốn hàm chỉ khác nhau ở vị từ và hành động → gom vào một hàm `run(mine, act)`.\n- Trong `run`: `cond.lock()`; `while i <= n && !mine(i) { cond.wait() }`; nếu `i > n` thì `unlock` và `return`; ngược lại `act(i)`, `i += 1`, `cond.broadcast()`, `cond.unlock()`.\n- Gọi `act(i)` **trong khi còn giữ khóa** để đảm bảo việc in và việc tăng `i` là một bước không thể bị chen ngang.\n- Nhớ `unlock` trước mọi `return` — quên là các luồng khác treo vĩnh viễn."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 5`\n**Output:** `[1, 2, \"fizz\", 4, \"buzz\"]`\n\nBốn luồng cùng chờ trên một `NSCondition`, biến chung `i = 1`.\n\n```\ni=1: chỉ luồng number thấy \"số này của tôi\" → in 1 → i=2 → broadcast\n     (fizz, buzz, fizzbuzz thức dậy, kiểm tra lại điều kiện, thấy chưa phải lượt → ngủ tiếp)\ni=2: number   → in 2      → i=3 → broadcast\ni=3: fizz     → in \"fizz\" → i=4 → broadcast\ni=4: number   → in 4      → i=5 → broadcast\ni=5: buzz     → in \"buzz\" → i=6 → broadcast\ni=6 > n: cả bốn luồng thức dậy, thấy i > n → unlock và thoát\n```\n\nVới `n = 15`, bước cuối `i=15` thuộc về luồng `fizzbuzz` (chia hết cho cả 3 và 5); hai luồng `fizz` và `buzz` bỏ qua số này vì vị từ của chúng loại trừ bội của số còn lại."}, {"title": "Ghi nhớ", "text": "Mẫu chuẩn của biến điều kiện: `lock → while !điều_kiện { wait } → làm việc → broadcast → unlock`. Nhiều luồng với các điều kiện khác nhau cùng chờ trên một biến → dùng `broadcast`."}], "code": "import Foundation\n\nclass FizzBuzz {\n    let n: Int\n    var i = 1\n    let cond = NSCondition()\n\n    init(_ n: Int) {\n        self.n = n\n    }\n\n    // chờ tới lượt số i thuộc về mình thì xử lý, hết số thì thoát\n    func run(_ mine: (Int) -> Bool, _ act: (Int) -> Void) {\n        while true {\n            cond.lock()\n            while i <= n && !mine(i) {\n                cond.wait()\n            }\n            if i > n {\n                cond.unlock()\n                return\n            }\n            act(i)\n            i += 1\n            cond.broadcast()\n            cond.unlock()\n        }\n    }\n\n    func fizz(_ printFizz: () -> Void) {\n        run({ $0 % 3 == 0 && $0 % 5 != 0 }, { _ in printFizz() })\n    }\n\n    func buzz(_ printBuzz: () -> Void) {\n        run({ $0 % 5 == 0 && $0 % 3 != 0 }, { _ in printBuzz() })\n    }\n\n    func fizzbuzz(_ printFizzBuzz: () -> Void) {\n        run({ $0 % 15 == 0 }, { _ in printFizzBuzz() })\n    }\n\n    func number(_ printNumber: (Int) -> Void) {\n        run({ $0 % 3 != 0 && $0 % 5 != 0 }, printNumber)\n    }\n}\n"}, {"id": 1226, "category": "concurrency", "title": "The Dining Philosophers", "slug": "the-dining-philosophers", "difficulty": "Medium", "topics": ["Concurrency", "Mutex", "Deadlock"], "date": "2026-10-09", "time": "O(1) mỗi lần ăn", "space": "O(1)", "status": "Test cục bộ (LeetCode không có Swift)", "sections": [{"title": "Đề bài", "text": "Năm triết gia ngồi quanh bàn tròn, giữa hai người kề nhau có một chiếc nĩa (tổng cộng 5 nĩa). Muốn ăn phải cầm được **cả hai** nĩa bên trái và bên phải. Cài đặt `wantsToEat(...)` sao cho không ai bị đói mãi và chương trình không bao giờ deadlock."}, {"title": "Cơ sở lý thuyết", "text": "- **Mutex (khóa loại trừ)**: mỗi lúc chỉ một luồng giữ được. Mỗi chiếc nĩa là một mutex. Trong Swift: `NSLock`.\n- **Bốn điều kiện Coffman** — deadlock chỉ xảy ra khi có đủ cả bốn:\n   1. *Loại trừ lẫn nhau*: tài nguyên không chia sẻ được.\n   2. *Giữ và chờ*: giữ một tài nguyên trong lúc chờ tài nguyên khác.\n   3. *Không thu hồi*: không ai giật được tài nguyên của luồng khác.\n   4. *Chờ vòng tròn*: A chờ B, B chờ C, …, E chờ A.\n- Phá **một** trong bốn điều kiện là đủ ngăn deadlock. Dễ phá nhất là điều kiện 4 bằng **thứ tự tài nguyên (resource ordering)**: đánh số mọi tài nguyên và luôn khóa theo thứ tự tăng dần."}, {"title": "Hướng xử lý", "text": "1. Cách ngây thơ: ai cũng cầm nĩa trái trước rồi nĩa phải. Nếu cả năm người cùng cầm nĩa trái một lúc → mỗi người giữ một nĩa và chờ nĩa của người bên cạnh → vòng chờ khép kín → deadlock.\n2. Áp dụng thứ tự tài nguyên: nĩa đánh số `0…4`, mỗi người luôn khóa nĩa **số nhỏ hơn** trước.\n3. Vì sao hết deadlock: triết gia `0…3` lấy nĩa trái (`p`) trước rồi nĩa phải (`p + 1`); riêng triết gia `4` có nĩa trái là `4`, nĩa phải là `0` nên lấy nĩa `0` trước — **ngược chiều** với bốn người kia. Vòng tròn bị phá: không thể có chuỗi chờ mà số nĩa cứ tăng mãi rồi quay lại đầu.\n\nCác cách khác: dùng semaphore giá trị `4` chỉ cho tối đa bốn người ngồi vào bàn cùng lúc; hoặc một mutex toàn cục (đúng nhưng mất tính song song — hai người không kề nhau lẽ ra ăn cùng lúc được)."}, {"title": "Ý tưởng triển khai", "text": "- `forks`: mảng 5 `NSLock`. Nĩa trái của triết gia `p` là `p`, nĩa phải là `(p + 1) % 5`.\n- `a = min(l, r)`, `b = max(l, r)`; khóa `a` rồi `b`.\n- Khi đã giữ cả hai khóa mới gọi lần lượt `pickLeftFork`, `pickRightFork`, `eat`, `putLeftFork`, `putRightFork` — thứ tự gọi callback không cần trùng thứ tự khóa.\n- Mở khóa theo thứ tự ngược lại (`b` rồi `a`) — thói quen tốt, dù thứ tự mở không ảnh hưởng tới deadlock."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 1` — mỗi triết gia muốn ăn 1 lần; xét kịch bản xấu nhất là cả 5 người cùng đói một lúc.\n**Output:** một dãy các bộ `[triết gia, nĩa, hành động]` hợp lệ, ví dụ bắt đầu bằng `[3,1,1],[3,2,1],[3,0,3],[3,1,2],[3,2,2],…` (triết gia 3 cầm nĩa trái, nĩa phải, ăn, đặt trái, đặt phải).\n\nNĩa trái của triết gia `p` là `p`, nĩa phải là `(p + 1) % 5`; ai cũng khóa nĩa số nhỏ trước.\n\n```\nP0: cần nĩa 0 rồi 1 → khóa nĩa 0 ✓\nP1: cần nĩa 1 rồi 2 → khóa nĩa 1 ✓\nP2: cần nĩa 2 rồi 3 → khóa nĩa 2 ✓\nP3: cần nĩa 3 rồi 4 → khóa nĩa 3 ✓\nP4: cần nĩa 0 rồi 4 → nĩa 0 đang bị P0 giữ → CHỜ (chưa cầm nĩa nào, nĩa 4 vẫn trống)\n\nP3: khóa nĩa 4 ✓ → ĂN → nhả nĩa 4, 3\nP2: khóa nĩa 3 ✓ → ĂN → nhả nĩa 3, 2\nP1: khóa nĩa 2 ✓ → ĂN → nhả nĩa 2, 1\nP0: khóa nĩa 1 ✓ → ĂN → nhả nĩa 1, 0\nP4: khóa nĩa 0 ✓ → khóa nĩa 4 ✓ → ĂN\n```\n\nSo sánh với cách ngây thơ (ai cũng cầm nĩa trái trước): P4 sẽ cầm nĩa 4, khi đó P3 không lấy được nĩa 4, và cả năm người giữ một nĩa, chờ nhau thành vòng tròn → deadlock."}, {"title": "Ghi nhớ", "text": "Cần khóa nhiều mutex cùng lúc → luôn khóa theo **một thứ tự toàn cục cố định**. Đây là quy tắc thực chiến quan trọng nhất để tránh deadlock, áp dụng y nguyên khi viết code iOS với nhiều `NSLock` hay nhiều serial queue."}], "code": "import Foundation\n\nclass DiningPhilosophers {\n    let forks = (0..<5).map { _ in NSLock() }\n\n    func wantsToEat(_ p: Int,\n                    _ pickLeftFork: () -> Void,\n                    _ pickRightFork: () -> Void,\n                    _ eat: () -> Void,\n                    _ putLeftFork: () -> Void,\n                    _ putRightFork: () -> Void) {\n        let l = p, r = (p + 1) % 5\n        // luôn khóa nĩa số nhỏ trước -> không thể thành vòng chờ\n        let a = min(l, r), b = max(l, r)\n\n        forks[a].lock()\n        forks[b].lock()\n\n        pickLeftFork()\n        pickRightFork()\n        eat()\n        putLeftFork()\n        putRightFork()\n\n        forks[b].unlock()\n        forks[a].unlock()\n    }\n}\n"}, {"id": 4061, "category": "contests", "title": "Minimum Queen Moves to Reach Target", "slug": "minimum-queen-moves-to-reach-target", "difficulty": "Easy", "topics": ["Biweekly Contest 192", "Math", "Chess"], "date": "2026-10-09", "time": "O(1)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Trên bàn cờ 8×8 trống, quân hậu ở ô `source`, cần tới ô `target`. Mỗi nước hậu đi một hay nhiều ô theo hàng, cột hoặc đường chéo. Tìm số nước ít nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Hình học bàn cờ**: hai ô cùng hàng khi `Δhàng = 0`, cùng cột khi `Δcột = 0`, cùng đường chéo khi `|Δhàng| = |Δcột|`.\n- **Chặn trên bằng lập luận**: trên bàn cờ trống, hậu (thực ra chỉ cần xe) luôn tới được mọi ô trong **tối đa 2 nước** — đi ngang tới đúng cột rồi đi dọc tới đúng hàng.\n- Khi đáp án chỉ nhận vài giá trị nhỏ, bài toán \"tìm đường ngắn nhất\" suy biến thành **phân loại trường hợp**, không cần BFS."}, {"title": "Hướng xử lý", "text": "1. Trùng ô → `0`.\n2. Cùng hàng, cùng cột hoặc cùng đường chéo → `1`.\n3. Còn lại → `2` (luôn làm được, theo lập luận ở trên)."}, {"title": "Ý tưởng triển khai", "text": "- Tính `dr = |sr - tr|`, `dc = |sc - tc|`, rồi ba câu `if`.\n- Test cục bộ: chạy BFS thật trên bàn 8×8 cho **toàn bộ** `64 × 64` cặp ô và so với công thức."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `source = [8, 1]`, `target = [1, 8]` → **Output:** `1`\n\n```\ndr = |8 - 1| = 7, dc = |1 - 8| = 7\ndr == dc → cùng đường chéo → 1 nước\n```\n\n**Input:** `source = [4, 2]`, `target = [1, 3]` → **Output:** `2`\n\n```\ndr = |4 - 1| = 3, dc = |2 - 3| = 1\nkhông trùng ô (dr, dc ≠ 0), không cùng hàng (dr ≠ 0), không cùng cột (dc ≠ 0), không cùng chéo (3 ≠ 1)\n→ 2 nước, ví dụ (4,2) → (4,3) → (1,3)\n```\n\n**Input:** `source = [1, 1]`, `target = [1, 1]` → **Output:** `0` (`dr = dc = 0`)."}, {"title": "Ghi nhớ", "text": "Trước khi viết BFS, hỏi \"đáp án lớn nhất có thể là bao nhiêu?\". Nếu bị chặn bởi hằng số nhỏ thì chỉ cần xét từng trường hợp. So sánh: mã cần BFS thật, tượng thì `0/1/2` hoặc không tới được (khác màu ô), xe và hậu luôn `≤ 2`."}], "code": "class Solution {\n    func minQueenMoves(_ source: [Int], _ target: [Int]) -> Int {\n        let dr = abs(source[0] - target[0])\n        let dc = abs(source[1] - target[1])\n\n        if dr == 0 && dc == 0 { return 0 }\n        if dr == 0 || dc == 0 || dr == dc { return 1 }\n        return 2\n    }\n}\n"}, {"id": 4062, "category": "contests", "title": "Transform Array Using Pair Operations", "slug": "transform-array-using-pair-operations", "difficulty": "Medium", "topics": ["Biweekly Contest 192", "Array", "Math", "Invariant"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho hai mảng `source`, `target` cùng độ dài `n ≥ 2`. Mỗi thao tác chọn hai chỉ số khác nhau `i`, `j` và một số nguyên `delta` bất kỳ, rồi gán `source[i] = source[i] + source[j] - delta` và `source[j] = delta`. Hỏi có thể biến `source` thành `target` không."}, {"title": "Cơ sở lý thuyết", "text": "- **Bất biến (invariant)**: một đại lượng không đổi qua mọi thao tác. Nếu bất biến của trạng thái đầu và trạng thái đích khác nhau thì chắc chắn **không** tới được. Đây là công cụ chính để chứng minh \"không thể\".\n- Chứng minh \"có thể\" cần chiều ngược lại: chỉ ra một **cách dựng** cụ thể khi bất biến khớp.\n- Bài \"biến đổi A thành B bằng thao tác cho trước\" gần như luôn giải theo hai bước đó: tìm bất biến → chứng minh nó là điều kiện đủ."}, {"title": "Hướng xử lý", "text": "1. **Tìm bất biến.** Sau thao tác, `source[i] + source[j]` mới bằng `(source[i] + source[j] - delta) + delta` — đúng bằng tổng cũ. Các phần tử khác không đổi. Vậy **tổng cả mảng là bất biến** → nếu tổng khác nhau thì trả `false`.\n2. **Hiểu thao tác.** Nó cho phép đặt `source[j]` thành **giá trị tùy ý**, phần chênh lệch dồn hết sang `source[i]`. Nói cách khác: phân phối lại tùy ý tổng của hai phần tử.\n3. **Điều kiện đủ.** Chọn phần tử cuối làm \"thùng chứa\" (`i = n - 1`). Với từng `j` từ `0` đến `n - 2`, làm thao tác với `delta = target[j]` để đặt `source[j]` đúng giá trị. Sau `n - 1` thao tác, `n - 1` phần tử đầu đã khớp; vì tổng được bảo toàn và bằng tổng của `target`, phần tử cuối cũng tự khớp.\n4. Kết luận: đáp án là `sum(source) == sum(target)`."}, {"title": "Ý tưởng triển khai", "text": "- Một dòng: `source.reduce(0, +) == target.reduce(0, +)`.\n- Tổng tối đa cỡ `10⁵ × 10⁹ = 10¹⁴`, vừa `Int` 64 bit.\n- Test cục bộ: ngoài so sánh tổng, còn chạy đúng chuỗi thao tác ở bước 3 để xác nhận nó thật sự tạo ra `target`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `source = [1, 2, 3]`, `target = [0, 2, 4]` → **Output:** `true`\n\n```\nsum(source) = 1 + 2 + 3 = 6\nsum(target) = 0 + 2 + 4 = 6\n6 == 6 → true\n```\n\nDựng lại chuỗi thao tác để thấy vì sao tổng bằng nhau là đủ — dùng phần tử cuối (`i = 2`) làm thùng chứa:\n\n```\nBan đầu:               [1, 2, 3]\nj=0, delta=target[0]=0: source[2] = 3 + 1 - 0 = 4, source[0] = 0 → [0, 2, 4]\nj=1, delta=target[1]=2: source[2] = 4 + 2 - 2 = 4, source[1] = 2 → [0, 2, 4]\nHai phần tử đầu đã khớp; phần tử cuối tự bằng 6 - 0 - 2 = 4 ✓\n```\n\n**Input:** `source = [1, 2, 1]`, `target = [0, 2, 5]` → **Output:** `false`\n\n```\nsum(source) = 4, sum(target) = 7 → khác nhau → false\n```"}, {"title": "Ghi nhớ", "text": "Đề cho thao tác trông rắc rối với tham số tự do (`delta` bất kỳ) → gần như chắc chắn có một bất biến đơn giản (tổng, tính chẵn lẻ, XOR, gcd…) và đáp án chỉ là so sánh bất biến đó. Đừng mô phỏng; hãy cộng hai vế lại xem cái gì không đổi."}], "code": "class Solution {\n    func canTransform(_ source: [Int], _ target: [Int]) -> Bool {\n        return source.reduce(0, +) == target.reduce(0, +)\n    }\n}\n"}, {"id": 4063, "category": "contests", "title": "Longest Subarray Divisible by K with At Most One Negation I", "slug": "longest-subarray-divisible-by-k-with-at-most-one-negation-i", "difficulty": "Medium", "topics": ["Biweekly Contest 192", "Array", "Hash Table", "Math", "Enumeration"], "date": "2026-10-09", "time": "O(n²)", "space": "O(k)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng `nums` (`n ≤ 1000`) và số `k`. Một mảng con là hợp lệ nếu tổng của nó chia hết cho `k`, hoặc trở nên chia hết cho `k` sau khi đổi dấu **một** phần tử trong nó. Tìm độ dài mảng con hợp lệ dài nhất (không có thì trả `0`)."}, {"title": "Cơ sở lý thuyết", "text": "- **Đồng dư**: `a ≡ b (mod k)` khi `a - b` chia hết cho `k`. Phép cộng, trừ, nhân đều \"đi qua\" được phép lấy dư.\n- **Tác động của việc đổi dấu**: đổi `x` thành `-x` làm tổng giảm đúng `2x`. Vậy điều kiện \"đổi dấu một phần tử thì chia hết\" tương đương: tồn tại `x` trong mảng con sao cho `S - 2x ≡ 0`, tức `2x ≡ S (mod k)`.\n- **Phép `%` với số âm trong Swift** cho kết quả âm (`-7 % 3 == -1`). Muốn dư không âm phải chuẩn hóa: `((x % k) + k) % k`.\n- **Mảng đánh dấu theo \"tem\" (timestamp)**: thay vì xóa cả mảng `seen` mỗi vòng ngoài (tốn `O(k)`), ghi vào ô số hiệu của vòng hiện tại. Ô chỉ được coi là \"đã đánh dấu\" khi tem trùng vòng đang xét."}, {"title": "Hướng xử lý", "text": "1. `n ≤ 1000` nên `O(n²)` — xét mọi cặp `(l, r)` — là đủ, miễn mỗi cặp kiểm tra trong `O(1)`.\n2. Cố định `l`, mở rộng `r` dần. Duy trì:\n   - `sum` = tổng đoạn `[l, r]` theo modulo `k`.\n   - Tập các giá trị `2x mod k` của những phần tử đã nằm trong đoạn.\n3. Đoạn `[l, r]` hợp lệ khi `sum == 0` (không cần đổi dấu) hoặc `sum` nằm trong tập trên (đổi dấu phần tử tương ứng)."}, {"title": "Ý tưởng triển khai", "text": "- `seen` là mảng `k` ô, khởi tạo `-1`; `seen[v] = l` nghĩa là \"trong vòng `l`, đã có phần tử cho `2x ≡ v`\". Kiểm tra bằng `seen[sum] == l`.\n- Chuẩn hóa dư không âm ở cả `sum` và `2 * nums[r]`.\n- Phải thêm `nums[r]` vào tập **trước** khi kiểm tra, vì chính phần tử mới cũng có thể là phần tử bị đổi dấu.\n- Test cục bộ đối chiếu với vét cạn `O(n³)` trên 5000 mảng ngẫu nhiên, có cả số âm."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [4, 1, 2]`, `k = 3`\n**Output:** `3`\n\nVòng ngoài `l = 0` (các vòng `l = 1, 2` không cho kết quả dài hơn):\n\n```\nr=0, x=4: sum = 4 % 3 = 1          đánh dấu seen[2·4 % 3 = 2] = 0\n          sum ≠ 0, seen[1] chưa đánh dấu → [4] không hợp lệ\n\nr=1, x=1: sum = (1 + 1) % 3 = 2    đánh dấu seen[2·1 % 3 = 2] = 0\n          seen[2] == 0 → hợp lệ → best = 2\n          (đổi dấu 1: 4 - 1 = 3 chia hết cho 3)\n\nr=2, x=2: sum = (2 + 2) % 3 = 1    đánh dấu seen[2·2 % 3 = 1] = 0\n          seen[1] == 0 → hợp lệ → best = 3\n          (đổi dấu 2: 4 + 1 - 2 = 3 chia hết cho 3)\n```\n\n**Input:** `nums = [5, 3, 4]`, `k = 7` → **Output:** `2`\n\n```\nl=0: [5] sum=5 ✗ · [5,3] sum=1, các 2x%7 = {3, 6} ✗ · [5,3,4] sum=5, {3, 6, 1} ✗\nl=1: [3] sum=3 ✗ · [3,4] sum = 7 % 7 = 0 ✓ → best = 2\nl=2: [4] sum=4, 2x%7 = 1 ✗\n```"}, {"title": "Ghi nhớ", "text": "\"Sửa một phần tử thì tổng thỏa điều kiện\" → viết ra tổng thay đổi bao nhiêu (ở đây `-2x`) và chuyển thành câu hỏi \"có phần tử nào mang giá trị cần thiết không\". Bản II (4064) có `n = 10⁵` nên phải bỏ vòng lặp theo `l` — xem ghi chú bài đó."}], "code": "class Solution {\n    func longestSubarray(_ nums: [Int], _ k: Int) -> Int {\n        let n = nums.count\n        // seen[v] == l nghĩa là trong đoạn bắt đầu từ l đã có phần tử x với 2x % k == v\n        var seen = [Int](repeating: -1, count: k)\n        var best = 0\n\n        for l in 0..<n {\n            var sum = 0\n            for r in l..<n {\n                sum = ((sum + nums[r]) % k + k) % k\n                seen[((2 * nums[r]) % k + k) % k] = l\n\n                // chia hết sẵn, hoặc đổi dấu 1 phần tử x: sum - 2x chia hết\n                if sum == 0 || seen[sum] == l {\n                    best = max(best, r - l + 1)\n                }\n            }\n        }\n        return best\n    }\n}\n"}, {"id": 4064, "category": "contests", "title": "Longest Subarray Divisible by K with At Most One Negation II", "slug": "longest-subarray-divisible-by-k-with-at-most-one-negation-ii", "difficulty": "Hard", "topics": ["Biweekly Contest 192", "Array", "Prefix Sum", "Hash Table", "Math"], "date": "2026-10-09", "time": "O(n + k²)", "space": "O(k)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Giống bài I (4063): mảng con hợp lệ nếu tổng chia hết cho `k`, hoặc chia hết sau khi đổi dấu một phần tử trong nó; tìm độ dài lớn nhất. Khác ở ràng buộc: `n ≤ 10⁵`, `k ≤ 3000`."}, {"title": "Cơ sở lý thuyết", "text": "- **Tổng tiền tố theo modulo**: đặt `P[l]` là tổng `l` phần tử đầu. Tổng đoạn `[l, r]` là `P[r+1] - P[l]`, chia hết cho `k` khi `P[r+1] ≡ P[l]`. Muốn đoạn dài nhất → với mỗi số dư chỉ cần nhớ **vị trí xuất hiện sớm nhất** (`first[u]`). Đây là kỹ thuật của bài 974 / 523.\n- **Đổi dấu `nums[i]`** làm tổng giảm `2·nums[i]`, nên điều kiện thành: tồn tại `l ≤ i ≤ r` với `P[l] + 2·nums[i] ≡ P[r+1] (mod k)`.\n- **Ràng buộc gợi ý độ phức tạp**: `k ≤ 3000` nhỏ bất thường → lời giải mong đợi phụ thuộc vào `k`, cỡ `O(k²)` (9 triệu) chứ không phải `O(n·k)` (300 triệu).\n- **Cập nhật lười (lazy)**: hoãn việc tính cho tới khi thật sự cần, và không bao giờ làm lại phần đã làm."}, {"title": "Hướng xử lý", "text": "1. `O(n²)` của bài I không còn dùng được. Duyệt `r` từ trái sang phải và cần trả lời nhanh: `l` nhỏ nhất thỏa điều kiện là bao nhiêu?\n2. Trường hợp không đổi dấu: `l = first[P[r+1]]`.\n3. Trường hợp đổi dấu: định nghĩa `e[v]` = `l` nhỏ nhất sao cho có `i ≥ l` **đã duyệt** với `(P[l] + 2·nums[i]) mod k = v`. Đáp án tại `r` là `e[P[r+1]]`.\n4. **Cập nhật `e` khi thêm phần tử `i = r`**: nó ghép được với mọi `l ≤ r`, nhưng với mỗi số dư `u` chỉ `l` sớm nhất có ích, nên `e[(u + s) mod k] = min(…, first[u])` với `s = 2·nums[r] mod k`, cho mọi số dư `u` đã xuất hiện. Làm thẳng như vậy tốn `O(k)` mỗi bước → `O(n·k)`, sát giới hạn.\n5. **Tối ưu then chốt.** Phép cập nhật chỉ phụ thuộc vào cặp `(độ dịch s, số dư u)`, và `first[u]` **không bao giờ thay đổi** sau khi được gán. Vậy mỗi cặp `(s, u)` chỉ cần xử lý **một lần duy nhất**. Khi gặp lại độ dịch `s`, chỉ cần ghép với những số dư **mới xuất hiện** kể từ lần trước. Tổng công việc bị chặn bởi số cặp: `k × k`.\n6. Vì sao hoãn mà vẫn đúng: số dư `u` xuất hiện lần đầu ở vị trí `l` chỉ ghép được với phần tử `i ≥ l`. Nếu sau thời điểm đó độ dịch `s` không xuất hiện nữa thì cặp `(s, u)` vốn không hợp lệ, bỏ qua là đúng."}, {"title": "Ý tưởng triển khai", "text": "- `first[u]` (khởi tạo `first[0] = 0` cho tiền tố rỗng), `order` là danh sách số dư theo thứ tự xuất hiện lần đầu.\n- `done[s]` = số phần tử đầu của `order` đã được ghép với độ dịch `s`. Tại mỗi `r`: chạy `t` từ `done[s]` tới hết `order`, cập nhật `e`, rồi đặt `done[s] = order.count`.\n- **Thứ tự trong một bước** quan trọng: (1) cập nhật `e` bằng `nums[r]` với các tiền tố `P[0…r]`; (2) tính `p = P[r+1]`; (3) truy vấn `min(first[p], e[p])`; (4) sau cùng mới thêm `P[r+1]` vào `first`/`order`. Thêm sớm hơn sẽ cho phép `l = r + 1`, tức mảng con rỗng.\n- Chuẩn hóa dư không âm bằng `((x % k) + k) % k` vì `nums` có số âm.\n- Test cục bộ: đối chiếu vét cạn trên 20.000 mảng ngẫu nhiên nhỏ, và chạy thử `n = 10⁵`, `k = 3000` để chắc không quá chậm."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [4, 1, 2]`, `k = 3`\n**Output:** `3`\n\nKhởi tạo: `first = [0, ∞, ∞]`, `order = [0]`, `e = [∞, ∞, ∞]`, `done = [0, 0, 0]`, `p = 0`.\n\n```\nr=0, x=4: s = 8 % 3 = 2\n   ghép với order[0..<1]:  u=0 → v=(0+2)%3=2 → e[2] = min(∞, first[0]=0) = 0\n   done[2] = 1\n   p = (0 + 4) % 3 = 1\n   l = min(first[1]=∞, e[1]=∞) = ∞ → chưa có mảng con hợp lệ kết thúc ở đây\n   first[1] = 1, order = [0, 1]\n\nr=1, x=1: s = 2 % 3 = 2\n   ghép với order[1..<2] (chỉ số dư MỚI, vì độ dịch 2 đã gặp):\n                           u=1 → v=(1+2)%3=0 → e[0] = min(∞, first[1]=1) = 1\n   done[2] = 2\n   p = (1 + 1) % 3 = 2\n   l = min(first[2]=∞, e[2]=0) = 0 → độ dài = 2 - 0 = 2 → best = 2\n   first[2] = 2, order = [0, 1, 2]\n\nr=2, x=2: s = 4 % 3 = 1\n   ghép với order[0..<3] (độ dịch 1 lần đầu xuất hiện):\n                           u=0 → v=1 → e[1] = 0\n                           u=1 → v=2 → e[2] = min(0, 1) = 0\n                           u=2 → v=0 → e[0] = min(1, 2) = 1\n   done[1] = 3\n   p = (2 + 2) % 3 = 1\n   l = min(first[1]=1, e[1]=0) = 0 → độ dài = 3 - 0 = 3 → best = 3\n```\n\nỞ `r = 2`: `first[1] = 1` ứng với mảng con `[1, 2]` (tổng 3, không cần đổi dấu, dài 2); `e[1] = 0` ứng với cả mảng `[4, 1, 2]` khi đổi dấu `2` (`4 + 1 - 2 = 3`, dài 3) — lấy `l` nhỏ hơn."}, {"title": "Ghi nhớ", "text": "Khi một phép cập nhật lặp lại chỉ phụ thuộc vào một cặp tham số rời rạc và dữ liệu nền chỉ **được thêm vào, không bị sửa**, hãy nhớ \"đã xử lý tới đâu\" cho từng tham số — tổng chi phí bị chặn bởi số cặp thay vì số bước. Và luôn nhìn ràng buộc: tham số nào nhỏ bất thường thì độ phức tạp được phép bình phương theo nó."}], "code": "class Solution {\n    func longestSubarray(_ nums: [Int], _ k: Int) -> Int {\n        let INF = Int.max\n\n        // first[u]: l nhỏ nhất có tổng tiền tố P[l] % k == u\n        var first = [Int](repeating: INF, count: k)\n        first[0] = 0\n        var order = [0]   // các số dư theo thứ tự xuất hiện lần đầu\n\n        // e[v]: l nhỏ nhất sao cho có i >= l (đã duyệt) với (P[l] + 2*nums[i]) % k == v\n        var e = [Int](repeating: INF, count: k)\n        // done[s]: với độ dịch s, đã ghép xong bao nhiêu phần tử đầu của order\n        var done = [Int](repeating: 0, count: k)\n\n        var p = 0, best = 0\n        for r in 0..<nums.count {\n            let s = ((2 * nums[r]) % k + k) % k\n\n            // ghép nums[r] với các số dư mới xuất hiện kể từ lần cuối gặp độ dịch s\n            for t in done[s]..<order.count {\n                let u = order[t]\n                let v = (u + s) % k\n                e[v] = min(e[v], first[u])\n            }\n            done[s] = order.count\n\n            p = ((p + nums[r]) % k + k) % k\n            let l = min(first[p], e[p])\n            if l != INF { best = max(best, r + 1 - l) }\n\n            if first[p] == INF {\n                first[p] = r + 1\n                order.append(p)\n            }\n        }\n        return best\n    }\n}\n"}, {"id": 4070, "category": "contests", "title": "Minimum Rotations to Dial a Number I", "slug": "minimum-rotations-to-dial-a-number-i", "difficulty": "Easy", "topics": ["Weekly Contest 522", "String", "Simulation"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Một mặt số tròn có các chữ số `0…9` xếp theo thứ tự (0 và 9 kề nhau), kim ban đầu ở `0`. Cho chuỗi `s` gồm 10 chữ số, phải lần lượt quay kim tới từng chữ số; mỗi lần quay dịch một vị trí theo chiều tùy ý. Tính tổng số lần quay ít nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Khoảng cách trên vòng tròn**: giữa hai vị trí `a`, `b` trên vòng có `m` điểm, có hai đường đi — xuôi dài `|a - b|` và ngược dài `m - |a - b|`. Khoảng cách ngắn nhất là `min(|a - b|, m - |a - b|)`.\n- **Mô phỏng**: các bước độc lập nhau — chọn đường ngắn cho bước này không ảnh hưởng tới bước sau, vì vị trí kết thúc của mỗi bước là cố định (chính là chữ số cần quay tới). Nên tham lam từng bước là tối ưu."}, {"title": "Hướng xử lý", "text": "1. Giữ vị trí hiện tại `cur`, bắt đầu từ `0`.\n2. Với mỗi chữ số `x` trong `s`: cộng `min(d, 10 - d)` với `d = |x - cur|`, rồi đặt `cur = x`."}, {"title": "Ý tưởng triển khai", "text": "- `Character.wholeNumberValue!` đổi ký tự chữ số thành `Int` — đề đảm bảo chỉ có chữ số nên force-unwrap thoải mái.\n- Không cần `Array(s)` vì chỉ duyệt tuần tự."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `s = \"0192837465\"`\n**Output:** `25`\n\n```\n0 → 0 : d = 0 → min(0, 10) = 0     tổng = 0\n0 → 1 : d = 1 → min(1, 9)  = 1     tổng = 1\n1 → 9 : d = 8 → min(8, 2)  = 2     tổng = 3    (quay ngược qua 0)\n9 → 2 : d = 7 → min(7, 3)  = 3     tổng = 6    (quay xuôi qua 0)\n2 → 8 : d = 6 → min(6, 4)  = 4     tổng = 10\n8 → 3 : d = 5 → min(5, 5)  = 5     tổng = 15\n3 → 7 : d = 4 → min(4, 6)  = 4     tổng = 19\n7 → 4 : d = 3 → min(3, 7)  = 3     tổng = 22\n4 → 6 : d = 2 → min(2, 8)  = 2     tổng = 24\n6 → 5 : d = 1 → min(1, 9)  = 1     tổng = 25\n```"}, {"title": "Ghi nhớ", "text": "Thấy \"vòng tròn\" + \"quay hai chiều\" → công thức `min(d, m - d)`. Đây là bài mở đầu cho bài II (4071), nơi công thức này được dùng lại."}], "code": "class Solution {\n    func minRotations(_ s: String) -> Int {\n        var cur = 0, res = 0\n        for c in s {\n            let d = abs(c.wholeNumberValue! - cur)\n            res += min(d, 10 - d)\n            cur = c.wholeNumberValue!\n        }\n        return res\n    }\n}\n"}, {"id": 4071, "category": "contests", "title": "Minimum Rotations to Dial a Number II", "slug": "minimum-rotations-to-dial-a-number-ii", "difficulty": "Medium", "topics": ["Weekly Contest 522", "String", "Math", "Enumeration"], "date": "2026-10-09", "time": "O(n)", "space": "O(n)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Giống bài I (mặt số tròn `0…9`, kim bắt đầu ở `0`), nhưng chuỗi `s` dài `n ≤ 10⁵` và trước khi quay được phép **đảo ngược một hậu tố** `s[k..n-1]` tối đa một lần. Tính tổng số lần quay ít nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Khoảng cách vòng tròn đối xứng**: `d(a, b) = d(b, a)`.\n- **Đảo một đoạn không đổi tổng chi phí bên trong đoạn**: chi phí của một đoạn là tổng `d` giữa các cặp kề nhau. Đảo đoạn chỉ đảo thứ tự các cặp đó, và vì `d` đối xứng nên tổng giữ nguyên.\n- **Phân tích đóng góp (delta)**: thay vì tính lại toàn bộ cho mỗi lựa chọn, tìm xem lựa chọn đó làm thay đổi **những số hạng nào** của tổng và chỉ tính phần chênh lệch."}, {"title": "Hướng xử lý", "text": "1. Thử mọi `k` và mô phỏng lại là `O(n²)` — quá chậm với `n = 10⁵`.\n2. Tách tổng chi phí thành ba phần khi đảo hậu tố từ `k`:\n   - Phần đầu `s[0..k-1]`: không đổi.\n   - Bên trong hậu tố: không đổi (lý do ở trên).\n   - **Bước nối** từ phần tử đứng trước hậu tố vào hậu tố: trước là `d(p, s[k])`, sau khi đảo thành `d(p, s[n-1])`, với `p = s[k-1]` (hoặc `0` — vị trí ban đầu của kim — khi `k = 0`).\n3. Vậy `cost(k) = total - d(p, s[k]) + d(p, s[n-1])`. Tính `total` một lần rồi duyệt mọi `k` trong `O(n)`.\n4. Trường hợp \"không đảo\" tự được tính: `k = n - 1` cho đúng `total`."}, {"title": "Ý tưởng triển khai", "text": "- `a = s.map { $0.wholeNumberValue! }` để có mảng số.\n- Hàm lồng `d(x, y)` cho khoảng cách vòng.\n- Một vòng tính `total`, một vòng lấy `min` theo công thức delta.\n- Test cục bộ đối chiếu với cách vét cạn (đảo thật rồi mô phỏng) trên chuỗi ngẫu nhiên ngắn."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 4`, `s = \"1502\"`\n**Output:** `9`\n\nBước 1 — chi phí khi không đảo:\n\n```\n0 → 1 : 1\n1 → 5 : 4\n5 → 0 : 5\n0 → 2 : 2\ntotal = 12\n```\n\nBước 2 — thử từng `k`, chỉ tính phần chênh lệch ở bước nối. Chữ số cuối là `s[3] = 2`:\n\n```\nk=0: p=0 (kim ban đầu)  12 - d(0,1) + d(0,2) = 12 - 1 + 2 = 13    chuỗi thành \"2051\"\nk=1: p=1                12 - d(1,5) + d(1,2) = 12 - 4 + 1 = 9     chuỗi thành \"1205\"  ← nhỏ nhất\nk=2: p=5                12 - d(5,0) + d(5,2) = 12 - 5 + 3 = 10    chuỗi thành \"1520\"\nk=3: p=0                12 - d(0,2) + d(0,2) = 12                 không đổi gì\nbest = 9\n```\n\nKiểm tra lại `k = 1` bằng mô phỏng `\"1205\"`: `0→1` (1) + `1→2` (1) + `2→0` (2) + `0→5` (5) = 9."}, {"title": "Ghi nhớ", "text": "\"Được làm một thao tác tối đa một lần\" → hỏi: thao tác đó thay đổi **bao nhiêu số hạng** của hàm mục tiêu? Thường chỉ một vài số hạng ở biên, nên mỗi lựa chọn tính được trong `O(1)`. Đảo đoạn + chi phí đối xứng giữa các phần tử kề = chỉ biên thay đổi (cùng ý tưởng với 2-opt trong bài người du lịch)."}], "code": "class Solution {\n    func minRotations(_ n: Int, _ s: String) -> Int {\n        let a = s.map { $0.wholeNumberValue! }\n\n        func d(_ x: Int, _ y: Int) -> Int {\n            let t = abs(x - y)\n            return min(t, 10 - t)\n        }\n\n        var total = 0, prev = 0\n        for x in a {\n            total += d(prev, x)\n            prev = x\n        }\n\n        // đảo đuôi từ k: chỉ có bước nối vào đuôi là đổi\n        var best = total\n        for k in 0..<n {\n            let p = k > 0 ? a[k - 1] : 0\n            best = min(best, total - d(p, a[k]) + d(p, a[n - 1]))\n        }\n        return best\n    }\n}\n"}, {"id": 4072, "category": "contests", "title": "Maximum Alternating Subarray Sum With One Deletion", "slug": "maximum-alternating-subarray-sum-with-one-deletion", "difficulty": "Medium", "topics": ["Weekly Contest 522", "Array", "Dynamic Programming"], "date": "2026-10-09", "time": "O(n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng `nums`. Được xóa tối đa một phần tử, sau đó chọn một mảng con (liên tiếp) của mảng còn lại. Tổng đan dấu của mảng con là `b[0] - b[1] + b[2] - …` (đánh số lại từ 0). Tìm tổng đan dấu lớn nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Kadane mở rộng**: bài \"mảng con có tổng lớn nhất\" giải bằng DP `best[i]` = tổng lớn nhất của mảng con **kết thúc tại** `i`. Khi bài có thêm ràng buộc, ta thêm chiều trạng thái thay vì đổi thuật toán.\n- **DP theo trạng thái (state machine DP)**: mỗi trạng thái ghi lại đúng những gì cần biết để đi tiếp. Ở đây cần hai thông tin:\n   - **Dấu** của phần tử cuối (`+` hay `-`), vì nó quyết định dấu của phần tử kế tiếp.\n   - **Đã dùng quyền xóa chưa** (0 hoặc 1).\n- Cùng họ với bài 1186 (Maximum Subarray Sum with One Deletion) và 1911 (Maximum Alternating Subsequence Sum)."}, {"title": "Hướng xử lý", "text": "Gọi các trạng thái tại vị trí `i` (mảng con bắt buộc kết thúc ở `nums[i]`):\n- `p0` / `m0`: chưa xóa, phần tử cuối mang dấu `+` / `-`.\n- `p1` / `m1`: đã xóa một phần tử, phần tử cuối mang dấu `+` / `-`.\n\nChuyển trạng thái với `x = nums[i]`:\n1. `p0 = max(x, m0_trước + x)` — bắt đầu mảng con mới tại `x`, hoặc nối sau một phần tử mang dấu `-`.\n2. `m0 = p0_trước - x`.\n3. `p1 = max(m1_trước, m0_trước_nữa) + x` — hoặc đã xóa từ trước rồi nối bình thường, hoặc **xóa ngay phần tử `i - 1`** và nối `x` vào mảng con kết thúc ở `i - 2`.\n4. `m1 = max(p1_trước, p0_trước_nữa) - x` — tương tự.\n\nChỉ cần xét việc xóa phần tử **nằm giữa** mảng con: xóa ở ngoài hoặc ở hai đầu không khác gì chọn mảng con khác mà không xóa.\n\nĐáp án là giá trị lớn nhất của cả bốn trạng thái trên mọi vị trí."}, {"title": "Ý tưởng triển khai", "text": "- Sáu biến vô hướng: bốn trạng thái hiện tại và `pp0`, `pm0` là `p0`, `m0` của vị trí trước đó nữa.\n- `NEG = Int.min / 2` làm \"âm vô cùng\" — chia đôi để cộng trừ thêm không bị tràn (Swift crash khi tràn số).\n- Tính bốn giá trị mới vào biến tạm rồi mới gán, tránh dùng nhầm giá trị đã cập nhật.\n- Test cục bộ đối chiếu với vét cạn (thử xóa từng phần tử, thử mọi mảng con) trên 5000 mảng ngẫu nhiên."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [10, -5, -100]`\n**Output:** `110` (xóa `-5`, chọn `[10, -100]` → `10 - (-100)`)\n\nKý hiệu `-∞` là \"chưa có trạng thái\". `pp0`, `pm0` là `p0`, `m0` của vị trí trước đó nữa.\n\n```\nKhởi tạo: p0 = m0 = p1 = m1 = -∞, pp0 = pm0 = -∞\n\nx = 10:\n   p0 = max(10, m0 + 10)        = 10      mảng con [10]\n   m0 = p0_cũ - 10              = -∞\n   p1 = max(m1, pm0) + 10       = -∞\n   m1 = max(p1, pp0) - 10       = -∞\n   best = 10\n\nx = -5:   (pp0 = -∞, pm0 = -∞ lấy từ trước bước x = 10)\n   p0 = max(-5, m0 + (-5))      = -5      mảng con [-5]\n   m0 = p0_cũ - (-5) = 10 + 5   = 15      mảng con [10, -5]\n   p1 = max(m1, pm0) + (-5)     = -∞\n   m1 = max(p1, pp0) - (-5)     = -∞\n   best = 15\n\nx = -100: (pp0 = 10, pm0 = -∞ là p0, m0 sau bước x = 10)\n   p0 = max(-100, 15 - 100)     = -85     mảng con [10, -5, -100]\n   m0 = -5 + 100                = 95      mảng con [-5, -100]\n   p1 = max(m1, pm0) - 100      = -∞\n   m1 = max(p1, pp0) + 100      = 10 + 100 = 110   xóa -5, nối -100 sau [10]\n   best = 110\n```\n\n**Input:** `nums = [5, -5, 1]` → **Output:** `11` — không xóa gì: `5 - (-5) + 1`, đến từ trạng thái `p0` ở bước cuối (`m0 + 1 = 10 + 1`)."}, {"title": "Ghi nhớ", "text": "\"Mảng con tối ưu + được phép làm X tối đa một lần\" → Kadane với thêm một chiều \"đã dùng X chưa\". Khi thao tác là *xóa*, nhớ trạng thái của vị trí `i - 2` để nối qua phần tử bị xóa."}], "code": "class Solution {\n    func maxAlternatingSum(_ nums: [Int]) -> Int {\n        let NEG = Int.min / 2\n\n        // p: phần tử cuối mang dấu +, m: mang dấu -\n        // 0: chưa xóa, 1: đã xóa 1 phần tử\n        var p0 = NEG, m0 = NEG, p1 = NEG, m1 = NEG\n        // p0, m0 của vị trí trước đó nữa (dùng khi xóa phần tử ngay trước)\n        var pp0 = NEG, pm0 = NEG\n        var best = NEG\n\n        for x in nums {\n            let np0 = max(x, m0 + x)\n            let nm0 = p0 - x\n            let np1 = max(m1, pm0) + x\n            let nm1 = max(p1, pp0) - x\n\n            pp0 = p0\n            pm0 = m0\n            p0 = np0\n            m0 = nm0\n            p1 = np1\n            m1 = nm1\n\n            best = max(best, p0, m0, p1, m1)\n        }\n        return best\n    }\n}\n"}, {"id": 4073, "category": "contests", "title": "Count Good Strings", "slug": "count-good-strings", "difficulty": "Hard", "topics": ["Weekly Contest 522", "Math", "Combinatorics", "Fibonacci", "Fast Doubling"], "date": "2026-10-09", "time": "O(log n)", "space": "O(log n) (ngăn xếp đệ quy)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Một chuỗi chỉ gồm `a`, `b` là *good* nếu: (1) nó chỉ có một loại ký tự và độ dài lẻ; hoặc (2) nó ghép được từ hai chuỗi good khác rỗng `s1 + s2` mà ký tự cuối của `s1` khác ký tự đầu của `s2`. Đếm số chuỗi good độ dài `n` (`n ≤ 10¹⁵`), lấy dư cho `10⁹ + 7`."}, {"title": "Cơ sở lý thuyết", "text": "- **Đoạn chạy (run)**: một dãy tối đa các ký tự giống nhau liên tiếp. Mọi chuỗi nhị phân được xác định duy nhất bởi ký tự đầu và dãy độ dài các run.\n- **Hợp số (composition)**: cách viết `n` thành tổng **có thứ tự** của các số nguyên dương. Kết quả kinh điển: số hợp số của `n` chỉ gồm các **số lẻ** bằng số Fibonacci `F(n)` (với `F(1) = F(2) = 1`).\n- **Fast doubling** tính `F(n)` trong `O(log n)` nhờ hai đẳng thức:\n   - `F(2k) = F(k) · (2·F(k+1) − F(k))`\n   - `F(2k+1) = F(k)² + F(k+1)²`\n- **Số học modulo**: với `M ≈ 10⁹`, tích hai số nhỏ hơn `M` nhỏ hơn `10¹⁸`, vẫn vừa `Int` 64 bit (`≈ 9.2 × 10¹⁸`)."}, {"title": "Hướng xử lý", "text": "1. **Đơn giản hóa định nghĩa.** Quy tắc (2) chỉ cho cắt ở chỗ hai ký tự kề nhau khác nhau — tức **ranh giới giữa hai run**. Cắt đệ quy tới cùng, mỗi mảnh cơ sở là một run nguyên vẹn và theo quy tắc (1) phải có độ dài lẻ. Ngược lại, chuỗi nào có mọi run lẻ thì cứ tách run đầu ra là chứng minh được nó good bằng quy nạp. Vậy:\n\n   **good ⟺ mọi run đều có độ dài lẻ.**\n2. **Đếm.** Chọn ký tự đầu (2 cách), rồi chọn dãy độ dài các run — một hợp số của `n` thành các số lẻ. Đáp án là `2 · F(n)`.\n3. **Vì sao là Fibonacci:** gọi `c(n)` là số hợp số lẻ của `n`. Phần tử đầu là `1` (còn `c(n-1)` cách), hoặc lớn hơn `1` — khi đó trừ nó đi `2` vẫn là số lẻ dương, cho một hợp số lẻ của `n - 2` (`c(n-2)` cách). Nên `c(n) = c(n-1) + c(n-2)`.\n4. **Kiểm tra với ví dụ:** `n = 2 → 2·1 = 2`, `n = 3 → 2·2 = 4`, `n = 4 → 2·3 = 6`. Khớp.\n5. `n` tới `10¹⁵` nên không lặp tuyến tính được → fast doubling (hoặc lũy thừa ma trận `2×2`)."}, {"title": "Ý tưởng triển khai", "text": "- `fib(n)` đệ quy trả về cặp `(F(n), F(n+1))`: gọi `fib(n / 2)` lấy `(a, b)`, tính `c = F(2k)`, `d = F(2k+1)`; nếu `n` chẵn trả `(c, d)`, lẻ trả `(d, c + d)`.\n- `2 * b - a + M` trước khi `% M` để không ra số âm.\n- Độ sâu đệ quy chỉ khoảng `log₂(10¹⁵) ≈ 50`.\n- Test cục bộ: hàm `good` viết đúng theo định nghĩa đệ quy của đề, vét cạn mọi chuỗi độ dài `≤ 14` để xác nhận công thức `2·F(n)`; rồi đối chiếu fast doubling với vòng lặp thường tới `n = 5000`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `n = 4`\n**Output:** `6`\n\nCách nhìn tổ hợp — các cách viết 4 thành tổng có thứ tự của số lẻ, mỗi cách cho 2 chuỗi (bắt đầu bằng `a` hoặc `b`):\n\n```\n1 + 3         → \"abbb\", \"baaa\"\n3 + 1         → \"aaab\", \"bbba\"\n1 + 1 + 1 + 1 → \"abab\", \"baba\"\n→ F(4) = 3 cách × 2 = 6\n```\n\nFast doubling tính `F(4)` — `fib(n)` trả về `(F(n), F(n+1))`:\n\n```\nfib(4) gọi fib(2) gọi fib(1) gọi fib(0)\n\nfib(0) = (0, 1)\nfib(1): a=0, b=1 → c = 0·(2·1 - 0) = 0, d = 0² + 1² = 1 → n lẻ  → (d, c+d) = (1, 1)\nfib(2): a=1, b=1 → c = 1·(2·1 - 1) = 1, d = 1² + 1² = 2 → n chẵn → (c, d)   = (1, 2)\nfib(4): a=1, b=2 → c = 1·(2·2 - 1) = 3, d = 1² + 2² = 5 → n chẵn → (c, d)   = (3, 5)\n\nĐáp án = 2 · F(4) = 2 · 3 = 6\n```\n\nChỉ 4 lần gọi cho `n = 4`; với `n = 10¹⁵` cũng chỉ khoảng 50 lần.\n\n**Input:** `n = 3` → **Output:** `4` (`F(3) = 2`: các cách `3` và `1+1+1` → `\"aaa\"`, `\"bbb\"`, `\"aba\"`, `\"bab\"`)."}, {"title": "Ghi nhớ", "text": "Bài đếm với `n` khổng lồ (`10¹⁵`, `10¹⁸`) → đáp án gần như chắc chắn là một công thức đóng hoặc truy hồi tuyến tính tính bằng lũy thừa nhanh. Cách tìm: viết vét cạn cho `n` nhỏ, nhìn dãy số (`2, 2, 4, 6, 10, 16…` — Fibonacci nhân đôi), rồi mới chứng minh. Định nghĩa đệ quy rắc rối thường rút gọn được thành một tính chất cấu trúc đơn giản."}], "code": "class Solution {\n    let M = 1_000_000_007\n\n    // trả về (F(n), F(n+1))\n    func fib(_ n: Int) -> (Int, Int) {\n        if n == 0 { return (0, 1) }\n        let (a, b) = fib(n / 2)\n        let c = a * ((2 * b - a + M) % M) % M   // F(2k)\n        let d = (a * a + b * b) % M             // F(2k+1)\n        return n % 2 == 0 ? (c, d) : (d, (c + d) % M)\n    }\n\n    func countGoodStrings(_ n: Int) -> Int {\n        return 2 * fib(n).0 % M\n    }\n}\n"}, {"id": 4074, "category": "contests", "title": "Maximum Product Pair With Target Sum", "slug": "maximum-product-pair-with-target-sum", "difficulty": "Easy", "topics": ["Biweekly Contest 193", "Array", "Enumeration"], "date": "2026-10-11", "time": "O(n²)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng `nums` (`n ≤ 100`) và số `target`. Cặp chỉ số khác nhau `(i, j)` hợp lệ nếu `nums[i] + nums[j] == target` và `nums[i] > nums[j]`. Trả về cặp hợp lệ có tích `nums[i] * nums[j]` lớn nhất, không có thì trả `[-1, -1]`."}, {"title": "Cơ sở lý thuyết", "text": "- **Vét cạn (brute force)**: khi ràng buộc nhỏ (`n ≤ 100` → `10⁴` cặp), thử hết mọi khả năng là cách đúng và nhanh nhất để viết. Đọc ràng buộc trước khi nghĩ thuật toán.\n- **Cặp có thứ tự**: điều kiện `nums[i] > nums[j]` làm `(i, j)` khác `(j, i)`, nên phải duyệt cả hai chiều chứ không chỉ `j > i`.\n- Ghi chú toán: với tổng cố định `a + b = T`, tích `a·b` lớn nhất khi `a`, `b` gần nhau nhất. Dùng được để tối ưu, nhưng ở đây không cần."}, {"title": "Hướng xử lý", "text": "1. Hai vòng lặp `i`, `j` trên toàn bộ mảng.\n2. Với mỗi cặp: kiểm tra tổng bằng `target` và `nums[i] > nums[j]`; nếu tích lớn hơn tích tốt nhất hiện có thì ghi lại.\n3. Không cần kiểm tra `i != j` riêng: khi `i == j` thì `nums[i] > nums[j]` sai."}, {"title": "Ý tưởng triển khai", "text": "- `best = Int.min` để tích âm cũng được nhận (ví dụ 2 có đáp án với tích `-2`).\n- `res` khởi tạo `[-1, -1]`, chỉ đổi khi tìm được cặp hợp lệ.\n- So sánh `>` chặt: nhiều cặp cùng tích thì giữ cặp gặp đầu tiên — đề cho phép trả cặp nào cũng được."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [1, 2, 3, 4]`, `target = 5`\n**Output:** `[2, 1]`\n\n```\ni=0 (1): j=3 (4): tổng 5 nhưng 1 > 4 sai            → bỏ\ni=1 (2): j=2 (3): tổng 5 nhưng 2 > 3 sai            → bỏ\ni=2 (3): j=1 (2): tổng 5, 3 > 2 ✓, tích 6 > -∞      → best = 6, res = [2, 1]\ni=3 (4): j=0 (1): tổng 5, 4 > 1 ✓, tích 4 > 6 sai   → giữ nguyên\nKết quả: [2, 1]\n```\n\n**Input:** `nums = [-3, -1, 4, 2]`, `target = 1`\n**Output:** `[3, 1]`\n\n```\ni=2 (4): j=0 (-3): tổng 1, 4 > -3 ✓, tích -12 > -∞  → best = -12, res = [2, 0]\ni=3 (2): j=1 (-1): tổng 1, 2 > -1 ✓, tích -2 > -12  → best = -2,  res = [3, 1]\n```\n\n**Input:** `nums = [3, 3, 5]`, `target = 6` → **Output:** `[-1, -1]` (cặp `3 + 3` có tổng đúng nhưng `3 > 3` sai)."}, {"title": "Ghi nhớ", "text": "Bài Q1 của contest gần như luôn vét cạn được — nhìn ràng buộc rồi viết thẳng. Cẩn thận hai chỗ: giá trị khởi tạo của \"tốt nhất\" khi đáp án có thể âm, và cặp có thứ tự hay không."}], "code": "class Solution {\n    func maxProductPair(_ nums: [Int], _ target: Int) -> [Int] {\n        var res = [-1, -1]\n        var best = Int.min\n\n        for i in 0..<nums.count {\n            for j in 0..<nums.count {\n                if nums[i] + nums[j] == target && nums[i] > nums[j] && nums[i] * nums[j] > best {\n                    best = nums[i] * nums[j]\n                    res = [i, j]\n                }\n            }\n        }\n        return res\n    }\n}\n"}, {"id": 4075, "category": "contests", "title": "Longest Resilient Subarray I", "slug": "longest-resilient-subarray-i", "difficulty": "Medium", "topics": ["Biweekly Contest 193", "Array", "Math", "Enumeration"], "date": "2026-10-11", "time": "O(n²)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho mảng số dương `nums` (`n ≤ 2500`) và `k`. Một mảng con là *resilient* nếu xóa **bất kỳ** phần tử nào của nó thì tổng phần còn lại vẫn chia hết cho `k` (mảng con dài 1 luôn thỏa). Tìm độ dài mảng con resilient dài nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Đồng dư**: `a ≡ b (mod k)` khi `a - b` chia hết cho `k`.\n- **Biến điều kiện \"với mọi phần tử\" thành điều kiện cấu trúc**: gọi tổng mảng con là `S`. Yêu cầu `S - x ≡ 0` với mọi `x` trong mảng con nghĩa là mọi `x ≡ S (mod k)` — tức **mọi phần tử có cùng số dư** `r` khi chia cho `k`.\n- Khi mọi phần tử cùng dư `r` và mảng con dài `L`: `S ≡ L·r`, bỏ một phần tử còn `(L - 1)·r`. Vậy điều kiện là **`(L - 1)·r ≡ 0 (mod k)`**."}, {"title": "Hướng xử lý", "text": "1. Từ định nghĩa suy ra hai điều kiện cần và đủ: (a) mọi phần tử cùng số dư `r`; (b) `(L - 1)·r` chia hết cho `k`.\n2. `n ≤ 2500` nên thử mọi điểm đầu `l` rồi mở rộng `r` là đủ (`≈ 6 × 10⁶` bước).\n3. Cố định `l`, lấy `r0 = nums[l] % k`. Mở rộng sang phải; gặp phần tử khác số dư thì dừng hẳn (mọi đoạn dài hơn đều hỏng điều kiện a).\n4. Ở mỗi độ dài `len`, nếu `(len - 1)·r0 % k == 0` thì cập nhật đáp án. Không dừng khi điều kiện (b) sai — độ dài lớn hơn vẫn có thể thỏa."}, {"title": "Ý tưởng triển khai", "text": "- `best = 1` ngay từ đầu vì mảng con dài 1 luôn hợp lệ.\n- Không cần tính tổng thật: chỉ cần `len` và `r0`.\n- `(len - 1) * r0` tối đa cỡ `2500 × 10⁵`, không lo tràn.\n- Test cục bộ đối chiếu với vét cạn làm đúng theo định nghĩa (thử xóa từng phần tử) trên 8000 mảng ngẫu nhiên."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [5, 5, 4, 8]`, `k = 4`\n**Output:** `2`\n\nSố dư của từng phần tử: `[1, 1, 0, 0]`.\n\n```\nl=0, r0=1: r=0 → len=1: (0·1) % 4 = 0 ✓ → best = 1\n           r=1 → dư 1 ✓, len=2: (1·1) % 4 = 1 ✗\n           r=2 → dư 0 ≠ 1 → dừng\nl=1, r0=1: r=1 → len=1 ✓\n           r=2 → dư 0 ≠ 1 → dừng\nl=2, r0=0: r=2 → len=1 ✓\n           r=3 → dư 0 ✓, len=2: (1·0) % 4 = 0 ✓ → best = 2\nl=3, r0=0: r=3 → len=1 ✓\nKết quả: 2   (mảng con [4, 8]: xóa 4 còn 8, xóa 8 còn 4)\n```\n\n**Input:** `nums = [1, 4, 7, 1]`, `k = 3` → **Output:** `4`\n\n```\nSố dư: [1, 1, 1, 1], l=0, r0=1\nlen=1: 0 % 3 = 0 ✓ · len=2: 1 % 3 ✗ · len=3: 2 % 3 ✗ · len=4: 3 % 3 = 0 ✓ → best = 4\n```\n\nVí dụ này cho thấy vì sao không được dừng khi điều kiện (b) sai ở `len = 2`."}, {"title": "Ghi nhớ", "text": "Điều kiện dạng \"với **mọi** phần tử bị xóa/đổi, tính chất vẫn giữ\" thường ép các phần tử phải giống nhau theo một nghĩa nào đó (ở đây: cùng số dư). Viết điều kiện cho hai phần tử bất kỳ rồi trừ vế cho nhau là thấy ngay. Bản II (`n = 10⁵`) dùng đúng nhận xét này nhưng tính trực tiếp trên từng đoạn."}], "code": "class Solution {\n    func resilientSubarray(_ nums: [Int], _ k: Int) -> Int {\n        let n = nums.count\n        var best = 1\n\n        for l in 0..<n {\n            let r0 = nums[l] % k\n            var len = 0\n            // mọi phần tử trong đoạn phải cùng số dư r0\n            for r in l..<n {\n                if nums[r] % k != r0 { break }\n                len += 1\n                // tổng ≡ len * r0, bỏ 1 phần tử còn (len - 1) * r0\n                if (len - 1) * r0 % k == 0 {\n                    best = max(best, len)\n                }\n            }\n        }\n        return best\n    }\n}\n"}, {"id": 4076, "category": "contests", "title": "Longest Resilient Subarray II", "slug": "longest-resilient-subarray-ii", "difficulty": "Medium", "topics": ["Biweekly Contest 193", "Array", "Math", "Number Theory"], "date": "2026-10-11", "time": "O(n + log k mỗi đoạn)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Giống bài I: mảng con là *resilient* nếu xóa bất kỳ phần tử nào thì tổng phần còn lại vẫn chia hết cho `k`; tìm độ dài lớn nhất. Khác ở ràng buộc `n ≤ 10⁵`."}, {"title": "Cơ sở lý thuyết", "text": "- Kết quả từ bài I: mảng con dài `L` là resilient ⟺ mọi phần tử cùng số dư `r` (mod `k`) **và** `(L - 1)·r ≡ 0 (mod k)`.\n- **Phương trình đồng dư tuyến tính** `t·r ≡ 0 (mod k)`: nghiệm là mọi `t` chia hết cho `g = k / gcd(r, k)`. Lý do: chia cả hai vế cho `gcd(r, k)`, phần còn lại của `r` nguyên tố cùng nhau với `k / gcd` nên `t` phải gánh hết thừa số đó.\n- **Thuật toán Euclid** tính `gcd` trong `O(log)`. Quy ước `gcd(0, k) = k` → khi `r = 0` thì `g = 1`, mọi độ dài đều được.\n- **Chia mảng thành các đoạn chạy (run)** tối đa có cùng tính chất, duyệt bằng hai con trỏ trong `O(n)`."}, {"title": "Hướng xử lý", "text": "1. `O(n²)` của bài I không qua được `n = 10⁵`.\n2. Vì mọi phần tử phải cùng số dư, mảng con resilient luôn nằm trọn trong một **đoạn chạy cùng số dư**. Tách mảng thành các đoạn chạy như vậy.\n3. Với đoạn chạy dài `m`, số dư `r`: mọi mảng con độ dài `L ≤ m` bên trong đều cùng số dư, nên chỉ cần tìm `L` lớn nhất với `L - 1` là bội của `g = k / gcd(r, k)`.\n4. `L - 1` lớn nhất không vượt `m - 1` và chia hết cho `g` là `⌊(m - 1) / g⌋ · g`. Vậy `L = 1 + (m - 1) / g * g`.\n5. Đáp án là giá trị lớn nhất trên mọi đoạn chạy."}, {"title": "Ý tưởng triển khai", "text": "- Hai con trỏ `i`, `j`: `j` chạy tới hết đoạn cùng số dư với `nums[i]`, rồi `i = j`.\n- `gcd` đệ quy một dòng; `gcd(0, k)` trả `k` đúng như cần.\n- `(m - 1) / g * g` dùng phép chia nguyên của Swift để làm tròn xuống bội của `g`.\n- Test cục bộ: đối chiếu vét cạn theo định nghĩa trên 8000 mảng ngẫu nhiên, và chạy thử `n = 10⁵`."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `nums = [2, 4, 6, 3]`, `k = 2`\n**Output:** `3`\n\n```\nSố dư: [0, 0, 0, 1]\nĐoạn 1: i=0, j=3 → r=0, m=3 → g = 2 / gcd(0, 2) = 2 / 2 = 1 → L = 1 + (2 / 1)·1 = 3 → best = 3\nĐoạn 2: i=3, j=4 → r=1, m=1 → g = 2 / gcd(1, 2) = 2       → L = 1 + (0 / 2)·2 = 1\nKết quả: 3\n```\n\n**Input:** `nums = [1, 4, 7, 1]`, `k = 3`\n**Output:** `4`\n\n```\nSố dư: [1, 1, 1, 1]\nĐoạn 1: r=1, m=4 → g = 3 / gcd(1, 3) = 3 → L = 1 + (3 / 3)·3 = 4\n```\n\n**Input:** `nums = [2, 2, 2, 2, 2, 2]`, `k = 4` — ca mà đáp án ngắn hơn cả đoạn chạy\n**Output:** `5`\n\n```\nSố dư: [2, 2, 2, 2, 2, 2]\nĐoạn 1: r=2, m=6 → g = 4 / gcd(2, 4) = 2 → L = 1 + (5 / 2)·2 = 1 + 4 = 5\nKiểm tra: 5 số 2, bỏ một số còn 8 → chia hết cho 4 ✓\n          6 số 2, bỏ một số còn 10 → không chia hết ✗\n```"}, {"title": "Ghi nhớ", "text": "Bản \"II\" của một bài thường yêu cầu thay vòng lặp thử từng độ dài bằng một **công thức đóng**. Gặp `t·r ≡ 0 (mod k)` thì nhớ ngay: `t` là bội của `k / gcd(r, k)`."}], "code": "class Solution {\n    func gcd(_ a: Int, _ b: Int) -> Int {\n        return b == 0 ? a : gcd(b, a % b)\n    }\n\n    func resilientSubarray(_ nums: [Int], _ k: Int) -> Int {\n        let n = nums.count\n        var best = 1\n        var i = 0\n\n        while i < n {\n            // đoạn dài nhất [i, j) có cùng số dư r\n            let r = nums[i] % k\n            var j = i\n            while j < n && nums[j] % k == r { j += 1 }\n            let m = j - i\n\n            // cần (L - 1) * r chia hết cho k  <=>  L - 1 là bội của g\n            let g = k / gcd(r, k)\n            best = max(best, 1 + (m - 1) / g * g)\n\n            i = j\n        }\n        return best\n    }\n}\n"}, {"id": 4077, "category": "contests", "title": "Minimize Inversions in a Prefix Tree", "slug": "minimize-inversions-in-a-prefix-tree", "difficulty": "Hard", "topics": ["Biweekly Contest 193", "Trie", "Bitmask DP", "Divide and Conquer", "DFS"], "date": "2026-10-11", "time": "O(n · độ sâu · log n + Σ 2^m · m) với m ≤ 10 là số con của một nút", "space": "O(số nút của cây + 2^m · m)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho `n ≤ 10⁴` từ khác nhau (chỉ gồm chữ `a…j`, dài tối đa 20) và hoán vị `target`. Dựng cây tiền tố (trie); nút ứng với từ `words[i]` được đánh dấu `i`. Được tự chọn thứ tự các con của mỗi nút. Duyệt tiền thứ tự (ghi nút trước, rồi tới các con) cho ra một dãy chỉ số; đếm số nghịch thế của dãy đó theo vị trí trong `target`. Tìm số nghịch thế nhỏ nhất."}, {"title": "Cơ sở lý thuyết", "text": "- **Trie (cây tiền tố)**: mỗi nút là một tiền tố, cạnh là một ký tự. Bảng chữ cái chỉ có 10 chữ → mỗi nút tối đa **10 con**.\n- **Nghịch thế (inversion)**: cặp vị trí `a < b` mà giá trị ở `a` lớn hơn ở `b`.\n- **Phân rã nghịch thế theo cây**: trong duyệt tiền thứ tự, mỗi cây con chiếm một **đoạn liên tiếp**. Một cặp phần tử bất kỳ thuộc đúng một trong ba loại, và ba loại này **độc lập** với nhau:\n   1. Nút tổ tiên và nút con cháu: tổ tiên luôn đứng trước → số nghịch thế **cố định**, không phụ thuộc lựa chọn nào.\n   2. Hai nút ở hai nhánh con khác nhau của cùng một nút `u`: chỉ phụ thuộc **thứ tự các con của `u`**.\n   3. Hai nút trong cùng một nhánh con: thuộc bài toán con, giải đệ quy.\n- **Bitmask DP trên hoán vị**: tìm thứ tự tốt nhất của `m` phần tử khi chi phí là tổng trên các cặp (i đứng trước j tốn `inv[i][j]`). `dp[mask]` = chi phí nhỏ nhất khi tập `mask` được xếp ở đầu. `O(2^m · m)` thay cho `m!`.\n- Không dùng tham lam \"so từng cặp nhánh\" được: quan hệ \"nên đứng trước\" giữa các nhánh có thể tạo vòng (A trước B, B trước C, C trước A), nên phải DP."}, {"title": "Hướng xử lý", "text": "1. Đổi `target` thành `pos[i]` = vị trí của chỉ số `i`. Từ đây mỗi từ chỉ là một con số `pos`, và ta đếm nghịch thế trên các số đó.\n2. Dựng trie, lưu `pos` của từ tại nút kết thúc.\n3. DFS hậu thứ tự, mỗi nút trả về danh sách `pos` **đã sắp xếp** của cả cây con.\n4. Tại nút `u` có `m ≥ 2` nhánh con:\n   - Với mỗi cặp nhánh `(i, j)`, đếm `inv[i][j]` = số cặp `(x ∈ i, y ∈ j)` có `x > y` bằng hai con trỏ trên hai danh sách đã sắp. Chiều ngược lại là `|i|·|j| - inv[i][j]` (các `pos` đôi một khác nhau).\n   - Chạy bitmask DP để tìm thứ tự các nhánh có tổng nhỏ nhất, cộng vào đáp án.\n5. Nếu `u` là một từ: nó đứng trước toàn bộ cây con, nên cộng số phần tử trong cây con có `pos` nhỏ hơn `pos` của `u` (loại 1).\n6. Tổng của mọi nút là đáp án."}, {"title": "Ý tưởng triển khai", "text": "- Trie bằng mảng: `kids[u]` là mảng 10 ô (`-1` nếu không có con), `mark[u]` là `pos` hoặc `-1`. Không cần class nút.\n- `cross(a, b)`: duyệt `x` trong `a` tăng dần, con trỏ `j` trong `b` chỉ tiến; `j` chính là số phần tử của `b` nhỏ hơn `x`.\n- Tăng tốc DP: `w[c][mask]` = tổng `inv[i][c]` với `i ∈ mask`, tính dần nhờ bit thấp nhất: `w[c][mask] = w[c][mask bỏ bit thấp nhất] + inv[bit thấp nhất][c]`. Khi đó `dp[mask] = min(dp[mask bỏ c] + w[c][mask bỏ c])`.\n- Gộp danh sách con bằng `flatMap` rồi `sorted()` cho đơn giản; mỗi từ nằm trong tối đa 20 danh sách (độ sâu ≤ 20) nên tổng chi phí vẫn nhỏ.\n- Đệ quy sâu tối đa 20, không lo tràn ngăn xếp.\n- Test cục bộ: vét cạn sinh **mọi** thứ tự duyệt có thể của cây trên 1500 bộ từ ngẫu nhiên nhỏ; và chạy thử cây 10 nhánh đầy đủ sâu 4 (`10⁴` từ)."}, {"title": "Ví dụ chạy từng bước", "text": "**Input:** `words = [\"bad\", \"bag\", \"fig\", \"fed\"]`, `target = [3, 1, 0, 2]`\n**Output:** `2`\n\nĐổi sang vị trí: `pos[3] = 0`, `pos[1] = 1`, `pos[0] = 2`, `pos[2] = 3`, tức:\n\n```\n\"bad\" → 2     \"bag\" → 1     \"fig\" → 3     \"fed\" → 0\n```\n\nCây tiền tố:\n\n```\n(gốc)\n├── b ── a ──┬── d   \"bad\" (2)\n│            └── g   \"bag\" (1)\n└── f ──┬── i ── g   \"fig\" (3)\n        └── e ── d   \"fed\" (0)\n```\n\nDFS từ dưới lên:\n\n```\nNút \"ba\": 2 nhánh  d = [2],  g = [1]\n   d trước g: cặp (2, 1) có 2 > 1 → 1 nghịch thế\n   g trước d: 1·1 - 1             → 0 nghịch thế   ← chọn\n   cộng 0, trả về [1, 2]\nNút \"b\":  1 nhánh → không có gì để chọn, trả về [1, 2]\n\nNút \"f\":  2 nhánh  e = [0],  i = [3]\n   e trước i: cặp (0, 3) → 0 nghịch thế            ← chọn\n   i trước e: 1\n   cộng 0, trả về [0, 3]\n\nNút gốc:  2 nhánh  b = [1, 2],  f = [0, 3]\n   b trước f: các cặp x ∈ b, y ∈ f có x > y: (1, 0), (2, 0) → 2\n   f trước b: 2·2 - 2 = 2   (các cặp (3, 1), (3, 2))\n   dp chọn min = 2 → cộng 2\n\nTổng: 0 + 0 + 2 = 2\n```\n\nMột thứ tự duyệt đạt được kết quả này: `fed, fig, bag, bad` → dãy vị trí `[0, 3, 1, 2]`, có đúng 2 nghịch thế `(3, 1)` và `(3, 2)`.\n\n**Input:** `words = [\"a\", \"ab\", \"abc\"]`, `target = [2, 1, 0]` → **Output:** `3`\n\n```\npos: \"a\" → 2, \"ab\" → 1, \"abc\" → 0. Cây là một đường thẳng, không có gì để chọn.\nNút \"ab\": cây con [0], pos của nó là 1 → có 1 phần tử nhỏ hơn → cộng 1\nNút \"a\":  cây con [0, 1], pos của nó là 2 → có 2 phần tử nhỏ hơn → cộng 2\nTổng: 3   (dãy duyệt bắt buộc là [2, 1, 0])\n```"}, {"title": "Ghi nhớ", "text": "Bài tối ưu trên cây với lựa chọn tại từng nút: tìm cách **tách hàm mục tiêu thành tổng các phần chỉ phụ thuộc một nút**, khi đó mỗi nút tối ưu độc lập. Ràng buộc nhỏ lạ thường (bảng chữ cái chỉ `a…j` → tối đa 10 con) là lời gợi ý cho `2^10` — bitmask DP."}], "code": "class Solution {\n    var kids = [[Int]]()   // kids[u][c] = nút con theo chữ c, -1 nếu không có\n    var mark = [Int]()     // pos trong target của từ kết thúc ở nút, -1 nếu không có\n    var res = 0\n\n    // số cặp (x thuộc a, y thuộc b) có x > y; a, b đã sắp tăng\n    func cross(_ a: [Int], _ b: [Int]) -> Int {\n        var j = 0, cnt = 0\n        for x in a {\n            while j < b.count && b[j] < x { j += 1 }\n            cnt += j\n        }\n        return cnt\n    }\n\n    // trả về danh sách pos (đã sắp) của cả cây con gốc u\n    func dfs(_ u: Int) -> [Int] {\n        var lists = [[Int]]()\n        for c in kids[u] where c != -1 {\n            lists.append(dfs(c))\n        }\n        let m = lists.count\n\n        if m >= 2 {\n            // inv[i][j]: số nghịch thế giữa 2 nhánh nếu nhánh i đứng trước nhánh j\n            var inv = [[Int]](repeating: [Int](repeating: 0, count: m), count: m)\n            for i in 0..<m {\n                for j in i + 1..<m {\n                    inv[i][j] = cross(lists[i], lists[j])\n                    inv[j][i] = lists[i].count * lists[j].count - inv[i][j]\n                }\n            }\n\n            // dp[mask]: chi phí nhỏ nhất khi các nhánh trong mask được xếp trước\n            let full = 1 << m\n            var w = [[Int]](repeating: [Int](repeating: 0, count: full), count: m)\n            for c in 0..<m {\n                for mask in 1..<full {\n                    let low = mask.trailingZeroBitCount\n                    w[c][mask] = w[c][mask & (mask - 1)] + inv[low][c]\n                }\n            }\n            var dp = [Int](repeating: Int.max, count: full)\n            dp[0] = 0\n            for mask in 1..<full {\n                for c in 0..<m where mask >> c & 1 == 1 {\n                    let prev = mask ^ (1 << c)\n                    dp[mask] = min(dp[mask], dp[prev] + w[c][prev])\n                }\n            }\n            res += dp[full - 1]\n        }\n\n        var all = lists.flatMap { $0 }\n        if mark[u] != -1 {\n            // từ ở chính nút u luôn được ghi trước mọi từ trong cây con\n            res += all.filter { $0 < mark[u] }.count\n            all.append(mark[u])\n        }\n        return all.sorted()\n    }\n\n    func minInversions(_ words: [String], _ target: [Int]) -> Int {\n        let n = words.count\n        var pos = [Int](repeating: 0, count: n)\n        for i in 0..<n { pos[target[i]] = i }\n\n        kids = [[Int](repeating: -1, count: 10)]\n        mark = [-1]\n        for (i, word) in words.enumerated() {\n            var u = 0\n            for ch in word.utf8 {\n                let c = Int(ch) - 97\n                if kids[u][c] == -1 {\n                    kids[u][c] = kids.count\n                    kids.append([Int](repeating: -1, count: 10))\n                    mark.append(-1)\n                }\n                u = kids[u][c]\n            }\n            mark[u] = pos[i]\n        }\n\n        res = 0\n        _ = dfs(0)\n        return res\n    }\n}\n"}, {"id": 4078, "category": "contests", "title": "Three Fibonacci Sum", "slug": "three-fibonacci-sum", "difficulty": "Easy", "topics": ["Weekly Contest 523", "Math", "Simulation"], "date": "2026-10-11", "time": "O(log n)", "space": "O(1)", "status": "Accepted", "sections": [{"title": "Đề bài", "text": "Cho số nguyên `n` (`1 ≤ n ≤ 10⁹`). Trả về `true` nếu `n` bằng tổng của **ba số liên tiếp** trong dãy Fibonacci `0, 1, 1, 2, 3, 5, 8, …`."}, {"title": "Cơ sở lý thuyết", "text": "- **Dãy Fibonacci tăng theo hàm mũ** (xấp xỉ nhân `1.618` mỗi bước): chỉ khoảng 45 số hạng là đã vượt `10⁹`. Vì thế duyệt thẳng toàn bộ dãy là `O(log n)`.\n- **Cửa sổ trượt ba phần tử** trên một dãy sinh dần: không cần lưu cả dãy, chỉ giữ ba số liên tiếp `(a, b, c)` và dịch thành `(b, c, b + c)`.\n- Ghi chú: `F(i) + F(i+1) + F(i+2) = 2·F(i+2)`, nên câu hỏi tương đương \"`n` chẵn và `n / 2` là số Fibonacci (từ `F(2)` trở đi)\". Không cần dùng, nhưng giải thích vì sao đáp án thưa."}, {"title": "Hướng xử lý", "text": "1. Bắt đầu với ba số đầu `(0, 1, 1)`.\n2. Lặp khi tổng ba số chưa vượt `n`:
